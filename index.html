function searchVenue(){
  var q = (document.getElementById('g_map_q')||{}).value;
  if(!q || !q.trim()){ toast('검색어를 입력하세요'); return; }
  var box = document.getElementById('g_map_results');
  if(box) box.innerHTML = '<div class="map-loading">검색 중...</div>';
  if(mapProvider==='kakao' && window.kakao && kakao.maps.services){ kakaoSearch_(q.trim(), box); return; }
  osmSearch_(q.trim(), box);
}
function pickResultIdx(i){
  var h=(window._venueHits||{})[i]; if(!h) return;
  pickResult(h.lat, h.lng, h.name);
}
/* 기존 상대팀 목록 (중복 제거·정렬) — 같은 팀 이름 통일용 datalist */
function matchOpponents_(){
  var s={}; (state.matches||[]).forEach(function(m){ var o=(m.opponent||'').trim(); if(o) s[o]=1; });
  return Object.keys(s).sort();
}
/* 과거 경기장 목록 (이름별, 좌표 있는 기록 우선) — 선택 시 지도 위치까지 불러오기 */
function pastVenues_(){
  var map={}; (state.matches||[]).forEach(function(m){
    var v=(m.venue||'').trim(); if(!v) return;
    var hasXY=(m.lat!=null&&m.lat!==''&&m.lng!=null&&m.lng!=='');
    var cur=map[v];
    var curHasXY = cur && cur.lat!=='' && cur.lat!=null;
    if(!cur || (hasXY && !curHasXY)) map[v]={venue:v, lat:(hasXY?Number(m.lat):''), lng:(hasXY?Number(m.lng):''), venueUrl:m.venueUrl||''};
  });
  return Object.keys(map).sort().map(function(k){ return map[k]; });
}
/* 경기장 이름이 과거 경기장과 일치하면 지도 좌표·링크까지 불러오기 (새 이름이면 무시) */
function loadPastVenue_(name){
  name=(name||'').trim(); if(!name) return;
  var list=pastVenues_(), pv=null;
  for(var i=0;i<list.length;i++){ if(list[i].venue===name){ pv=list[i]; break; } }
  if(!pv) return;
  if(pv.lat!==''&&pv.lat!=null&&pv.lng!==''&&pv.lng!=null){
    var lat=Number(pv.lat), lng=Number(pv.lng);
    venuePick={lat:lat, lng:lng}; venuePickUrl=pv.venueUrl||'';
    if(mapProvider==='kakao' && kakaoMap){ kakaoMap.setCenter(new kakao.maps.LatLng(lat,lng)); kakaoMap.setLevel(3); setKakaoMarker(lat,lng,false); }
    else if(venueMap){ venueMap.setView([lat,lng],16); placeMarker(lat,lng); }
    setVenueStatus();
    toast('과거 경기장 위치를 불러왔어요');
  } else if(pv.venueUrl){ venuePickUrl=pv.venueUrl; }
}
function pickResult(lat, lng, name){
  lat=Number(lat); lng=Number(lng);
  venuePick={lat:lat, lng:lng};
  if(mapProvider==='kakao' && kakaoMap){ kakaoMap.setCenter(new kakao.maps.LatLng(lat,lng)); kakaoMap.setLevel(3); setKakaoMarker(lat,lng,false); }
  else if(venueMap){ venueMap.setView([lat,lng], 16); placeMarker(lat,lng); }
  var v = document.getElementById('g_venue');
  if(v && !v.value.trim() && name) v.value = name;
  var box = document.getElementById('g_map_results'); if(box) box.innerHTML='';
  setVenueStatus();
}
function saveMatch(id){
  var date = document.getElementById('g_date').value;
  var opp = document.getElementById('g_opp').value.trim();
  if(!date || !opp){ toast('날짜와 상대팀은 필수입니다'); return; }
  var prev = id ? (state.matches.filter(function(x){return x.id===id;})[0]||{}) : {};
  var lat = venuePick ? venuePick.lat : (prev.lat!=null?prev.lat:'');
  var lng = venuePick ? venuePick.lng : (prev.lng!=null?prev.lng:'');
  var url = venuePick ? ('https://www.google.com/maps?q='+venuePick.lat+','+venuePick.lng) : (venuePickUrl || prev.venueUrl || '');
  var data = {
    date: date,
    time: document.getElementById('g_time').value,
    opponent: opp,
    venue: document.getElementById('g_venue').value.trim(),
    lat: lat, lng: lng,
    venueUrl: url,
    recMatch: !!(document.getElementById('g_recMatch')||{checked:true}).checked,
    recAtt: !!(document.getElementById('g_recAtt')||{checked:true}).checked,
    recGoal: !!(document.getElementById('g_recGoal')||{checked:true}).checked,
    recAssist: !!(document.getElementById('g_recAssist')||{checked:true}).checked
  };
  if(!data.recMatch){ data.ourScore=''; data.oppScore=''; data.result=''; }
  var fn = id ? 'updateMatch' : 'addMatch';
  if(id) data.id = id;
  closeSheet();
  toast(id?'경기를 수정했습니다':'경기를 등록했습니다');
  // 경기 등록/수정은 스쿼드와 무관 — 경기 목록만 갱신 (스쿼드는 스쿼드 탭에서 별도 관리)
  API.run(fn, data).then(function(list){
    state.matches = list;
    state.matchShow = REC_PAGE;   // 목록 상단(최신)부터 다시 표시
    if(state.screen==='squad'||state.screen==='att') render();
  }).catch(function(){ toast('저장 실패 · 새로고침'); });
}
function deleteMatchConfirm(id){
  if(!requireAdmin()) return;
  var m=(state.matches||[]).filter(function(x){return x.id===id;})[0];
  confirmDelete_('이 경기를 삭제할까요?'+(m&&m.opponent?' (vs '+esc(m.opponent)+')':'')+'<br><span style="font-size:12px;color:var(--steel-soft);">관련 스쿼드·기록도 함께 삭제됩니다.</span>', function(){ doDeleteMatch(id); });
}
function doDeleteMatch(id){
  state.matches = state.matches.filter(function(m){return m.id!==id;});
  closeSheet(); toast('경기를 삭제했습니다'); render();
  API.run('deleteMatch', id).then(function(list){ state.matches = list; if(state.screen==='squad'||state.screen==='att') render(); }).catch(function(){ toast('삭제 저장 실패 · 새로고침'); });
}
/* 빈 경기 = 상대팀·결과·점수가 모두 없는 경기 (잘못 자동 생성된 경기) */
function isEmptyMatch_(m){
  var noOpp = !m.opponent || String(m.opponent).trim()==='';
  var noScore = (m.ourScore==null || m.ourScore==='') && (m.oppScore==null || m.oppScore==='');
  var noResult = !(m.result==='W'||m.result==='D'||m.result==='L');
  return noOpp && noScore && noResult;
}
function emptyMatchCount_(){ return (state.matches||[]).filter(isEmptyMatch_).length; }
function cleanupEmptyMatches_(){
  if(!requireAdmin()) return;
  var empties=(state.matches||[]).filter(isEmptyMatch_);
  if(!empties.length){ toast('정리할 빈 경기가 없어요'); return; }
  appConfirm_('상대팀·결과가 없는 빈 경기 '+empties.length+'건을 삭제할까요?\n(잘못 생성된 경기 정리용 · 관련 기록도 함께 정리)', function(){
    var ids=empties.map(function(m){return m.id;});
    state.matches=(state.matches||[]).filter(function(m){return ids.indexOf(m.id)<0;});   // 낙관적 즉시 제거
    var chain=Promise.resolve();
    ids.forEach(function(id){ chain=chain.then(function(){ return API.run('deleteMatch', id).then(function(list){ if(list) state.matches=list; }); }); });
    chain.then(function(){
      state.recLoaded=false; state.matchesLoaded=true;
      toast('빈 경기 '+ids.length+'건을 정리했어요');
      render();
    }).catch(function(){ toast('일부 삭제 실패 · 새로고침 후 확인해주세요'); render(); });
  });
}

function onRecordMatchTap(matchId){
  if(isAdmin()) openResultForm(matchId);
  else openMatchReport(matchId);
}

function openResultForm(matchId){
  if(!requireAdmin()) return;

  var m = state.recMatches.filter(function(x){return x.id===matchId;})[0];
  if(!m) return;
  var stats = {};
  state.recStats.filter(function(s){return s.matchId===matchId;}).forEach(function(s){ stats[s.playerId]={g:s.goals,a:s.assists}; });
  // 현재 출석 상태 로드
  state.formAtt = {};
  (state.recAtt||[]).filter(function(x){return x.matchId===matchId;}).forEach(function(x){ state.formAtt[x.playerId]=x.status||'present'; });
  // 이 경기에 이미 출석 기록이 있으면(엑셀 업로드·기존 입력 등) 기록 없는 인원은 '미정'으로 둔다.
  // 기록이 전혀 없는 신규 경기에서만 편의상 '참석'을 기본값으로 사용.
  var attDefault = (state.recAtt||[]).some(function(x){return x.matchId===matchId;}) ? 'none' : 'present';
  state._attDefault = attDefault;

  // 기록 여부 플래그 (해제 항목은 입력에서 제외)
  var fMatch=recOn_(m,'recMatch'), fAtt=recOn_(m,'recAtt'), fGoal=recOn_(m,'recGoal'), fAssist=recOn_(m,'recAssist');
  var players = state.players.filter(isActiveP_).slice().sort(numSort);
  var inactiveN = state.players.length - players.length;
  var statRows = players.map(function(p){
    var st = stats[p.id] || {g:0,a:0};
    var cur = state.formAtt[p.id] || attDefault;
    var inputs = '';
    if(fGoal) inputs += '<span style="font-size:11px;color:var(--steel);">골</span>'
      + '<input id="st_g_'+p.id+'" type="number" inputmode="numeric" min="0" value="'+(st.g||0)+'" style="width:40px;padding:7px 3px;border:1.5px solid var(--line-strong);border-radius:9px;text-align:center;font-family:inherit;font-size:14px;">';
    if(fAssist) inputs += '<span style="font-size:11px;color:var(--steel);">도움</span>'
      + '<input id="st_a_'+p.id+'" type="number" inputmode="numeric" min="0" value="'+(st.a||0)+'" style="width:40px;padding:7px 3px;border:1.5px solid var(--line-strong);border-radius:9px;text-align:center;font-family:inherit;font-size:14px;">';
    var attSegs = fAtt
      ? '<div class="att-seg" style="margin-top:6px;">'
        + attSeg(p.id,'present','참석',cur) + attSeg(p.id,'late','지각',cur) + attSeg(p.id,'absent','불참',cur) + attSeg(p.id,'excused','미참석',cur)
        + '</div>'
      : '';
    return '<div class="res-row" data-pid="'+p.id+'">'
      + '<div style="display:flex;align-items:center;gap:8px;">'
      +   '<span class="oswald" style="font-weight:700;font-size:16px;width:26px;text-align:center;">'+numLabel(p.num)+'</span>'
      +   '<span style="flex:1;font-weight:600;font-size:14px;">'+esc(p.name)+'</span>'
      +   inputs
      + '</div>'
      + attSegs + '</div>';
  }).join('');
  if(inactiveN>0) statRows += '<p style="font-size:11.5px;color:var(--steel-soft);margin:8px 2px 0;">부상·휴식 등 상태가 설정된 '+inactiveN+'명은 입력에서 제외됩니다. (기존 기록은 유지)</p>';
  var offNames=[]; if(!fMatch) offNames.push('경기'); if(!fAtt) offNames.push('출석'); if(!fGoal) offNames.push('득점'); if(!fAssist) offNames.push('어시');
  var offNote = offNames.length ? '<p style="font-size:11.5px;color:var(--steel-soft);margin:0 0 10px;">이 경기는 <b>'+offNames.join('·')+'</b> 기록을 사용하지 않아요. (경기 등록에서 변경 가능)</p>' : '';
  var rowLabels=[]; if(fGoal) rowLabels.push('득점'); if(fAssist) rowLabels.push('도움'); if(fAtt) rowLabels.push('출석');

  var html = '<div class="grabber"></div>'
   + '<div class="sheet-head"><h3>경기 결과 · '+esc(m.opponent)+'</h3><button class="x" onclick="closeSheet()">✕</button></div>'
   + '<div class="sheet-body">'
   +   offNote
   +   (fMatch ? ('<div class="field"><label>스코어</label>'
   +     '<div style="display:flex;align-items:center;gap:12px;justify-content:center;">'
   +       '<span style="font-weight:700;font-size:13px;">'+esc(ourTeamName_())+'</span>'
   +       '<input id="r_our" type="number" inputmode="numeric" min="0" value="'+(m.ourScore!==undefined&&m.ourScore!==''?m.ourScore:0)+'" style="width:60px;padding:12px;border:1.5px solid var(--line-strong);border-radius:12px;text-align:center;font-family:Oswald;font-weight:700;font-size:22px;">'
   +       '<span style="color:var(--steel-soft);font-weight:700;">:</span>'
   +       '<input id="r_opp" type="number" inputmode="numeric" min="0" value="'+(m.oppScore!==undefined&&m.oppScore!==''?m.oppScore:0)+'" style="width:60px;padding:12px;border:1.5px solid var(--line-strong);border-radius:12px;text-align:center;font-family:Oswald;font-weight:700;font-size:22px;">'
   +       '<span style="font-weight:700;font-size:13px;flex:1;">'+esc(m.opponent)+'</span>'
   +     '</div></div>') : '')
   +   (rowLabels.length ? ('<div class="field"><label>선수별 '+rowLabels.join(' · ')+'</label>'
   +     '<div>'+statRows+'</div></div>') : '')
   +   ((fMatch||rowLabels.length) ? '<button class="btn-primary" onclick="saveResult(\''+matchId+'\')">저장하기</button>'
       : '<div class="empty" style="padding:24px;">이 경기는 모든 기록 항목이 꺼져 있어요.<br>경기 등록에서 기록 여부를 켜면 입력할 수 있습니다.</div>')
   + '</div>';
  showSheet(html);
}
function attSeg(pid, val, label, cur){
  return '<button class="att-opt '+(cur===val?('on '+val):'')+'" data-pid="'+pid+'" data-val="'+val+'" onclick="pickAtt(\''+pid+'\',\''+val+'\')">'+label+'</button>';
}
function pickAtt(pid, val){
  state.formAtt[pid] = val;
  var row = document.querySelector('.res-row[data-pid="'+pid+'"] .att-seg');
  if(!row) return;
  Array.prototype.forEach.call(row.querySelectorAll('.att-opt'), function(b){
    var on = b.getAttribute('data-val')===val;
    b.className = 'att-opt' + (on ? (' on '+val) : '');
  });
}
function applyRecBundle_(b){
  if(!b) return;
  state.recMatches=b.matches||state.recMatches;
  state.recStats=b.stats||state.recStats;
  state.recAtt=b.attendance||state.recAtt;
}
function saveResult(matchId){
  var m = state.recMatches.filter(function(x){return x.id===matchId;})[0] || {};
  var fMatch=recOn_(m,'recMatch'), fAtt=recOn_(m,'recAtt'), fGoal=recOn_(m,'recGoal'), fAssist=recOn_(m,'recAssist');
  var our = parseInt((document.getElementById('r_our')||{}).value)||0;
  var opp = parseInt((document.getElementById('r_opp')||{}).value)||0;
  var stats = [];
  var att = [];
  state.players.forEach(function(p){
    if(!isActiveP_(p)){
      // 비활동 선수: 화면에 없으므로 기존 기록만 그대로 보존
      var exSt=(state.recStats||[]).filter(function(x){return x.matchId===matchId && x.playerId===p.id;})[0];
      if(exSt && ((exSt.goals||0)>0 || (exSt.assists||0)>0)) stats.push({playerId:p.id, goals:exSt.goals||0, assists:exSt.assists||0});
      if(state.formAtt[p.id]) att.push({playerId:p.id, status:state.formAtt[p.id]});
      return;
    }
    var g = fGoal ? (parseInt((document.getElementById('st_g_'+p.id)||{}).value)||0) : 0;
    var a = fAssist ? (parseInt((document.getElementById('st_a_'+p.id)||{}).value)||0) : 0;
    if(g>0||a>0) stats.push({playerId:p.id, goals:g, assists:a});
    att.push({playerId:p.id, status:(state.formAtt[p.id]||state._attDefault||'present')});
  });
  var btn=document.querySelector('.btn-primary'); if(btn){btn.textContent='저장 중...';btn.disabled=true;}
  var chain = Promise.resolve();
  if(fMatch) chain = chain.then(function(){ return API.run('recordMatchResult', matchId, our, opp).then(applyRecBundle_); });
  if(fGoal||fAssist) chain = chain.then(function(){ return API.run('setMatchStats', matchId, stats).then(applyRecBundle_); });
  if(fAtt) chain = chain.then(function(){ return API.run('setMatchAttendance', matchId, att).then(applyRecBundle_); });
  chain.then(function(){
    closeSheet(); render(); toast('경기 결과를 저장했습니다');
  }).catch(function(){ if(btn){btn.textContent='다시 시도';btn.disabled=false;} toast('저장에 실패했습니다'); });
}

function showSheet(html){
  // 시트 열기 전 본문 스크롤 위치 저장 (모바일 오버레이 후 목록이 맨 위로 튀는 것 방지)
  var c = document.getElementById('content'); state._preSheetScroll = c ? c.scrollTop : 0;
  document.getElementById('sheet').innerHTML = html;
  document.getElementById('sheetWrap').classList.add('open');
}

/* ================= Toast ================= */
var toastTimer;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1900);
}

/* 앱 스타일 확인 모달 */
var _cfmCb=null;
function appConfirm_(msg, onOk){
  var w=document.getElementById('cfmWrap'), m=document.getElementById('cfmMsg');

  m.textContent=msg; _cfmCb=onOk||null; w.classList.add('open');

function closeConfirm_(ok){
  var w=document.getElementById('cfmWrap'); if(w) w.classList.remove('open');

/* ================= 접근 PIN =================
 * 로그인 대신 PIN 하나로만 보호한다.
 * - 최초 실행(설정된 PIN 없음): PIN 설정 → 해시를 Firestore config에 저장
 * - 이후: PIN 입력(기기당 한 번) → localStorage에 통과 기록
 */
var PIN_KEY = 'kt_pin_ok';
function pinPass_(){ try{ return localStorage.getItem(PIN_KEY)||''; }catch(e){ return ''; } }
function pinRemember_(h){ try{ localStorage.setItem(PIN_KEY, h); }catch(e){} }
function pinGate_(done){
  var h = state.cfg && state.cfg.adminPinHash;
  if(!h){ renderPin_(true, done); return; }
  if(pinPass_()===h){ done(); return; }
  renderPin_(false, done);
}
function renderPin_(setup, done){
  window._pinDone = done;
  var el = document.getElementById('pinScreen'); if(!el){ done(); return; }
  var form = setup
    ? '<div class="auth-team-name">🔒 관리자 PIN 설정<br><span style="font-size:12px;font-weight:400;color:rgba(255,255,255,.75);">처음 실행입니다. 사용할 PIN을 정해주세요 (숫자·문자 4자 이상)</span></div>'
      + '<input id="pin_1" type="password" placeholder="새 PIN">'
      + '<input id="pin_2" type="password" placeholder="새 PIN 확인" onkeydown="if(event.key===\'Enter\')pinSubmit_(true)">'
      + '<button class="auth-btn" onclick="pinSubmit_(true)">설정하고 시작</button>'
    : '<input id="pin_1" type="password" placeholder="PIN 입력" onkeydown="if(event.key===\'Enter\')pinSubmit_(false)">'
      + '<button class="auth-btn" onclick="pinSubmit_(false)">확인</button>'
      + '<p class="auth-hint">이 기기에서 한 번만 입력하면 다음부터 바로 열려요.</p>';
  el.innerHTML = '<div class="auth-inner">'
    + '<img class="auth-logo" src="'+APP_LOGO+'" alt="'+esc(APP_NAME)+'">'
    + '<div class="auth-title">FC JEMIRO</div>'
    + '<div class="auth-sub">'+APP_SUB+'</div>'
    + '<div class="auth-form">'+form+'</div>'
    + '</div>';
  el.style.display='flex';
  var tb=document.getElementById('tabbar'); if(tb) tb.style.display='none';
  var fb=document.getElementById('fab'); if(fb) fb.style.display='none';
  setTimeout(function(){ var i=document.getElementById('pin_1'); if(i) i.focus(); }, 80);
}
function pinHide_(){ var el=document.getElementById('pinScreen'); if(el) el.style.display='none'; }
function pinSubmit_(setup){
  var v1=(gv_('pin_1')||'').trim();
  if(setup){
    var v2=(gv_('pin_2')||'').trim();
    if(v1.length<4){ toast('PIN은 4자리 이상으로 정해주세요'); return; }

/* ================= 공유 카드 (이미지 생성·공유) ================= */
var CARD_INK='#111015', CARD_RED='#C8102E', CARD_GOLD='#C7A24B', CARD_PAPER='#F6F5F3', CARD_LINE='#EAE8E4', CARD_STEEL='#6B6E76';
var CARD_HDR=250;
function loadImg_(src){ return new Promise(function(res){ if(!src){ res(null); return; } var i=new Image(); i.onload=function(){ res(i); }; i.onerror=function(){ res(null); }; i.src=src; }); }
function rr_(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function circImg_(ctx,img,cx,cy,r){ ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.clip(); ctx.drawImage(img,cx-r,cy-r,r*2,r*2); ctx.restore(); }
function drawCover_(ctx,img,x,y,w,h){
  var ir=img.width/img.height, r=w/h, sw,sh,sx,sy;
  if(ir>r){ sh=img.height; sw=sh*r; sx=(img.width-sw)/2; sy=0; }
  else { sw=img.width; sh=sw/r; sx=0; sy=(img.height-sh)*0.35; }
  ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h);
}
function fontsReady_(cb){
  try{
    Promise.all([
      document.fonts.load('700 64px Oswald'), document.fonts.load('600 30px Oswald'),
      document.fonts.load('700 40px Pretendard'), document.fonts.load('500 28px Pretendard'),
      document.fonts.ready
    ]).then(function(){ cb(); }, function(){ cb(); });
  }catch(e){ cb(); }
}
function teamEmblemSrc_(){ var c=activeClub(); return (c&&c.emblem)?c.emblem:APP_LOGO; }
function teamBgSrc_(){ var c=activeClub(); return (c&&c.bg)?c.bg:APP_BG; }
function wrapText_(ctx, text, maxW){
  var out=[];
  String(text||'').split('\n').forEach(function(line){
    if(line===''){ out.push(''); return; }
    var cur='';
    for(var i=0;i<line.length;i++){
      var t=cur+line.charAt(i);
      if(ctx.measureText(t).width>maxW && cur){ out.push(cur); cur=line.charAt(i); }
      else cur=t;
    }
    out.push(cur);
  });
  return out;
}
function cardEllipsis_(ctx, text, maxW){
  text=String(text||'');
  if(ctx.measureText(text).width<=maxW) return text;
  while(text.length>1 && ctx.measureText(text+'…').width>maxW) text=text.slice(0,-1);
  return text+'…';
}
/* 공통: 헤더(팀 배경사진+엠블럼) / 워터마크 / 패널 / 섹션 타이틀 / 푸터 */
function cardHeader_(ctx, W, title, sub, emblemImg, bgImg){
  ctx.fillStyle=CARD_INK; ctx.fillRect(0,0,W,CARD_HDR);
  if(bgImg){
    drawCover_(ctx,bgImg,0,0,W,CARD_HDR);
    var g=ctx.createLinearGradient(0,0,0,CARD_HDR);
    g.addColorStop(0,'rgba(10,9,14,.50)'); g.addColorStop(1,'rgba(10,9,14,.84)');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,CARD_HDR);
  }
  ctx.fillStyle=CARD_GOLD; ctx.fillRect(0,CARD_HDR-5,W,5);
  var tx=60;
  if(emblemImg){
    ctx.save(); ctx.shadowColor='rgba(0,0,0,.45)'; ctx.shadowBlur=18; ctx.shadowOffsetY=5;
    ctx.beginPath(); ctx.arc(130,125,72,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill(); ctx.restore();
    ctx.beginPath(); ctx.arc(130,125,72,0,Math.PI*2); ctx.lineWidth=4; ctx.strokeStyle=CARD_GOLD; ctx.stroke();
    circImg_(ctx, emblemImg, 130, 125, 65);
    tx=242;
  }
  ctx.save(); ctx.shadowColor='rgba(0,0,0,.45)'; ctx.shadowBlur=10;
  ctx.fillStyle='#fff'; ctx.font='700 64px Oswald, sans-serif'; ctx.textBaseline='middle'; ctx.textAlign='left';
  ctx.fillText(String(title||''), tx, sub?102:126);
  ctx.restore();
  if(sub){ ctx.fillStyle=CARD_GOLD; ctx.font='600 28px Pretendard, sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillText(String(sub), tx, 160); }
}
function cardWatermark_(ctx, W, H, emblem){
  if(!emblem) return;
  ctx.save(); ctx.globalAlpha=0.055;
  var s=560;
  ctx.drawImage(emblem, W-s+130, H-s+60, s, s);
  ctx.restore();
}
function panel_(ctx,x,y,w,h,r,fill){
  ctx.save(); ctx.shadowColor='rgba(17,16,21,.12)'; ctx.shadowBlur=18; ctx.shadowOffsetY=6;
  rr_(ctx,x,y,w,h,r); ctx.fillStyle=fill||'#fff'; ctx.fill(); ctx.restore();
  rr_(ctx,x,y,w,h,r); ctx.strokeStyle=(fill&&fill!=='#fff')?'rgba(199,162,75,.45)':CARD_LINE; ctx.lineWidth=2; ctx.stroke();
}
function sectionTitle_(ctx, x, y, kr, en){
  ctx.fillStyle=CARD_RED; ctx.fillRect(x, y-17, 7, 34);
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillStyle=CARD_INK; ctx.font='700 34px Pretendard, sans-serif';
  ctx.fillText(kr, x+26, y);
  if(en){
    var w=ctx.measureText(kr).width;
    ctx.fillStyle=CARD_GOLD; ctx.font='600 23px Oswald, sans-serif';
    ctx.fillText(en, x+26+w+18, y+3);
  }
}
function cardFooter_(ctx, W, H){
  ctx.fillStyle='rgba(199,162,75,.55)'; ctx.fillRect(W/2-190, H-64, 120, 2);
  ctx.fillRect(W/2+70, H-64, 120, 2);
  ctx.fillStyle='#9FA2A9'; ctx.font='600 24px Oswald, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('FC JEMIRO · FOOTBALL CLUB', W/2, H-40);
}
/* 미리보기 시트: 생성 → 확인 → 공유(사진첩)/다운로드. 버튼 탭 시점에 공유해 모바일 공유시트가 항상 뜬다 */
var _cardBlob=null, _cardName='';
function showCardPreview_(canvas, name){
  _cardName=name; _cardBlob=null;
  try{ canvas.toBlob(function(b){ _cardBlob=b; }, 'image/png'); }catch(e){}
  var url=canvas.toDataURL('image/png');
  showSheet('<div class="grabber"></div>'
   + '<div class="sheet-head"><h3>카드 미리보기</h3><button class="x" onclick="closeSheet()">✕</button></div>'
   + '<div class="sheet-body">'
   +   '<img src="'+url+'" style="width:100%;border-radius:14px;border:1px solid var(--line-strong);display:block;box-shadow:var(--shadow-sm);" alt="card">'
   +   '<button class="btn-primary" style="margin-top:14px;" onclick="shareCardNow_()">📤 공유 · 사진첩에 저장</button>'
   +   '<button class="btn-ghost" onclick="downloadCardNow_()">⬇️ 파일로 다운로드</button>'
   + '</div>');
}
function dlBlob_(blob, name){
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ try{ URL.revokeObjectURL(a.href); a.parentNode.removeChild(a); }catch(e){} }, 600);
  toast('이미지를 저장했습니다');
}
function shareCardNow_(){
  if(!_cardBlob){ toast('카드를 준비 중이에요 · 잠시 후 다시 눌러주세요'); return; }
  var file=null;
  try{ file=new File([_cardBlob], _cardName, {type:'image/png'}); }catch(e){}
  if(file && navigator.canShare && navigator.share && navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).catch(function(e){ if(!e || e.name!=='AbortError') dlBlob_(_cardBlob, _cardName); });
  } else { dlBlob_(_cardBlob, _cardName); }
}
function downloadCardNow_(){ if(_cardBlob) dlBlob_(_cardBlob, _cardName); else toast('카드를 준비 중이에요'); }

var POS_COLORS={GK:'#E0A400',DF:'#2563C9',CB:'#2563C9',LB:'#2563C9',RB:'#2563C9',LWB:'#2563C9',RWB:'#2563C9',
  MF:'#1E9E6A',DM:'#1E9E6A',CM:'#1E9E6A',AM:'#1E9E6A',FW:'#C8102E',ST:'#C8102E',CF:'#C8102E',LW:'#C8102E',RW:'#C8102E'};
function drawPitch_(ctx,x,y,w,h){
  ctx.save(); ctx.shadowColor='rgba(17,16,21,.18)'; ctx.shadowBlur=22; ctx.shadowOffsetY=8;
  rr_(ctx,x,y,w,h,22); ctx.fillStyle='#2f8f57'; ctx.fill(); ctx.restore();
  rr_(ctx,x,y,w,h,22); ctx.save(); ctx.clip();
  var stripes=8;
  for(var i=0;i<stripes;i++){ ctx.fillStyle=(i%2?'#2b8551':'#2f8f57'); ctx.fillRect(x, y+h*i/stripes, w, h/stripes+1); }
  ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=3;
  ctx.strokeRect(x+16,y+16,w-32,h-32);
  ctx.beginPath(); ctx.moveTo(x+16,y+h/2); ctx.lineTo(x+w-16,y+h/2); ctx.stroke();
  ctx.beginPath(); ctx.arc(x+w/2,y+h/2,h*0.085,0,Math.PI*2); ctx.stroke();
  var bw=w*0.44, bh=h*0.11;
  ctx.strokeRect(x+(w-bw)/2, y+16, bw, bh);
  ctx.strokeRect(x+(w-bw)/2, y+h-16-bh, bw, bh);
  ctx.restore();
  rr_(ctx,x,y,w,h,22); ctx.strokeStyle='#2c6e49'; ctx.lineWidth=5; ctx.stroke();
}
function drawToken_(ctx,cx,cy,m,img){
  var col = m.guest ? '#6B7280' : (POS_COLORS[m.position]||CARD_INK);
  var r=42;
  ctx.save(); ctx.shadowColor='rgba(0,0,0,.35)'; ctx.shadowBlur=10; ctx.shadowOffsetY=4;
  ctx.beginPath(); ctx.arc(cx,cy,img?(r+5):r,0,Math.PI*2); ctx.fillStyle=col; ctx.fill(); ctx.restore();
  if(img){
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
    circImg_(ctx,img,cx,cy,r);
    ctx.font='600 20px Oswald, sans-serif';
    var pt=String(m.position||''), ptw=ctx.measureText(pt).width+16;
    rr_(ctx,cx+r-ptw+6,cy-r-14,ptw,30,8); ctx.fillStyle=col; ctx.fill();
    ctx.lineWidth=2.5; ctx.strokeStyle='#fff'; ctx.stroke();
    ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(pt, cx+r-ptw/2+6, cy-r+1);
  } else {
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.lineWidth=5; ctx.strokeStyle='#fff'; ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='600 30px Oswald, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(String(m.position||''), cx, cy+1);
  }
  var label=(m.guest?m.num:numTok(m.num))+' '+String(m.name||'');
  ctx.font='700 24px Pretendard, sans-serif';
  var tw=ctx.measureText(label).width;
  var pw=tw+28, py=cy+(img?r+5:r)+12;
  rr_(ctx,cx-pw/2,py,pw,40,10); ctx.fillStyle='rgba(20,18,26,.85)'; ctx.fill();
  ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(label,cx,py+21);
}

/* ── D-day 배너 (팀 탭 상단) ── */
function dDayBanner_(){
  var m=latestMatch(); if(!m || !m.date) return '';
  var today=attToday_();
  if(m.date<today) return '';
  var t=new Date(today+'T00:00:00'), d=new Date(m.date+'T00:00:00');
  var diff=Math.round((d-t)/86400000);
  var dd = diff===0 ? 'D-DAY' : ('D-'+diff);
  return '<div class="dday" onclick="go(\'att\')">'
    + '<div class="dd-n oswald">'+dd+'</div>'
    + '<div class="dd-b"><div class="dd-t">vs '+esc(m.opponent||'상대 미정')+'</div>'
    + '<div class="dd-s">'+fmtMatchWhen(m)+(m.venue?' · 📍 '+esc(m.venue):'')+'</div></div>'
    + '<div class="dd-a">›</div></div>';
}

function calToday_(){ state.calYM=attToday_().slice(0,7); render(); }
function setMatchView_(v){ state.matchView=v; render(); }
function viewCalendar_(){
  var ym=calYM_(), y=Number(ym.slice(0,4)), mo=Number(ym.slice(5,7));
  var first=new Date(y, mo-1, 1), days=new Date(y, mo, 0).getDate(), startDow=first.getDay();

/* ================= Firestore 데이터 계층 =================
 * 설계: 앱 시작 시 Firestore → 메모리(DB) 1회 로드.
 *   읽기 = 메모리에서 즉시(기존 mockHandler 재사용) → 매우 빠름
 *   쓰기 = 메모리 반영 + Firestore에 백그라운드 미러링(변경분만)
 *   비밀번호 = SHA-256 해시로 Firestore에 저장(평문 저장 안 함)
 */
var FS = { enabled:false, loadFailed:false };
FS.ready = new Promise(function(res){ FS._resolve = res; });
/* ── 로컬 캐시: 마지막 조회 데이터를 기기에 저장 → 10분 내 재접속은 네트워크 조회 없이 즉시 시작 ──
 * (30분 · 당겨서 새로고침은 캐시를 건너뛰고 서버에서 새로 조회) */
var KT_CACHE_KEY='kt_cache_v1', KT_CACHE_TTL=30*60*1000;
var _ktSaveT=null;
function ktCacheSave_(){
  clearTimeout(_ktSaveT);
  _ktSaveT=setTimeout(function(){
    try{
      var cid=window.ACTIVE_CLUB||state.activeClubId||'';
      if(!cid) return;
      var o={v:APP_VERSION, ts:Date.now(), cid:cid,
        clubs:DB.clubs, config:DB.config, players:DB.players, matches:DB.matches, squads:DB.squads,
        members:DB.members, notes:DB.notes, stats:DB.stats, attendance:DB.attendance,
        sk:Object.keys(FS._sk||{}),
        kidMids:(FS._kidMids&&FS._kidMids[cid])||{}, kidLite:(FS._kidLite&&FS._kidLite[cid])||{}};
      localStorage.setItem(KT_CACHE_KEY, JSON.stringify(o));
    }catch(e){ try{ localStorage.removeItem(KT_CACHE_KEY); }catch(_){} }
  }, 600);
}
function ktCacheLoad_(){
  try{
    var o=JSON.parse(localStorage.getItem(KT_CACHE_KEY)||'null');
    if(!o || o.v!==APP_VERSION || !o.ts || !o.cid) return null;
    return o;
  }catch(e){ return null; }
}

}
/* 저장 권한 프로브: 로드 완료 후 소량 쓰기를 시도해 문제를 즉시 노출

function fsWriteProbe_(){
  if(!window.db || !FS.enabled) return;
  try{
    var today = new Date().toISOString().slice(0,10);
    try{ if(localStorage.getItem('kt_probe') === today) return; localStorage.setItem('kt_probe', today); }catch(e){}
    db.collection('config').doc('app').set({probeAt:new Date().toISOString()}, {merge:true})
      .catch(function(e){
        try{ console.error('쓰기 프로브 실패', e); }catch(_){}
        window.__fsWriteErr=1;
        var code=(e&&e.code)||'';
        var msg;
        if(code==='resource-exhausted'){
          msg='⚠️ 일일 사용량 한도 초과\n\n오늘 사용할 수 있는 데이터 한도를 모두 소진했습니다.\n한도는 매일 한국시간 오후 4시경 자동으로 초기화됩니다.\n그때까지 저장·조회가 실패할 수 있습니다.';
        } else if(code==='permission-denied'){
          msg='⚠️ 데이터 저장 권한 오류\n\n지금 상태에서는 팀·경기 등 모든 저장이 실패합니다.\nFirebase 콘솔에서 (1) Firestore 규칙, (2) Authentication의 익명 로그인 사용 설정을 확인해주세요.';
        } else if(code==='unavailable' || code==='deadline-exceeded'){
          msg='⚠️ 네트워크 연결 불안정\n\n서버에 연결하지 못했습니다.\n잠시 후 다시 시도해주세요.';
        } else {
          msg='⚠️ 데이터 저장 오류\n\n저장에 실패했습니다. ('+(code||'원인 불명')+')\n잠시 후 다시 시도해주세요.';
        }
        setTimeout(function(){ alert(msg); }, 600);
      });
  }catch(e){}
}

var MATCH_ARG = { setMatchStats:0, setMatchAttendance:0 };
function fsClean(x){ var c={}; for(var k in x){ if(k==='pw'||k==='pwHash'||k==='_row') continue; c[k]=x[k]; } return c; }
function fsSnapshot(keys){
  var s={}; keys.forEach(function(k){ var mm={}; (DB[k]||[]).forEach(function(x){ mm[FS_MAP[k].id(x)]=JSON.parse(JSON.stringify(x)); }); s[k]=mm; });
  return s;
}
function fsSyncDiff(k, beforeMap){
  var m=FS_MAP[k]; var after={}; (DB[k]||[]).forEach(function(x){ after[m.id(x)]=x; });
  var batch=db.batch(); var n=0;
  Object.keys(after).forEach(function(idv){
    var cur=after[idv], prev=beforeMap[idv];
    if(!prev || JSON.stringify(prev)!==JSON.stringify(cur)){ batch.set(db.collection(m.coll).doc(String(idv)), fsClean(cur), {merge:true}); n++; }
  });
  Object.keys(beforeMap).forEach(function(idv){ if(!after[idv]){ batch.delete(db.collection(m.coll).doc(String(idv))); n++; } });
  if(n) batch.commit().catch(function(e){ if(window.console)console.warn('fs sync '+k, e); toast('저장 동기화 실패 · 새로고침'); });
}
function fsSyncConfig(){
  var c={}; for(var k in DB.config){ if(k==='staffPw'||k==='memberPw') continue; c[k]=DB.config[k]; }
  db.collection('config').doc('app').set(c,{merge:true}).catch(function(e){ if(window.console)console.warn('cfg sync',e); });
}

/* 해시 (Apps Script와 동일한 salt로 → 비밀번호 호환) */
function fsHash(pw){
  var enc=new TextEncoder().encode('FCJEMIRO#v1#'+String(pw));
  return crypto.subtle.digest('SHA-256', enc).then(function(buf){
    var hex=Array.prototype.map.call(new Uint8Array(buf), function(b){ return ('0'+b.toString(16)).slice(-2); }).join('');
    return 'v1:'+hex;
  });
}
/* ── 읽기 계측(진단용): 세션 동안 컬렉션별 읽은 문서 수 집계 ──
 * 콘솔에서 kjReads() 실행 시 표로 출력. 문제 원인 파악 후 제거 가능. */
window.__KJR = {n:0, byColl:{}, byCall:{}, t0:Date.now()};
function kjRead_(coll, tag, n){
  try{
    var R=window.__KJR; R.n+=n;
    R.byColl[coll]=(R.byColl[coll]||0)+n;
    var k=coll+' · '+tag;
    R.byCall[k]=(R.byCall[k]||0)+n;
    clearTimeout(R._t); R._t=setTimeout(function(){ if(window.kjReads) window.kjReads(); }, 2500);
  }catch(e){}
}
window.kjReads = function(){
  var R=window.__KJR;
  var sec=Math.round((Date.now()-R.t0)/1000);
  try{
    console.log('=== Firestore 읽기 누계: '+R.n+'건 / 세션 '+sec+'초 ===');
    console.table(Object.keys(R.byCall).sort(function(a,b){return R.byCall[b]-R.byCall[a];})
      .map(function(k){ return {호출:k, 읽은문서:R.byCall[k]}; }));
  }catch(e){}
  return R.n;
};
/* 읽기 오류 공통 처리: 원인별 1회 안내 (규칙 문제와 한도 초과를 구분) */
function fsErr_(e, name){
  var code=(e&&e.code)||'';
  try{ console.error('읽기 실패 '+name+' ['+code+']', e); }catch(_){}
  if(window.__fsReadErr) return [];
  window.__fsReadErr=1;
  var msg;
  if(code==='resource-exhausted') msg='⚠️ 일일 사용량 한도 초과 · 오후 4시경 자동 복구';
  else if(code==='permission-denied') msg='⚠️ 데이터 읽기 권한 오류 · Firestore 규칙 확인 필요';
  else if(code==='unavailable'||code==='deadline-exceeded') msg='⚠️ 네트워크 연결이 불안정합니다';
  else msg='⚠️ 데이터를 불러오지 못했습니다 ('+(code||'원인 불명')+')';
  setTimeout(function(){ toast(msg); }, 800);
  return [];
}
function fsColl(name){ return db.collection(name).get().then(function(snap){ var a=[]; snap.forEach(function(d){ var o=d.data()||{}; a.push(o); }); kjRead_(name,'전체조회',a.length); return a; }).catch(function(e){ return fsErr_(e, name); }); }
/* ── 절약형 로딩: 부팅=핵심만 / 로그인=내 것 / 팀 입장=그 팀 것 / 화면=상세 ── */
function fsQ(coll, field, val){
  return db.collection(coll).where(field,'==',val).get().then(function(snap){ var a=[]; snap.forEach(function(d){ a.push(d.data()||{}); }); kjRead_(coll,'where '+field,a.length); return a; }).catch(function(e){ return fsErr_(e, coll); });
}
function fsQ2(coll, f1, v1, f2, v2){
  return db.collection(coll).where(f1,'==',v1).where(f2,'==',v2).get().then(function(snap){ var a=[]; snap.forEach(function(d){ a.push(d.data()||{}); }); kjRead_(coll,'where '+f1+'+'+f2,a.length); return a; }).catch(function(e){ return fsErr_(e, coll); });
}
function fsIn(coll, field, ids){
  ids=(ids||[]).filter(function(x){return x!=null&&x!=='';});
  if(!ids.length) return Promise.resolve([]);
  var chunks=[]; for(var i=0;i<ids.length;i+=10) chunks.push(ids.slice(i,i+10));
  return Promise.all(chunks.map(function(ch){
    return db.collection(coll).where(field,'in',ch).get().then(function(snap){ var a=[]; snap.forEach(function(d){ a.push(d.data()||{}); }); kjRead_(coll,'in '+field,a.length); return a; }).catch(function(e){ return fsErr_(e, coll); });
  })).then(function(rr){ var out=[]; rr.forEach(function(x){ out=out.concat(x); }); return out; });
}
function fsMerge(key, arr){
  var m=FS_MAP[key]; if(!m){ DB[key]=arr; return; }
  var map={}; (DB[key]||[]).forEach(function(x){ map[m.id(x)]=x; });
  (arr||[]).forEach(function(x){ map[m.id(x)]=x; });
  DB[key]=Object.keys(map).map(function(k){ return map[k]; });
}
function fsLoadAll(){
  // FS 모드: 목업 시드 제거 (모든 컬렉션 빈 상태에서 단계별 로드)
  ['players','matches','squads','members','notes','stats','attendance','clubs'].forEach(function(k){ DB[k]=[]; });
  return Promise.all([ db.collection('config').doc('app').get().catch(function(){return {exists:false};}), fsColl('clubs') ])
  .then(function(r){
    DB.clubs=r[1]||[];
    var cfg=(r[0]&&r[0].exists)?r[0].data():{};
    DB.config={ lateScore:0.5, absentScore:-1 };
    for(var k in cfg){ if(k!=='staffPw'&&k!=='memberPw') DB.config[k]=cfg[k]; }
    return (DB.clubs.length===0);
  });
}
/* 팀 데이터: 명단·경기·스쿼드 (상세 기록은 화면별 지연 로드) */
FS._team={};
function fsLoadTeam(cid){
  if(!cid) return Promise.resolve();
  if(FS._team[cid]) return FS._team[cid];
  FS._team[cid]=Promise.all([
    fsQ('members','clubId',cid), fsQ('matches','clubId',cid), fsQ('squads','clubId',cid)
  ]).then(function(r){
    fsMerge('players',r[0]); fsMerge('matches',r[1]); fsMerge('squads',r[2]);
    ktCacheSave_();
  });
  return FS._team[cid];
}
/* 경기 상세(득점/출석/명단): 그 팀 경기 id 기준 청크 조회 */
FS._kidMids={};   // cid -> {matchId:1} 득점·출석·명단까지 모두 로드된 경기
FS._kidLite={};   // cid -> {matchId:1} 득점·출석만 로드된 경기 (기록·통계용)
FS._kidsQ={};     // cid -> 직렬화 큐(동시 호출 시 동일 경기 중복 조회 방지)
function fsLoadMatchKids(cid, period){
  if(!cid) return Promise.resolve();
  var prev = FS._kidsQ[cid] || Promise.resolve();
  var next = prev.then(function(){ return fsLoadTeam(cid); }).then(function(){
    var loaded = FS._kidMids[cid] || (FS._kidMids[cid]={});
    // period 지정 시 그 시즌(YYYY 또는 YYYY-MM) 경기만, 없거나 '전체'면 전 경기
    var want=(DB.matches||[]).filter(function(m){
      if(m.clubId!==cid) return false;
      if(period && period!=='전체') return m.date && m.date.indexOf(period)===0;
      return true;
    }).map(function(m){return m.id;});
    var lite = FS._kidLite[cid] || (FS._kidLite[cid]={});
    var need=want.filter(function(id){ return !loaded[id] && !lite[id]; });
    if(!need.length) return;
    return Promise.all([ fsIn('playerStats','matchId',need), fsIn('attendance','matchId',need) ])
      .then(function(r){ fsMerge('stats',r[0]); fsMerge('attendance',r[1]); need.forEach(function(id){ lite[id]=1; }); ktCacheSave_(); });
  });
  FS._kidsQ[cid] = next.catch(function(){});   // 오류가 나도 큐가 막히지 않게
  return next;
}
/* 지정한 경기들의 상세(득점/출석/명단)만 로드 — 전 경기 로드 방지 */
function fsLoadKidsForMatches_(cid, ids){
  if(!cid || !ids || !ids.length) return Promise.resolve();
  var prev = FS._kidsQ[cid] || Promise.resolve();
  var next = prev.then(function(){ return fsLoadTeam(cid); }).then(function(){
    var loaded = FS._kidMids[cid] || (FS._kidMids[cid]={});
    var lite = FS._kidLite[cid] || (FS._kidLite[cid]={});
    var todo = ids.filter(function(id){ return id && !loaded[id]; });
    if(!todo.length) return;
    var fresh = todo.filter(function(id){ return !lite[id]; });          // 아무것도 안 실린 경기
    if(!fresh.length){ todo.forEach(function(id){ loaded[id]=1; }); return; }
    return Promise.all([ fsIn('playerStats','matchId',fresh), fsIn('attendance','matchId',fresh) ]).then(function(r){
      fsMerge('stats',r[0]); fsMerge('attendance',r[1]);
      todo.forEach(function(id){ loaded[id]=1; lite[id]=1; });
      ktCacheSave_();
    });
  });
  FS._kidsQ[cid] = next.catch(function(){});
  return next;
}
/* 특정 선수의 기록만 로드 — 개인기록 화면은 본인 1명분만 사용 */
FS._pkid={};
function fsLoadPlayerKids_(cid, pid){
  if(!cid || !pid) return Promise.resolve();
  var key = cid+'__'+pid;
  if(FS._pkid[key]) return FS._pkid[key];
  FS._pkid[key] = fsLoadTeam(cid).then(function(){
    return Promise.all([ fsQ('playerStats','playerId',pid), fsQ('attendance','playerId',pid) ]);
  }).then(function(r){ fsMerge('stats',r[0]); fsMerge('attendance',r[1]); });
  return FS._pkid[key];
}
FS._sk={};
function fsLoadSquadKids(sid){
  if(!sid) return Promise.resolve();
  if(FS._sk[sid]) return FS._sk[sid];
  FS._sk[sid]=Promise.all([ fsQ('squadMembers','squadId',sid), fsQ('squadNotes','squadId',sid) ]).then(function(r){
    fsMerge('members',r[0]); fsMerge('notes',r[1]);
    ktCacheSave_();
  });
  return FS._sk[sid];
}

FS.run = function(fn, args){
  return FS.ready.then(function(){
    /* ── 필요한 범위만 선로딩 ── */
    var cid = window.ACTIVE_CLUB || state.activeClubId || null;
    var pre = Promise.resolve();
    if(fn==='getRecordBundle'){ pre = fsLoadMatchKids(cid, args[0]); }
    else if(fn==='getMatchReport'){ pre = fsLoadKidsForMatches_(cid, [args[0]]); }
    else if(fn==='getPlayerCareer'){ pre = fsLoadPlayerKids_(cid, args[0]); }
    else if(fn==='getSquadDetail'){ pre = fsLoadSquadKids(args[0]); }
    else if(cid){ pre = fsLoadTeam(cid); var t=WRITE_TOUCH[fn]||[];
      if(t.indexOf('stats')>-1||t.indexOf('attendance')>-1){
        var mi = MATCH_ARG[fn];
        if(mi!=null && args[mi]) pre=pre.then(function(){ return fsLoadKidsForMatches_(cid, [args[mi]]); });
        else pre=pre.then(function(){ return fsLoadMatchKids(cid); });
      }
      if((t.indexOf('members')>-1||t.indexOf('notes')>-1) && state.currentSquadId) pre=pre.then(function(){ return fsLoadSquadKids(state.currentSquadId); });
    }
    return pre.then(function(){ return FS._dispatch(fn, args); });
  });
};
FS._dispatch = function(fn, args){
    if(fn==='setConfig'){ var rc=mockHandler(fn, args); fsSyncConfig(); ktCacheSave_(); return rc; }
    var touched=WRITE_TOUCH[fn];
    if(touched){
      var before=fsSnapshot(touched);
      var res=mockHandler(fn, args);
      touched.forEach(function(k){ fsSyncDiff(k, before[k]); });
      ktCacheSave_();
      return res;
    }
    return mockHandler(fn, args);   // 읽기 (메모리 즉시)
};
FS.init = function(){
  if(!window.firebase){ return; }
  try{ firebase.initializeApp(FIREBASE_CONFIG); }catch(e){}
  try{
    if(firebase.appCheck){
      firebase.appCheck().activate(APPCHECK_SITE_KEY, true);
    }
  }catch(e){ if(window.console)console.warn('AppCheck', e); }
  window.db = firebase.firestore();
  FS.enabled = true;
  var authP = firebase.auth ? firebase.auth().signInAnonymously().catch(function(){}) : Promise.resolve();
  // 캐시가 신선하면(30분) 조회 없이 즉시 시작 — 읽기 사용량 절감 + 빠른 로딩
  var cache = ktCacheLoad_();
  if(cache && !ktCacheBypass_() && (Date.now()-cache.ts) < KT_CACHE_TTL){
    ['clubs','players','matches','squads','members','notes','stats','attendance'].forEach(function(k){ if(cache[k]) DB[k]=cache[k]; });
    if(cache.config) DB.config=cache.config;
    FS._team[cache.cid]=Promise.resolve();
    (cache.sk||[]).forEach(function(sid){ FS._sk[sid]=Promise.resolve(); });
    FS._kidMids[cache.cid]=cache.kidMids||{};
    FS._kidLite[cache.cid]=cache.kidLite||{};
    FS._fromCache=true;
    FS._resolve();
    return;
  }
  authP.then(function(){ return fsLoadAll(); })
    .then(function(){ FS._resolve(); fsWriteProbe_(); ktCacheSave_(); })
    .catch(function(e){ if(window.console)console.warn('FS init', e); FS.loadFailed=true; FS._resolve(); });
};

/* ── 최신 버전 확인 & 자동 업데이트 ──
   접속(링크/앱 실행) 시 version.json을 캐시 없이 확인해, 현재 버전보다 새 버전이면
   캐시를 비우고 1회 자동 새로고침(루프 방지). 최신이면 아무 것도 안 함. */
function verNum_(v){ var p=String(v||'').split('.'); return (parseInt(p[0],10)||0)*100000+(parseInt(p[1],10)||0)*100+(parseInt(p[2],10)||0); }
function checkForUpdate_(){
  try{
    fetch('version.json?_='+Date.now(), {cache:'no-store'})
      .then(function(r){ return r && r.ok ? r.json() : null; })
      .then(function(j){
        if(!j || !j.version) return;
        if(verNum_(j.version) > verNum_(APP_VERSION)){
          try{ if(sessionStorage.getItem('kt_upd')===String(j.version)) return; sessionStorage.setItem('kt_upd', String(j.version)); }catch(e){}
          var go=function(){ try{ location.reload(); }catch(e){} };
          try{ if(navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage('CLEAR_CACHE'); }catch(e){}
          if(window.caches){ caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); }).then(go, go); }
          else go();
        }
      }).catch(function(){});
  }catch(e){}
}
try{ checkForUpdate_(); }catch(e){}

/* 모바일 당겨서 새로고침 (기본 브라우저 PTR은 고정 레이아웃 때문에 동작 안 함 → 직접 구현) */
var _ptrInit=false;
function initPTR_(){
  if(_ptrInit) return; _ptrInit=true;
  var content=document.getElementById('content'), phone=document.querySelector('.phone');
  if(!content || !phone) return;
  var ind=document.createElement('div'); ind.className='ptr-ind'; ind.innerHTML='<div class="ptr-spin2"></div>';
  phone.appendChild(ind);
  var THRESH=66, MAX=96, startY=0, pulling=false, dist=0, active=false;
  function place(){ var ct=content.getBoundingClientRect().top - phone.getBoundingClientRect().top; ind.style.top=(ct+6)+'px'; }
  function reset(anim){
    ind.classList.remove('ready');
    ind.style.transition = anim ? 'transform .2s ease, opacity .2s ease' : '';
    ind.style.transform='translateY(-6px)'; ind.style.opacity='0';
    if(anim) setTimeout(function(){ ind.style.transition=''; }, 220);
  }
  content.addEventListener('touchstart', function(e){
    if(e.touches.length!==1){ pulling=false; return; }
    // 시트/모달 열려있으면 PTR 비활성
    var sheetOpen=document.getElementById('sheetWrap').classList.contains('open');
    var cfmOpen=document.getElementById('cfmWrap').classList.contains('open');
    if(content.scrollTop<=0 && !sheetOpen && !cfmOpen){ startY=e.touches[0].clientY; pulling=true; dist=0; place(); ind.style.transition=''; }
    else pulling=false;
  }, {passive:true});
  content.addEventListener('touchmove', function(e){
    if(!pulling) return;
    var dy=e.touches[0].clientY - startY;
    if(dy<=0 || content.scrollTop>0){ dist=0; ind.style.opacity='0'; ind.style.transform='translateY(-6px)'; return; }
    dist=Math.min(dy*0.5, MAX);
    ind.style.opacity=String(Math.min(dist/THRESH,1));
    ind.style.transform='translateY('+dist+'px)';
    ind.querySelector('.ptr-spin2').style.transform='rotate('+Math.round(dist*3.2)+'deg)';
    if(dist>=THRESH) ind.classList.add('ready'); else ind.classList.remove('ready');
  }, {passive:true});
  content.addEventListener('touchend', function(){
    if(!pulling) return; pulling=false;
    if(dist>=THRESH && !active){
      active=true;
      ind.classList.add('spinning');
      ind.style.transition='transform .18s ease';
      ind.style.transform='translateY('+THRESH+'px)'; ind.style.opacity='1';
      setTimeout(function(){ try{ sessionStorage.setItem('kt_fresh','1'); }catch(e){} try{ location.reload(); }catch(e){ reset(true); active=false; } }, 300);
    } else { reset(true); }
  }, {passive:true});
}
/* 안드로이드 하드웨어 뒤로가기 → 앱 종료 대신 앱 내 뒤로가기 */
function pushHist_(){ try{ history.pushState({kt:1}, ''); }catch(e){} }
var _backReady=false;
function initBackButton_(){
  if(_backReady) return; _backReady=true;
  pushHist_();   // 트랩 엔트리 (뒤로가기 시 팝될 여분 엔트리)
  window.addEventListener('popstate', function(){
    // 1) 열린 시트/확인창 먼저 닫기
    var sheetW=document.getElementById('sheetWrap'), cfmW=document.getElementById('cfmWrap');
    if(sheetW && sheetW.classList.contains('open')){ closeSheet(); pushHist_(); return; }
    if(cfmW && cfmW.classList.contains('open')){ closeConfirm_(false); pushHist_(); return; }
    // 2) 화면 뒤로가기 스택
    var st=state._backStack||[];
    if(st.length){
      var prev=st.pop();
      state._backNav=true;
      try{ go(prev); }catch(e){}
      state._backNav=false;
      pushHist_();
      return;
    }
    // 3) 최상위 화면 → 한 번 더 누르면 종료
    if(!state._exitArmed){
      state._exitArmed=true; toast('한 번 더 누르면 앱이 종료돼요');
      pushHist_(); setTimeout(function(){ state._exitArmed=false; }, 1800);
      return;
    }
    // 여기서 재푸시하지 않으면 브라우저가 실제 뒤로가기(앱 종료)를 수행
  });
}
/* 모바일 뷰포트 높이 보정: 일부 브라우저/홈화면 PWA에서 100dvh가 실제 보이는 높이보다 커서
   하단 탭바가 화면 밖(시스템 내비 뒤)으로 밀려 사라지는 문제 방지. 실제 innerHeight로 폰 높이 고정 */
function fitPhone_(){
  try{
    var ph=document.querySelector('.phone'); if(!ph) return;
    if(window.matchMedia && window.matchMedia('(max-width:459px)').matches){
      // window.innerHeight = 현재 레이아웃 뷰포트(브라우저 UI 반영). 키보드로는 안 바뀌어 레이아웃 튐 없음.
      var h=window.innerHeight;
      if(h && h>200) ph.style.height=Math.round(h)+'px';
    } else { ph.style.height=''; }
  }catch(e){}
}
(function(){
  fitPhone_();
  window.addEventListener('resize', fitPhone_);
  window.addEventListener('orientationchange', function(){ setTimeout(fitPhone_, 250); });
  setTimeout(fitPhone_, 300); setTimeout(fitPhone_, 1200);
  try{ initPTR_(); }catch(e){}
  try{ initBackButton_(); }catch(e){}
  API.run('bootstrap').then(function(b){
    if(b){ if(b.config) state.cfg=b.config; state.clubs=b.clubs||[]; }
    hideSplash_();
    var club = pickClub_();
    if(!club){
      document.getElementById('content').innerHTML='<div class="empty"><div class="ei">🛡️</div>팀 데이터를 찾을 수 없습니다.<br>네트워크 상태를 확인한 뒤 새로고침해 주세요.</div>';
      return;
    }
    pinGate_(function(){ enterApp_(club.id); });
  }).catch(function(){ hideSplash_(); toast('데이터를 불러오지 못했습니다'); });
})();

/* 로그인 후: 접근 가능한 팀이 1개면 자동 입장, 아니면 팀 탭 */
/* 우리 팀 선택: FC JEMIRO 이름 매칭, 없으면 첫 팀 */
function pickClub_(){
  var cs=state.clubs||[];
  var c=cs.filter(function(x){ return /jemiro|제미로/i.test(String(x.name||'')); })[0] || cs[0];
  return c||null;
}
function enterApp_(clubId){
  state.activeClubId=clubId; ACTIVE_CLUB=clubId; window.ACTIVE_CLUB=clubId;
  applyClubHeader();
  state.screen='team'; state._backStack=[];
  var tb=document.getElementById('tabbar'); if(tb) tb.style.display='flex';
  loadClubData_();
}
function loadClubData_(){
  state.loading=true; render();
  Promise.all([API.run('getPlayers'), API.run('getMatches')]).then(function(r){
    state.players=r[0]||[]; state.matches=r[1]||[]; state.matchesLoaded=true; state.loading=false;
    render();
  }).catch(function(){ state.loading=false; render(); });
}
</script>
