<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>FC JEMIRO</title>
<link rel="manifest" href="manifest.json?v=3">
<link rel="icon" href="favicon.ico?v=3" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=3">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=3">
<meta name="theme-color" content="#111015">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FC JEMIRO">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet" />
<!-- 지도(Leaflet)는 필요할 때만 지연 로드(ensureLeaflet) — 초기 로딩 차단 제거 -->
<!-- Firebase는 body 끝(스플래시 렌더 후)에서 로드해 첫 화면 표시를 빠르게 -->
<style>
  :root{
    --ink:#111015;
    --ink-soft:#1F1D25;
    --red:#C8102E;
    --red-deep:#96001F;
    --red-tint:#FBEDEF;
    --gold:#C7A24B;
    --gold-soft:#E8D9B5;
    --white:#FFFFFF;
    --paper:#F6F5F3;
    --card:#FFFFFF;
    --steel:#6B6E76;
    --steel-soft:#9FA2A9;
    --line:#EAE8E4;
    --line-strong:#D9D6D0;
    --ok:#177E56;
    --warn:#C98A12;
    --shadow:0 12px 32px rgba(17,16,21,.10);
    --shadow-sm:0 2px 10px rgba(17,16,21,.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Pretendard',system-ui,sans-serif;
    background:#0C0B10;
    color:var(--ink);
    display:flex;justify-content:center;align-items:flex-start;
    min-height:100vh;
    min-height:100dvh;
  }
  /* 모바일: 동적 뷰포트로 폰 높이 고정 → 하단 탭바가 항상 화면에 고정 */
  @supports(height:100dvh){ @media(max-width:459px){ html,body{ height:100dvh; overflow:hidden; } } }
  .oswald{font-family:'Oswald',sans-serif;}

  /* ===== Phone shell ===== */
  .phone{
    position:relative;
    width:100%;max-width:412px;
    height:min(880px,100vh);
    height:min(880px,100dvh);
    background:var(--paper);
    overflow:hidden;
    display:flex;flex-direction:column;
    box-shadow:0 30px 80px rgba(0,0,0,.5);
  }
  @media(min-width:460px){ .phone{ border-radius:38px; margin:22px 0; height:844px; border:10px solid #08070B; } }

  /* ===== Header ===== */
  .topbar{
    position:relative;
    background:#111015;
    color:#fff;
    padding:16px 18px 18px;
    overflow:hidden;
    flex:0 0 auto;
    border-bottom:1px solid rgba(199,162,75,.35);
  }
  /* 동축_배경: 헤더 전체를 덮는 배경 이미지 (이미지 오면 APP_BG 한 줄만 교체) */
  .topbar::before{
    content:"";position:absolute;inset:0;z-index:0;
    background-image:var(--hero-img, linear-gradient(150deg,#17151D 0%,#111015 55%,#0D0C11 100%));
    background-size:cover;background-position:center 30%;
  }
  /* 팀 배경 사진이 있으면 헤더를 사진 비율에 가깝게 키워 잘림을 최소화 */
  .topbar.has-bg{ min-height:150px; }
  .topbar.has-bg::before{ background-position:center center; }
  /* 글자 가독성용 어두운 오버레이 */
  .topbar::after{
    content:"";position:absolute;inset:0;z-index:1;
    background:linear-gradient(180deg,rgba(10,9,14,.42) 0%,rgba(10,9,14,.70) 100%);
  }
  .topbar-row{position:relative;z-index:2;display:flex;align-items:center;gap:12px;}
  .crest-badge{
    width:48px;height:48px;flex:0 0 auto;border-radius:13px;
    background:transparent;display:flex;align-items:center;justify-content:center;
    overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.45);
    border:1px solid rgba(199,162,75,.5);
  }
  .crest-img{width:100%;height:100%;object-fit:cover;display:block;}
  .club{display:flex;flex-direction:column;line-height:1;}
  .club .name{font-family:'Oswald';font-weight:700;font-size:20px;letter-spacing:.08em;}
  .club .tag{font-size:10px;color:var(--gold-soft);letter-spacing:.2em;margin-top:4px;font-weight:600;}
  .screen-title{
    position:relative;z-index:2;margin-top:16px;
    display:flex;align-items:baseline;gap:10px;
  }
  .screen-title .kr{font-size:21px;font-weight:800;letter-spacing:-.01em;}
  .screen-title .en{font-family:'Oswald';font-size:10.5px;color:var(--gold);letter-spacing:.26em;text-transform:uppercase;}

  /* ===== Content ===== */
  .content{flex:1 1 auto;overflow-y:auto;padding:18px 16px 96px;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;}
  .content::-webkit-scrollbar{display:none;}
  /* 당겨서 새로고침 인디케이터 */
  .ptr-ind{position:absolute;left:0;right:0;margin:0 auto;width:34px;height:34px;border-radius:50%;
    background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;
    opacity:0;z-index:16;pointer-events:none;will-change:transform,opacity;}
  .ptr-ind .ptr-spin2{width:18px;height:18px;border:2.5px solid var(--line-strong,#e5e4ea);border-top-color:var(--red,#C8102E);border-radius:50%;}
  .ptr-ind.ready .ptr-spin2{border-top-color:var(--gold,#C7A24B);}
  .ptr-ind.spinning .ptr-spin2{animation:spspin .7s linear infinite;}

  .eyebrow{font-family:'Oswald';font-size:10.5px;letter-spacing:.22em;color:var(--steel);text-transform:uppercase;font-weight:600;margin:2px 0 11px;display:flex;align-items:center;gap:9px;}
  .eyebrow::before{content:"";width:18px;height:2px;background:linear-gradient(90deg,var(--red),var(--gold));border-radius:2px;}
  .section+.section{margin-top:28px;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-sm);}

  /* Squad list */
  .squad{display:flex;flex-direction:column;gap:9px;}
  .player{
    display:flex;align-items:center;gap:10px;
    background:var(--card);border:1px solid var(--line);border-radius:17px;
    padding:11px 13px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
    cursor:pointer;transition:transform .12s ease,box-shadow .12s ease;
  }
  .player:active{transform:scale(.985);}
  .player .num{
    font-family:'Oswald';font-weight:700;font-size:27px;line-height:1;
    width:42px;text-align:center;color:var(--ink);
    position:relative;flex:0 0 auto;
  }
  .player .num::after{content:"";position:absolute;right:-7px;top:8%;height:84%;width:2px;background:var(--line-strong);}
  .player .meta{flex:1 1 auto;min-width:0;}
  .player .pname{font-weight:700;font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .pos-tags{display:inline-flex;gap:4px;}
  .pos-tag{font-family:'Oswald';font-weight:600;font-size:10px;letter-spacing:.04em;color:var(--red);background:var(--red-tint);border-radius:5px;padding:2px 6px;line-height:1.3;}
  .st-tag{font-size:10px;font-weight:700;border-radius:5px;padding:2px 6px;line-height:1.3;color:#fff;background:var(--steel);}
  .st-tag.injury{background:var(--red);} .st-tag.rest{background:var(--steel-soft);} .st-tag.army{background:#2563C9;} .st-tag.away{background:#8a6d1f;}
  .player.inactive{opacity:.68;}
  .player .sub{font-size:11.5px;color:var(--steel);margin-top:3px;display:flex;gap:5px;flex-wrap:nowrap;white-space:nowrap;overflow:hidden;letter-spacing:-.02em;}
  .player .sub .dot{color:var(--line-strong);}
  .pl-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:0 0 auto;border:1px solid var(--line);background:var(--paper);}
  .pl-avatar-empty{display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--steel-soft);}
  .rst-ava{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:0 0 auto;border:1px solid var(--line);background:var(--paper);}
  .rst-ava-empty{display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--steel-soft);}
  .size-badge{
    font-family:'Oswald';font-weight:600;font-size:10px;letter-spacing:.04em;
    background:var(--ink);color:var(--gold-soft);border:1px solid rgba(199,162,75,.4);border-radius:6px;padding:3px 6px;flex:0 0 auto;
  }

  /* FAB */
  .fab{
    position:absolute;right:18px;bottom:84px;z-index:20;
    width:56px;height:56px;border-radius:18px;border:none;
    background:var(--red);color:#fff;font-size:28px;line-height:1;
    box-shadow:0 10px 22px rgba(211,20,36,.42);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .12s ease;
  }
  .fab:active{transform:scale(.92);}

  /* Bottom nav */
  .tabbar{
    position:absolute;left:0;right:0;bottom:0;z-index:15;
    background:rgba(255,255,255,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border-top:1px solid rgba(17,16,21,.06);box-shadow:0 -8px 24px rgba(17,16,21,.06);
    display:flex;gap:2px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  }
  .tab{
    flex:1;background:none;border:none;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px 0 5px;color:var(--steel-soft);border-radius:14px;
    transition:background .18s ease,color .18s ease,transform .1s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .tab:active{transform:scale(.93);}
  .tab svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s ease;}
  .tab .lbl{font-size:10.5px;font-weight:600;letter-spacing:.01em;}
  .tab.active{color:var(--red);background:rgba(200,32,44,.08);}
  .tab.active svg{transform:translateY(-1px);stroke-width:2.2;}
  .tab.active .lbl{color:var(--ink);font-weight:700;}

  /* 앱 확인 모달 */
  .cfm-wrap{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:34px;}
  .cfm-wrap.open{display:flex;}
  .cfm-scrim{position:absolute;inset:0;background:rgba(15,14,20,.55);backdrop-filter:blur(2px);}
  .cfm-card{position:relative;width:100%;max-width:300px;background:#fff;border-radius:18px;padding:22px 20px 16px;box-shadow:0 18px 50px rgba(0,0,0,.35);animation:cfmIn .2s cubic-bezier(.22,1,.36,1);}
  @keyframes cfmIn{from{transform:scale(.94);opacity:0;}to{transform:scale(1);opacity:1;}}
  .cfm-msg{font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.6;text-align:center;white-space:pre-line;max-height:56vh;overflow-y:auto;}
  .cfm-btns{display:flex;gap:8px;margin-top:18px;}
  .cfm-btns button{flex:1;padding:12px 0;border-radius:12px;font-size:14.5px;font-weight:700;cursor:pointer;border:none;}
  .cfm-cancel{background:var(--paper,#F4F3F6);color:var(--steel,#6b6b76);border:1px solid var(--line-strong,#e5e4ea) !important;}
  .cfm-ok{background:var(--red);color:#fff;box-shadow:0 6px 16px rgba(200,32,44,.28);}
  .cfm-cancel:active,.cfm-ok:active{transform:scale(.97);}

  /* Bottom sheet */
  .sheet-wrap{position:absolute;inset:0;z-index:40;display:none;}
  .sheet-wrap.open{display:block;}
  .scrim{position:absolute;inset:0;background:rgba(15,14,20,.5);backdrop-filter:blur(2px);}
  .sheet{
    position:absolute;left:0;right:0;bottom:0;
    background:#fff;border-radius:24px 24px 0 0;
    max-height:92%;overflow-y:auto;
    box-shadow:0 -12px 40px rgba(0,0,0,.3);
    animation:up .28s cubic-bezier(.22,1,.36,1);
  }
  @keyframes up{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .sheet-head{position:sticky;top:0;background:#fff;padding:16px 18px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
  .sheet-head h3{margin:0;font-size:17px;font-weight:800;}
  .sheet-head .x{border:none;background:var(--paper);width:32px;height:32px;border-radius:10px;font-size:18px;cursor:pointer;color:var(--steel);}
  .grabber{width:38px;height:4px;background:var(--line-strong);border-radius:99px;margin:8px auto 2px;}
  .sheet-body{padding:16px 18px 24px;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:6px;}
  .field label .req{color:var(--red);margin-left:2px;}
  .field input,.field select{
    width:100%;padding:12px 13px;border:1.5px solid var(--line-strong);border-radius:12px;
    font-family:inherit;font-size:15px;background:#fff;color:var(--ink);
  }
  .field input:focus,.field select:focus{outline:none;border-color:var(--red);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .sizes{display:flex;gap:7px;flex-wrap:wrap;}
  .size-opt{
    flex:1 1 auto;min-width:52px;text-align:center;padding:11px 0;border:1.5px solid var(--line-strong);
    border-radius:11px;font-family:'Oswald';font-weight:600;font-size:14px;cursor:pointer;color:var(--steel);
  }
  .size-opt.sel{background:var(--ink);color:#fff;border-color:var(--ink);}
  .btn-primary{width:100%;padding:15px;border:none;border-radius:14px;background:var(--red);color:#fff;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:4px;}
  .btn-primary:active{background:var(--red-deep);}
  .btn-ghost{width:100%;padding:13px;border:1.5px solid var(--line-strong);border-radius:13px;background:#fff;color:var(--steel);font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:9px;}
  .btn-danger{color:var(--red);border-color:var(--red-tint);background:var(--red-tint);}

  /* generic bits */
  .chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;padding:8px 15px;border-radius:99px;border:1px solid var(--line-strong);background:#fff;font-size:13px;font-weight:600;color:var(--steel);cursor:pointer;font-family:'Oswald';letter-spacing:.03em;box-shadow:var(--shadow-sm);}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink);}

  /* Add-match button */
  .btn-add-match{
    width:100%;padding:14px;border:none;border-radius:13px;
    background:var(--red);color:#fff;font-size:15px;font-weight:700;font-family:inherit;
    cursor:pointer;box-shadow:0 6px 16px rgba(211,20,36,.32);
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .btn-add-match:active{background:var(--red-deep);}

  /* Quarter tabs */
  .qtabs{display:flex;gap:6px;margin-bottom:16px;background:var(--paper);padding:4px;border-radius:12px;border:1px solid var(--line);}
  .qtab{flex:1;padding:9px 4px;border:none;background:none;border-radius:9px;font-family:'Oswald';font-weight:600;font-size:13.5px;color:var(--steel);cursor:pointer;letter-spacing:.02em;transition:all .12s;}
  .qtab.on{background:linear-gradient(150deg,var(--red),var(--red-deep));color:#fff;box-shadow:0 3px 10px rgba(200,16,46,.35);}

  /* Formation pitch */
  .arena{
    position:relative;width:100%;padding-bottom:118%;border-radius:18px;overflow:hidden;
    perspective:950px;perspective-origin:50% 50%;
    background:
      radial-gradient(1.6px 1.6px at 11% 6%, rgba(255,255,255,.85), transparent 60%),
      radial-gradient(1.2px 1.2px at 27% 12%, rgba(255,255,255,.6), transparent 60%),
      radial-gradient(1.8px 1.8px at 43% 4%, rgba(255,255,255,.9), transparent 60%),
      radial-gradient(1.1px 1.1px at 58% 10%, rgba(255,255,255,.55), transparent 60%),
      radial-gradient(1.5px 1.5px at 72% 5%, rgba(255,255,255,.8), transparent 60%),
      radial-gradient(1.2px 1.2px at 86% 11%, rgba(255,255,255,.6), transparent 60%),
      radial-gradient(1.7px 1.7px at 94% 3%, rgba(255,255,255,.85), transparent 60%),
      radial-gradient(1.1px 1.1px at 18% 16%, rgba(255,255,255,.45), transparent 60%),
      radial-gradient(1.3px 1.3px at 66% 15%, rgba(255,255,255,.5), transparent 60%),
      radial-gradient(120% 60% at 50% -10%, rgba(255,255,240,.14), transparent 62%),
      linear-gradient(180deg,#152045 0%,#0e1630 30%,#0a100e 58%,#0b120f 100%);
    box-shadow:0 14px 34px rgba(0,0,0,.35);
  }
  .pitch{
    position:absolute;left:2.5%;right:2.5%;bottom:1.5%;height:116%;
    border-radius:10px;border:2px solid #2c6e49;
    background:
      repeating-linear-gradient(0deg, #2f8f57 0, #2f8f57 11%, #2b8551 11%, #2b8551 22%);
    transform:rotateX(22deg);transform-origin:50% 100%;transform-style:preserve-3d;
    box-shadow:0 22px 40px rgba(0,0,0,.45);
    touch-action:pan-y;user-select:none;
  }
  /* 토큰을 평면 위로 살짝 띄워(translateZ) 이름표가 잔디 평면에 잠기지 않게 */
  .pitch .token{transform:translate(-50%,-50%) translateZ(18px) rotateX(-22deg);}
  .pitch .token.drag{transform:translate(-50%,-50%) translateZ(30px) rotateX(-22deg);}
  .pitch-lines{position:absolute;inset:0;width:100%;height:100%;}
  .pitch-label{position:absolute;left:8px;bottom:6px;font-size:10px;color:rgba(255,255,255,.75);font-weight:600;letter-spacing:.02em;}
  .token{
    position:absolute;transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;gap:2px;
    cursor:grab;touch-action:none;z-index:2;
  }
  .token.drag{z-index:5;cursor:grabbing;}
  .token .t-num{
    min-width:44px;height:44px;padding:0 5px;border-radius:22px;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:15px;letter-spacing:.02em;color:#fff;border:2.5px solid #fff;
    box-shadow:0 3px 9px rgba(0,0,0,.38);background:var(--ink);
  }
  .token .t-name{
    font-size:11px;font-weight:700;color:#fff;background:rgba(20,18,26,.78);
    padding:2px 6px;border-radius:6px;white-space:nowrap;max-width:88px;overflow:hidden;text-overflow:ellipsis;
  }
  .token.drag .t-num{transform:scale(1.12);}
  .token .t-photo{position:relative;width:50px;height:50px;border-radius:50%;background-size:cover;background-position:center;background-color:#fff;border:3px solid var(--ink);box-shadow:0 3px 10px rgba(0,0,0,.4);display:block;}
  .token .t-pos{position:absolute;top:-7px;right:-11px;font-size:9.5px;font-weight:600;letter-spacing:.02em;color:#fff;background:var(--ink);border-radius:6px;padding:1.5px 5px;line-height:1.2;border:1.2px solid #fff;}
  .pos-GK .t-pos{background:#E0A400;}
  .pos-DF .t-pos,.pos-CB .t-pos,.pos-LB .t-pos,.pos-RB .t-pos,.pos-LWB .t-pos,.pos-RWB .t-pos{background:#2563C9;}
  .pos-MF .t-pos,.pos-DM .t-pos,.pos-CM .t-pos,.pos-AM .t-pos,.pos-LM .t-pos,.pos-RM .t-pos{background:#1E9E6A;}
  .pos-FW .t-pos,.pos-ST .t-pos,.pos-CF .t-pos,.pos-LW .t-pos,.pos-RW .t-pos{background:var(--red);}
  .token.drag .t-photo{transform:scale(1.12);}
  .pos-GK .t-photo{border-color:#E0A400;}
  .pos-DF .t-photo,.pos-CB .t-photo,.pos-LB .t-photo,.pos-RB .t-photo,.pos-LWB .t-photo,.pos-RWB .t-photo{border-color:#2563C9;}
  .pos-MF .t-photo,.pos-DM .t-photo,.pos-CM .t-photo,.pos-AM .t-photo,.pos-LM .t-photo,.pos-RM .t-photo{border-color:#1E9E6A;}
  .pos-FW .t-photo,.pos-ST .t-photo,.pos-CF .t-photo,.pos-LW .t-photo,.pos-RW .t-photo{border-color:var(--red);}
  .pos-GK .t-num{background:#E0A400;}
  .pos-DF .t-num,.pos-CB .t-num,.pos-LB .t-num,.pos-RB .t-num,.pos-LWB .t-num,.pos-RWB .t-num{background:#2563C9;}
  .pos-MF .t-num,.pos-DM .t-num,.pos-CM .t-num,.pos-AM .t-num,.pos-LM .t-num,.pos-RM .t-num{background:#1E9E6A;}
  .pos-FW .t-num,.pos-ST .t-num,.pos-CF .t-num,.pos-LW .t-num,.pos-RW .t-num{background:var(--red);}
  .pos-guest .t-num{background:#6B7280;}
  .rst-list{margin-top:4px;}
  .rst-row{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);}
  .rst-num{font-weight:700;font-size:16px;width:34px;text-align:center;color:var(--ink);}
  .rst-num.guest{color:#6B7280;font-size:14px;}
  .rst-name{flex:1;font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rst-g{font-size:10px;color:#6B7280;font-weight:600;}
  .rst-pos{width:82px;padding:7px 8px;border:1.5px solid var(--line-strong);border-radius:9px;font-family:inherit;font-size:13px;}
  .rst-postag{font-size:13px;color:var(--steel);width:82px;text-align:center;}
  .rst-x{background:none;border:none;color:var(--steel-soft);font-size:20px;cursor:pointer;padding:0 2px;line-height:1;}
  .rst-search{width:100%;padding:9px 12px;border:1.5px solid var(--line-strong);border-radius:10px;font-family:inherit;font-size:14px;margin:2px 0 6px;}
  .sheet-body textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line-strong);border-radius:11px;font-family:inherit;font-size:14px;line-height:1.5;resize:vertical;box-sizing:border-box;background:#fff;color:var(--ink);}
  .mijeong{font-size:.6em;letter-spacing:0;color:var(--steel-soft);font-family:'Pretendard';font-weight:600;}
  .match{padding:14px;border-radius:15px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-sm);margin-bottom:10px;}
  .match-top{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--steel);font-weight:600;}
  .result{font-family:'Oswald';font-weight:700;font-size:11px;padding:3px 8px;border-radius:6px;letter-spacing:.05em;}
  .r-w{background:#E4F5EC;color:var(--ok);}
  .r-l{background:var(--red-tint);color:var(--red);}
  .r-d{background:#F0F1F3;color:var(--steel);}
  /* 출석탭 과거 경기: 한 줄 요약 행 */
  .hist-row{display:flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card);margin-bottom:7px;cursor:pointer;box-shadow:var(--shadow-sm);-webkit-tap-highlight-color:transparent;}
  .hist-row:active{background:rgba(17,16,21,.04);}
  .hr-date{font-size:12.5px;color:var(--steel);font-weight:600;flex:0 0 auto;}
  .hr-score{font-family:'Oswald';font-size:14px;font-weight:700;color:var(--ink);margin-left:auto;letter-spacing:.04em;flex:0 0 auto;}
  .hr-na{font-size:10.5px;color:var(--steel-soft);font-weight:600;}
  .hr-arrow{color:var(--steel-soft);font-size:14px;font-weight:700;flex:0 0 auto;}
  .match-mid{display:flex;align-items:center;justify-content:space-between;margin-top:11px;}
  .team-side{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;}
  .team-side .cn{font-size:13px;font-weight:700;}
  .score{font-family:'Oswald';font-weight:700;font-size:34px;letter-spacing:.03em;}
  .score .vs{font-size:15px;color:var(--steel-soft);margin:0 12px;}

  .list-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);}
  .list-row:last-child{border-bottom:none;}
  .rank{font-family:'Oswald';font-weight:700;font-size:16px;color:var(--red);width:22px;text-align:center;}
  .list-row .nm{flex:1;font-weight:600;font-size:14.5px;}
  .list-row .val{font-family:'Oswald';font-weight:600;font-size:15px;}
  .list-row .val small{color:var(--steel);font-size:11px;margin-left:3px;font-family:'Pretendard';}

  /* TOP3 leaderboards */
  .boards{display:flex;flex-direction:column;gap:10px;}
  .lb-card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm);overflow:hidden;}
  .lb-title{font-family:'Oswald';font-size:11.5px;letter-spacing:.18em;font-weight:600;color:var(--gold-soft);background:linear-gradient(150deg,#1B1922,#111015);padding:8px 14px;text-transform:uppercase;border-bottom:1px solid rgba(199,162,75,.3);}
  .lb-row{display:flex;align-items:center;gap:11px;padding:9px 13px;border-bottom:1px solid var(--line);}
  .lb-row:last-child{border-bottom:none;}
  .lb-rank{font-size:16px;width:22px;text-align:center;flex:0 0 auto;}
  .lb-rank.r1{color:#E0A400;} .lb-rank.r2{color:#9AA0A8;} .lb-rank.r3{color:#C08457;}
  .lb-name{flex:1;font-weight:600;font-size:14.5px;}
  .lb-val{font-weight:600;font-size:15px;color:var(--red);}
  .lb-val small{font-family:'Pretendard';color:var(--steel);font-size:11px;margin-left:2px;}
  .lb-empty{padding:12px 13px;font-size:12.5px;color:var(--steel-soft);}
  .lb-mine{display:flex;align-items:center;gap:10px;padding:9px 13px;background:rgba(199,162,75,.10);border-top:1px dashed rgba(199,162,75,.45);}
  .lb-mine-k{font-size:12px;font-weight:800;color:var(--gold,#C7A24B);flex:0 0 auto;}
  .lb-mine-r{flex:1;font-size:12px;color:var(--steel);font-weight:600;}
  .lb-more{width:100%;border:none;background:rgba(17,16,21,.03);border-top:1px solid var(--line);color:var(--steel);font-size:12px;font-weight:700;padding:9px;cursor:pointer;font-family:inherit;}
  .lb-more:active{background:rgba(17,16,21,.07);}
  .rec-more{width:100%;margin-top:10px;padding:12px;border:1px solid var(--line-strong);border-radius:12px;background:#fff;color:var(--steel);font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;}
  .rec-more:active{background:rgba(17,16,21,.05);}
  /* 전체 순위 시트 (TOP 10) */
  .rk-list{border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .rk-row{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--line);}
  .rk-row:last-child{border-bottom:none;}
  .rk-row.rk-me{background:rgba(199,162,75,.12);}
  .rk-rank{width:26px;text-align:center;font-size:15px;font-weight:700;color:var(--steel);flex:0 0 auto;font-family:'Oswald';}
  .rk-rank.r1{color:#E0A400;} .rk-rank.r2{color:#9AA0A8;} .rk-rank.r3{color:#C08457;}
  .rk-name{flex:1;font-weight:600;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rk-val{font-weight:700;font-size:15px;color:var(--red);flex:0 0 auto;}
  .rk-val small{font-family:'Pretendard';color:var(--steel);font-size:11px;margin-left:2px;}
  /* 개인 선수 페이지 */
  .pp-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .pp-tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;}
  .pp-tile .k{font-size:10.5px;color:var(--steel);font-weight:700;letter-spacing:.04em;}
  .pp-tile .v{font-size:21px;font-weight:700;color:var(--ink);margin-top:2px;}
  .pp-tile .v small{font-size:11px;color:var(--steel);font-family:'Pretendard';}
  .pp-list{border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .pp-row{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line);font-size:12.5px;}
  .pp-row:last-child{border-bottom:none;}
  .pp-y{font-weight:700;font-size:14px;width:44px;flex:0 0 auto;}
  .pp-c{flex:1;color:var(--steel);font-weight:600;white-space:nowrap;}
  /* 시즌 결산 어워드 */
  .aw-list{border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .aw-row{display:flex;align-items:center;gap:10px;padding:12px 13px;border-bottom:1px solid var(--line);}
  .aw-row:last-child{border-bottom:none;}
  .aw-i{font-size:17px;flex:0 0 auto;}
  .aw-k{font-size:12px;font-weight:700;color:var(--steel);width:64px;flex:0 0 auto;}
  .aw-n{flex:1;font-weight:700;font-size:13.5px;text-align:right;}
  .aw-v{color:var(--red);margin-left:4px;font-size:14px;}
  .aw-v small{font-family:'Pretendard';color:var(--steel);font-size:10.5px;margin-left:1px;}

  /* Result form attendance segments */
  .res-row{padding:9px 2px;border-bottom:1px solid var(--line);}
  .att-seg{display:flex;gap:6px;}
  .att-opt{flex:1;padding:7px 0;border:1.5px solid var(--line-strong);background:#fff;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--steel);cursor:pointer;font-family:inherit;}
  .att-opt.on.present{background:var(--ok);border-color:var(--ok);color:#fff;}
  .att-opt.on.late{background:var(--warn);border-color:var(--warn);color:#fff;}
  .att-opt.on.absent{background:var(--red);border-color:var(--red);color:#fff;}
  .att-opt.on.excused{background:var(--steel);border-color:var(--steel);color:#fff;}

  /* Match report blocks */
  .rep-block{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start;}
  .rep-block:last-child{border-bottom:none;}
  .rep-k{flex:0 0 74px;font-size:12.5px;font-weight:700;color:var(--ink);}
  .rep-v{flex:1;font-size:13.5px;color:var(--ink-soft);line-height:1.5;}

  /* Venue map picker */
  .map-search{display:flex;gap:7px;margin-bottom:8px;}
  .map-search input{flex:1;padding:11px 12px;border:1.5px solid var(--line-strong);border-radius:11px;font-family:inherit;font-size:14px;}
  .map-search input:focus{outline:none;border-color:var(--red);}
  .map-search button{flex:0 0 auto;padding:0 16px;border:none;border-radius:11px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;font-family:inherit;cursor:pointer;}
  .map-results{max-height:150px;overflow-y:auto;margin-bottom:8px;}
  .map-results:empty{display:none;}
  .map-result{padding:9px 11px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;background:#fff;}
  .map-result:active{background:var(--paper);}
  .mr-name{font-size:13.5px;font-weight:700;color:var(--ink);}
  .mr-full{font-size:11px;color:var(--steel-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .map-loading{padding:10px;font-size:12.5px;color:var(--steel-soft);text-align:center;}
  .map-box{width:100%;height:230px;border-radius:12px;overflow:hidden;border:1px solid var(--line-strong);background:#e9ebef;}
  .map-fallback{display:flex;align-items:center;justify-content:center;height:100%;font-size:12.5px;color:var(--steel);padding:12px;text-align:center;}
  .map-status{font-size:11.5px;color:var(--steel);margin-top:7px;line-height:1.4;}
  .leaflet-container{font-family:inherit;}

  /* Share buttons */
  /* 지도·내비 앱 런처 그리드 */
  .app-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px;padding:4px 0 2px;}
  .app-item{display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;-webkit-tap-highlight-color:transparent;}
  .app-item:active .app-ico{transform:scale(.93);}
  .app-ico{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(17,16,21,.14), inset 0 1px 0 rgba(255,255,255,.25);transition:transform .12s ease;}
  .app-ico svg{width:30px;height:30px;}
  .app-ico img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block;}
  .app-ico.bordered{border:1px solid var(--line-strong);box-shadow:0 3px 10px rgba(17,16,21,.08);}
  .app-lbl{font-size:11px;font-weight:700;color:var(--ink);text-align:center;line-height:1.25;}
  .app-note{font-size:9.5px;color:var(--steel-soft);font-weight:600;margin-top:-3px;}

  /* mini buttons (권한 관리) */
  .btn-mini{flex:0 0 auto;padding:8px 11px;border:none;border-radius:9px;background:var(--ink);color:#fff;font-size:11.5px;font-weight:700;font-family:inherit;cursor:pointer;margin-left:6px;}
  .btn-mini.ghost{background:var(--paper);color:var(--steel);border:1px solid var(--line-strong);}

  /* Clubs */
  .club .name .rg{font-family:'Pretendard';font-size:11px;font-weight:600;color:var(--gold-soft);letter-spacing:.02em;margin-left:2px;}
  .club-emblem{width:48px;height:48px;border-radius:12px;object-fit:contain;background:#fff;border:1px solid var(--line);flex:0 0 auto;}
  /* Login screen */
  .auth-screen{position:absolute;inset:0;z-index:50;background:linear-gradient(180deg,rgba(12,11,16,.55) 0%,rgba(12,11,16,.82) 100%),var(--login-img,radial-gradient(120% 90% at 50% 0%,#201D28 0%,#111015 60%,#0C0B10 100%));background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;padding:28px;}
  .auth-inner{width:100%;max-width:320px;text-align:center;}
  .auth-logo{width:96px;height:96px;object-fit:cover;background:transparent;border-radius:24px;box-shadow:0 14px 38px rgba(0,0,0,.5);border:1px solid rgba(199,162,75,.5);}
  .auth-title{font-family:'Oswald';font-weight:700;font-size:30px;letter-spacing:.1em;color:#fff;margin-top:18px;}
  .auth-name2{font-size:16px;font-weight:700;color:#fff;letter-spacing:.02em;margin-top:8px;}
  .auth-sub{font-size:11.5px;color:var(--gold-soft);letter-spacing:.24em;margin-top:6px;font-weight:600;}
  .auth-form{margin-top:26px;display:flex;flex-direction:column;gap:11px;text-align:left;}
  .auth-form select,.auth-form input{width:100%;padding:14px;border:none;border-radius:13px;font-family:inherit;font-size:15px;background:rgba(255,255,255,.96);}
  .auth-form select:focus,.auth-form input:focus{outline:2px solid var(--red);}
  .auth-btn{padding:15px;border:none;border-radius:13px;background:var(--red);color:#fff;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 8px 20px rgba(211,20,36,.4);}
  .auth-btn:active{background:var(--red-deep);}
  .auth-hint{font-size:11.5px;color:#9ca0a8;text-align:center;margin:6px 0 0;line-height:1.5;}
  .auth-team-name{font-size:15px;font-weight:800;color:var(--gold);text-align:center;padding:2px 0 4px;}

  .stat-strip{display:flex;gap:9px;margin-bottom:14px;}
  .stat{flex:1;background:linear-gradient(150deg,#1B1922,#111015);color:#fff;border-radius:16px;padding:14px 13px;position:relative;overflow:hidden;border:1px solid rgba(199,162,75,.25);}
  .stat:nth-child(2){background:linear-gradient(150deg,var(--red),var(--red-deep));border-color:rgba(255,255,255,.14);}
  .stat .k{font-size:10.5px;opacity:.8;font-weight:600;letter-spacing:.04em;}
  .stat .v{font-family:'Oswald';font-weight:700;font-size:26px;margin-top:5px;line-height:1;letter-spacing:.02em;}

  .note-card{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--red);border-radius:12px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow-sm);}
  .note-card .nh{font-size:12px;font-weight:700;color:var(--red);margin-bottom:5px;}
  .note-card p{margin:0;font-size:13.5px;line-height:1.55;color:var(--ink-soft);white-space:pre-line;}

  .gps-card{background:linear-gradient(145deg,#1B1922,#111015);border:1px solid rgba(199,162,75,.3);color:#fff;border-radius:18px;padding:18px;position:relative;overflow:hidden;box-shadow:var(--shadow);}
  .gps-card::after{content:"";position:absolute;right:-30px;bottom:-30px;width:130px;height:130px;border:12px solid rgba(199,162,75,.28);border-radius:50%;}
  .gps-card .gh{font-size:12px;opacity:.8;font-weight:600;letter-spacing:.04em;}
  .gps-card .gv{font-family:'Oswald';font-weight:700;font-size:19px;margin:6px 0 3px;}
  .gps-card .gloc{font-size:12.5px;opacity:.85;}
  .map-card{border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow-sm);}
  .map-fake{height:150px;background:
     linear-gradient(#e9ebef,#e9ebef) padding-box,
     repeating-linear-gradient(0deg,transparent,transparent 22px,#dfe2e8 22px,#dfe2e8 23px),
     repeating-linear-gradient(90deg,transparent,transparent 22px,#dfe2e8 22px,#dfe2e8 23px);
     position:relative;}
  .map-pin{position:absolute;left:50%;top:46%;transform:translate(-50%,-100%);color:var(--red);font-size:34px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.25));}
  .venue-map{height:190px;width:100%;background:#e9ebef;}
  .venue-map .map-fallback{display:flex;align-items:center;justify-content:center;height:100%;font-size:12.5px;color:var(--steel);padding:12px;text-align:center;}
  .map-info{padding:14px;}
  .map-info .mt{font-weight:700;font-size:15px;}
  .map-info .ma{font-size:12.5px;color:var(--steel);margin-top:3px;}

  .empty{text-align:center;padding:40px 20px;color:var(--steel-soft);}
  .empty .ei{font-size:34px;margin-bottom:10px;}

  /* D-day 배너 */
  .dday{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#1B1922,#111015);border:1px solid rgba(199,162,75,.35);border-radius:16px;padding:12px 14px;margin-bottom:16px;color:#fff;cursor:pointer;box-shadow:var(--shadow);}
  .dday:active{transform:scale(.99);}
  .dd-n{font-size:26px;font-weight:700;letter-spacing:.04em;color:var(--gold);min-width:78px;text-align:center;border-right:1px solid rgba(255,255,255,.12);padding-right:10px;}
  .dd-b{flex:1;min-width:0;}
  .dd-t{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dd-s{font-size:11.5px;color:rgba(255,255,255,.75);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dd-a{color:var(--gold-soft);font-size:20px;font-weight:700;}
  /* 경기 캘린더 */
  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px;}
  .cal-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line-strong);background:#fff;font-size:18px;cursor:pointer;color:var(--ink);}
  .cal-title{font-size:20px;font-weight:700;letter-spacing:.05em;cursor:pointer;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--steel);padding:4px 0;}
  .cal-dow.sun,.cal-cell.sun .cal-d{color:var(--red);}
  .cal-dow.sat,.cal-cell.sat .cal-d{color:#2563C9;}
  .cal-cell{min-height:58px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:4px 3px;cursor:pointer;display:flex;flex-direction:column;gap:3px;-webkit-tap-highlight-color:transparent;}
  .cal-cell:active{background:var(--paper);}
  .cal-cell.empty{background:transparent;border-color:transparent;cursor:default;}
  .cal-cell.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;}
  .cal-cell.has{border-color:var(--line-strong);}
  .cal-d{font-family:'Oswald';font-size:13px;font-weight:600;color:var(--ink);line-height:1;}
  .cal-m{font-size:9px;font-weight:700;border-radius:5px;padding:2px 3px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;background:var(--steel-soft);}
  .cal-m.w{background:var(--ok);} .cal-m.l{background:var(--red);} .cal-m.d{background:var(--steel);}
  .cal-m.up{background:#fff;color:var(--red);border:1px solid var(--red);} .cal-m.na{background:var(--line-strong);color:var(--steel);}
  .cal-lg{display:inline-block;font-size:10px;font-weight:700;border-radius:5px;padding:1px 6px;color:#fff;background:var(--steel-soft);margin-right:2px;}
  .cal-lg.w{background:var(--ok);} .cal-lg.l{background:var(--red);} .cal-lg.d{background:var(--steel);} .cal-lg.up{background:#fff;color:var(--red);border:1px solid var(--red);} .cal-lg.na{background:var(--line-strong);color:var(--steel);}
  /* 사진 크게 보기 */
  .pv-wrap{position:absolute;inset:0;z-index:70;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:rgba(8,7,11,.94);padding:24px;}
  .pv-wrap.open{display:flex;}
  .pv-wrap img{max-width:100%;max-height:78%;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.6);background:#222;}

var POS_XY = {
  GK:[0.50,0.92],
  DF:[0.50,0.74], CB:[0.50,0.74], LB:[0.15,0.73], RB:[0.85,0.73], LWB:[0.13,0.62], RWB:[0.87,0.62],
  MF:[0.50,0.50], DM:[0.50,0.61], CM:[0.50,0.50], AM:[0.50,0.38], LM:[0.14,0.48], RM:[0.86,0.48],
  FW:[0.50,0.24], ST:[0.50,0.22], CF:[0.50,0.24], LW:[0.17,0.27], RW:[0.83,0.27]
};
function posDefaultXY(pos, idx){
  var base = POS_XY[pos] || [0.5,0.5];
  var offs = [0, -0.16, 0.16, -0.30, 0.30, -0.44, 0.44];
  var x = base[0] + (offs[idx % offs.length]||0);
  if(base[0]<0.25 || base[0]>0.75){ x = base[0] + (idx? (base[0]<0.5?0.04:-0.04)*idx : 0); } // 측면은 세로로 약간 분산
  x = Math.max(0.06, Math.min(0.94, x));
  var y = base[1] + (base[0]<0.25||base[0]>0.75 ? (idx%2? 0.05:-0.05)*Math.ceil(idx/2) : 0);
  y = Math.max(0.04, Math.min(0.96, y));
  return {x:x, y:y};
}
/* #11 스쿼드 맵 위치 → 포지션 자동 판정 (y: 1=우리 골, 0=상대 골) */
function posFromXY(x, y){
  if(y>=0.85) return 'GK';
  if(y>=0.66){ if(x<0.18) return 'LB'; if(x>0.82) return 'RB'; return 'CB'; }
  if(y>=0.56){ if(x<0.16) return 'LWB'; if(x>0.84) return 'RWB'; return 'DM'; }
  if(y>=0.42){ if(x<0.20) return 'LM'; if(x>0.80) return 'RM'; return 'CM'; }
  if(y>=0.32){ if(x<0.20) return 'LW'; if(x>0.80) return 'RW'; return 'AM'; }
  if(x<0.20) return 'LW'; if(x>0.80) return 'RW'; return 'ST';
}
/* 스쿼드에 선수 편성 (선호 포지션 1순위, 없으면 DF). 이미 있으면 건너뜀 */
function addPlayerToSquad_(sid, playerId){
  if(DB.members.some(function(x){return x.squadId===sid && x.playerId===playerId;})) return false;
  DB.members.push({squadId:sid, playerId:playerId, position:'', x:null, y:null});   // 미편성(맵 미표기)
  return true;
}
function buildMatchReport_(matchId){
  var match = DB.matches.filter(function(x){return x.id===matchId;})[0] || null;
  var nm = function(pid){ var p=DB.players.filter(function(x){return x.id===pid;})[0]; return p?p:{num:'?',name:'(선수)'}; };
  var st = DB.stats.filter(function(x){return x.matchId===matchId;});
  var scorers = st.filter(function(s){return (s.goals||0)>0;}).map(function(s){var p=nm(s.playerId);return {num:p.num,name:p.name,goals:s.goals};}).sort(function(a,b){return b.goals-a.goals;});
  var assisters = st.filter(function(s){return (s.assists||0)>0;}).map(function(s){var p=nm(s.playerId);return {num:p.num,name:p.name,assists:s.assists};}).sort(function(a,b){return b.assists-a.assists;});
  var att = DB.attendance.filter(function(x){return x.matchId===matchId;});
  var attMap={}; att.forEach(function(x){ attMap[x.playerId]=x.status; });
  var present=[],late=[],absent=[],excused=[];
  DB.players.forEach(function(p){
    var s = attMap[p.id];
    if(s==='present') present.push(p.name);
    else if(s==='late') late.push(p.name);
    else if(s==='absent') absent.push(p.name);        // 온다 하고 안 옴
    else if(s==='excused') excused.push(p.name);      // 안 온다고 밝힘
    // 기록 없음(미정)은 집계 제외 — 전인원 자동 불참 방지
  });
  var quarters = DB.squads.filter(function(s){return s.matchId===matchId;}).map(function(sq){
    var mem = DB.members.filter(function(x){return x.squadId===sq.id;}).map(function(x){var p=nm(x.playerId);return {num:p.num,name:p.name,position:x.position};}).sort(numSort);
    return {name:sq.name, members:mem};
  });
  return {match:match, scorers:scorers, assisters:assisters, attendance:{present:present,late:late,absent:absent,excused:excused}, quarters:quarters};
}
function buildSquadDetail_(squadId){
  var squad = DB.squads.filter(function(x){return x.id===squadId;})[0] || null;
  var raw = DB.members.filter(function(x){return x.squadId===squadId;});
  var gi=0;
  var members = raw.map(function(sm){
    var assigned = !!sm.position;
    var d = !assigned ? {x:null,y:null} : ((sm.x==null||sm.y==null) ? posDefaultXY(sm.position,0) : {x:sm.x, y:sm.y});
    if(sm.guest){ gi++; return {playerId:sm.playerId, guest:true, num:'G'+gi, gnum:gi, name:(sm.gname||('Guest'+gi)), position:sm.position||'', x:d.x, y:d.y}; }
    var p = DB.players.filter(function(x){return x.id===sm.playerId;})[0] || {num:'?',name:'(삭제됨)'};
    return {playerId:sm.playerId, num:p.num, name:p.name, photo:p.photo||'', position:sm.position||'', x:d.x, y:d.y};
  });
  members.sort(function(a,b){ if(a.guest!==b.guest) return a.guest?1:-1; if(a.guest) return a.gnum-b.gnum; return numSort(a,b); });
  var notes = DB.notes.filter(function(x){return x.squadId===squadId;}).map(function(n){
    return {id:n.id, squadId:n.squadId, phase:n.phase, scope:n.scope, body:n.body, author:n.author||'', authorId:n.authorId||''};
  });
  // squad는 복사본으로 반환 — 화면의 낙관적 수정이 메모리 DB를 오염시켜 저장 diff가 누락되는 것 방지
  return {squad: squad ? {id:squad.id, clubId:squad.clubId, name:squad.name} : null, members:members, notes:notes};
}

function recDefaultPeriod(){

/* 3D 스쿼드판: 화면 좌표 → 경기장 평면 좌표 역변환 (CSS rotateX(22deg)·initPitchDrag가 설정하는 perspective와 일치) */
var PITCH_TILT=22*Math.PI/180, PITCH_PERS_F=2.44;   // perspective = 스쿼드판 폭 × 2.44
function pitch3dPt_(arena, cx, cy){
  var R=arena.getBoundingClientRect();
  if(!R.width || !R.height) return {x:0.5,y:0.5};
  var Wp=R.width*0.95, Hp=R.height*1.16, T=R.height*0.985-Hp;
  var Oy=R.height/2, Pd=R.width*PITCH_PERS_F, th=PITCH_TILT;
  var xs=cx-R.left, ys=cy-R.top;
  var A=(T+Hp)-Oy, yrel=ys-Oy;
  var a=Pd*(A-yrel)/(yrel*Math.sin(th)+Pd*Math.cos(th));
  var sc=Pd/(Pd+a*Math.sin(th));
  var u=R.width/2+(xs-R.width/2)/sc;
  return { x:(u-R.width*0.025)/Wp, y:(Hp-a)/Hp };
}
function initPitchDrag(){
  if(!isAdmin()) return;
  var pitch = document.getElementById('pitch');
  if(!pitch) return;
  var arena = document.getElementById('arena') || pitch;
  if(arena && arena.offsetWidth) arena.style.perspective=Math.round(arena.offsetWidth*PITCH_PERS_F)+'px';
  var toks = pitch.querySelectorAll('.token');
  Array.prototype.forEach.call(toks, function(tok){
    var pid = tok.getAttribute('data-pid');
    var dragging=false, moved=false;
    tok.addEventListener('pointerdown', function(e){
      dragging=true; moved=false; tok.classList.add('drag');
      try{ tok.setPointerCapture(e.pointerId); }catch(err){}
      e.preventDefault();
    });
    tok.addEventListener('pointermove', function(e){
      if(!dragging) return;
      var pt = pitch3dPt_(arena, e.clientX, e.clientY);
      var x = Math.max(0.05, Math.min(0.95, pt.x));
      var y = Math.max(0.03, Math.min(0.97, pt.y));
      tok.style.left = (x*100)+'%';
      tok.style.top = (y*100)+'%';
      tok._x = x; tok._y = y; moved=true;
      if(!tok.getAttribute('data-guest')){   // 이동 중 실시간 포지션 표기
        var lp = posFromXY(x,y);
        var nn = tok.querySelector('.t-num'); if(nn && nn.textContent!==lp){ nn.textContent = lp; }
        var np = tok.querySelector('.t-pos'); if(np && np.textContent!==lp){ np.textContent = lp; }
        tok.className = 'token pos-'+lp+' drag';
      }
    });
    var end = function(){
      if(!dragging) return;
      dragging=false; tok.classList.remove('drag');
      if(moved && tok._x!=null){
        var newPos = posFromXY(tok._x, tok._y);
        var isGuest=false;
        if(state.squadDetail){ state.squadDetail.members.forEach(function(mm){ if(mm.playerId===pid){ mm.x=tok._x; mm.y=tok._y; if(!mm.guest) mm.position=newPos; isGuest=mm.guest; } }); cacheSquad_(state.squadDetail); }
        var savePos = isGuest ? null : newPos;
        API.run('setSquadMemberPos', state.currentSquadId, pid, tok._x, tok._y, savePos)
          .then(function(res){ if(res&&res.squad){ cacheSquad_(res); if(state.screen==='form') render(); } })
          .catch(function(){ toast('위치 저장 실패'); });
      }
    };
    tok.addEventListener('pointerup', end);
    tok.addEventListener('pointercancel', end);
  });
}

function fmtMatchDate(d){

/* 구글 시트가 시간을 날짜값으로 저장하는 문제 대응: 무엇이 와도 HH:mm 로 정리 */
function cleanTime(t){
  if(t===0 || t==='0') return '';
  if(!t) return '';
  t = String(t);
  var m = t.match(/(\d{1,2}):(\d{2})/);   // "20:20" 또는 "... 20:20:00 ..." 에서 추출
  if(m){ var hh=('0'+m[1]).slice(-2); return hh+':'+m[2]; }
  var d = new Date(t);
  if(!isNaN(d.getTime())) return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  return '';
}
function dowOf(dateStr){
  if(!dateStr) return '';
  var s=String(dateStr).slice(0,10);
  var d=new Date(s+'T00:00:00');
  if(isNaN(d.getTime())) return '';
  return ['일','월','화','수','목','금','토'][d.getDay()];
}
function fmtDateDot(dateStr){
  return String(dateStr).slice(0,10).replace(/-/g,'.');
}

  }
  var sorted = state.matches.slice().sort(function(a,b){ return b.date.localeCompare(a.date); });
  var mCap = state.matchShow || REC_PAGE;
  var shownM = sorted.slice(0, mCap);
  var cards = shownM.map(function(m){
    var venueBtn = (m.venueUrl || (m.lat!=null&&m.lat!==''))
      ? '<button class="btn-ghost" style="margin:10px 0 0;" onclick="event.stopPropagation();openVenueShare(\''+m.id+'\')">🗺️ 경기장 지도 · 내비 · 공유</button>' : '';
    var edit = isAdmin() ? ' onclick="openMatchForm(\''+m.id+'\')" style="cursor:pointer;"' : '';

    return '<div class="match" style="margin-bottom:12px;"'+edit+'>'
      + '<div class="match-top"><span>'+fmtDateDot(m.date)+(cleanTime(m.time)?' '+cleanTime(m.time):'')+'</span><span>'+(m.venue||'장소 미정')+'</span></div>'
      + '<div class="match-mid"><div class="team-side"><span class="cn">'+cn+'</span></div>'
      + '<div class="oswald" style="font-size:15px;color:var(--steel-soft);">VS</div>'

      + venueBtn
      + '</div>';
  }).join('');
  var restM = sorted.length - shownM.length;
  var moreM = (restM>0) ? '<button class="rec-more" onclick="matchShowMore_()">경기 더 보기 · '+Math.min(REC_PAGE, restM)+'개 (남은 '+restM+')</button>' : '';
  var emptyN = isAdmin() ? emptyMatchCount_() : 0;
  var cleanBtn = emptyN>0 ? '<button class="btn-ghost btn-danger" style="width:100%;margin:8px 0 0;" onclick="cleanupEmptyMatches_()">🧹 빈 경기 정리 ('+emptyN+'건)</button>'

  return addBtn + seg + '<div class="eyebrow">등록된 경기 · '+state.matches.length+'</div>' + cards + moreM + cleanBtn
    + '<p class="hint">'+(isAdmin()?'경기를 탭하면 수정할 수 있습니다.<br>':'')+'스쿼드(포메이션) 작성은 스쿼드 탭에서 관리합니다.</p>';
}

/* 스쿼드에 빠진 팀원 다시 추가 (실수로 제외한 인원 복구) */
function openAddMembers_(sid){
  if(!requireAdmin()) return;
  var d=state.squadDetail; if(!d || !d.squad || d.squad.id!==sid){ toast('스쿼드를 먼저 선택하세요'); return; }
  var inSquad={}; (d.members||[]).forEach(function(m){ inSquad[m.playerId]=1; });
  var cand=(state.players||[]).filter(function(p){ return !inSquad[p.id]; }).slice().sort(numSort);
  state._addSel={};
  if(!cand.length){ toast('모든 팀원이 이미 편성되어 있습니다'); return; }
  renderAddMembers_(sid, cand);
}
function renderAddMembers_(sid, cand){
  var sel=state._addSel||{};
  var n=Object.keys(sel).filter(function(k){ return sel[k]; }).length;
  var rows=cand.map(function(p){
    var on=!!sel[p.id];
    return '<div class="vt-pick'+(on?' on':'')+'" id="am_'+p.id+'" onclick="addMemToggle_(\''+sid+'\',\''+p.id+'\')">'
      + (p.photo?'<img class="vt-ava" src="'+p.photo+'" alt="">':'<div class="vt-ava vt-ava-e">👤</div>')
      + '<span class="vt-num oswald">'+numDisp(p.num)+'</span>'
      + '<span class="vt-nm">'+esc(p.name)+(p.status?' <span style="font-size:10.5px;color:var(--steel-soft);">'+esc(pStatusLabel_(p.status))+'</span>':'')+'</span>'
      + '<span class="vt-ck">'+(on?'✓':'')+'</span></div>';
  }).join('');
  state._addCand=cand;
  showSheet('<div class="grabber"></div>'
   + '<div class="sheet-head"><h3>➕ 팀원 추가</h3><button class="x" onclick="closeSheet()">✕</button></div>'
   + '<div class="sheet-body">'
   +   '<p style="font-size:12.5px;color:var(--steel-soft);margin:0 0 10px;">스쿼드에 없는 팀원이에요. 탭해서 선택한 뒤 추가하면 <b>미편성</b>으로 들어옵니다.</p>'
   +   '<div class="vt-list">'+rows+'</div>'
   +   '<button class="btn-primary" id="am_go" style="margin-top:14px;" onclick="addMembersGo_(\''+sid+'\')">선택한 <span id="am_n">'+n+'</span>명 추가</button>'
   + '</div>');
}
function addMemToggle_(sid, pid){
  state._addSel=state._addSel||{};
  state._addSel[pid]=!state._addSel[pid];
  var row=document.getElementById('am_'+pid);
  if(!row){ renderAddMembers_(sid, state._addCand||[]); return; }
  var on=!!state._addSel[pid];
  row.classList.toggle('on', on);
  var ck=row.querySelector('.vt-ck'); if(ck) ck.textContent=on?'✓':'';
  var n=Object.keys(state._addSel).filter(function(k){ return state._addSel[k]; }).length;
  var el=document.getElementById('am_n'); if(el) el.textContent=n;
}
function addMembersGo_(sid){
  var sel=state._addSel||{};

  if(!pids.length){ toast('추가할 팀원을 선택하세요'); return; }

    if(res){ SQUAD_CACHE[sid]=res; state.squadDetail=res; }
    state.squadList=(state.squadList||[]).map(function(x){ return x.id===sid?Object.assign({},x,{count:res?res.members.length:x.count}):x; });
    closeSheet(); render(); toast(pids.length+'명을 추가했습니다 (미편성)');
  }).catch(function(){ toast('추가 실패 · 새로고침'); });
}

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
/* 인라인 이벤트 핸들러(onclick="fn('...')") 안의 JS 문자열용 안전 이스케이프.

function jsq(s){ return String(s==null?'':s)

/* 현재 기간의 선수별 집계 {pid:{g,a,att}} — 뷰/시트 공용 */
function recBuildAgg_(){
  var matches=(state.recMatches||[]).filter(function(m){ return inPeriod(m.date); });
  var midSet={}; matches.forEach(function(m){ midSet[m.id]=true; });
  var agg={};
  function bk(pid){ if(!agg[pid]) agg[pid]={g:0,a:0,att:0}; return agg[pid]; }
  (state.recStats||[]).forEach(function(s){ if(!midSet[s.matchId]) return; var b=bk(s.playerId); b.g+=Number(s.goals)||0; b.a+=Number(s.assists)||0; });
  var lateScore=(state.cfg.lateScore!=null)?Number(state.cfg.lateScore):0.5;
  var absentScore=(state.cfg.absentScore!=null)?Number(state.cfg.absentScore):-1;
  (state.recAtt||[]).forEach(function(x){ if(!midSet[x.matchId]) return;
    if(x.status==='present') bk(x.playerId).att+=1;
    else if(x.status==='late') bk(x.playerId).att+=lateScore;
    else if(x.status==='absent') bk(x.playerId).att+=absentScore;
  });
  return agg;
}

function recRank_(key, limit){

  var arr=Object.keys(agg).map(function(pid){ var p=pname_(pid); var v = Math.round(agg[pid][key]*10)/10; return {pid:pid, name:p.name, v:v}; })
    .filter(function(r){ return r.v>0; }).sort(function(x,y){ return y.v-x.v; });
  return (limit>0) ? arr.slice(0, limit) : arr;
}

function seasonData_(key, srcM, srcS, srcA){
  var ms=(srcM||state.recMatches||[]).filter(function(m){ return m.date && seasonKeyOf_(m.date)===key; });
  var s=seasonAggFrom_(ms, srcS||state.recStats||[], srcA||state.recAtt||[]);
  s.year=key; s.label=seasonLabel_(key); s.ms=ms; return s;
}
/* 달력 연도 기준 (기록 탭 연도 결산용) */
function yearData_(year, srcM, srcS, srcA){
  var ms=(srcM||state.recMatches||[]).filter(function(m){ return m.date && m.date.slice(0,4)===year; });
  var s=seasonAggFrom_(ms, srcS||state.recStats||[], srcA||state.recAtt||[]);
  s.year=year; s.label=year; s.ms=ms; return s;
}
/* 경기 목록 기준 시즌 집계 (연도·기간 공용) */
function seasonAggFrom_(ms, srcS, srcA){
  var played=ms.filter(hasResult_);
  var w=0,d=0,l=0,gf=0,ga=0,best=null;
  played.forEach(function(m){
    if(m.result==='W')w++; else if(m.result==='D')d++; else l++;
    var os=Number(m.ourScore)||0, ps=Number(m.oppScore)||0;
    gf+=os; ga+=ps;
    if(m.result==='W'){ var diff=os-ps; if(!best || diff>best.diff || (diff===best.diff && os>best.os)) best={diff:diff, os:os, ps:ps, opp:m.opponent, date:m.date}; }
  });
  var midSet={}; ms.forEach(function(m){ midSet[m.id]=1; });
  var agg={};
  function bk(pid){ if(!agg[pid]) agg[pid]={g:0,a:0,att:0}; return agg[pid]; }
  (srcS||[]).forEach(function(s){ if(!midSet[s.matchId]) return; var b=bk(s.playerId); b.g+=Number(s.goals)||0; b.a+=Number(s.assists)||0; });
  // 출석은 기록 탭과 동일한 점수제(출석 1·지각 lateScore·불참 absentScore·미참석 0)
  var lateScore=(state.cfg&&state.cfg.lateScore!=null)?Number(state.cfg.lateScore):0.5;
  var absentScore=(state.cfg&&state.cfg.absentScore!=null)?Number(state.cfg.absentScore):-1;
  (srcA||[]).forEach(function(x){ if(!midSet[x.matchId]) return; var b=bk(x.playerId);
    if(x.status==='present') b.att+=1;
    else if(x.status==='late') b.att+=lateScore;
    else if(x.status==='absent') b.att+=absentScore;
  });
  function top(key){
    var arr=Object.keys(agg).map(function(pid){ return {pid:pid, name:pname_(pid).name, v:Math.round(agg[pid][key]*10)/10}; }).filter(function(r){return r.v>0;}).sort(function(x,y){return y.v-x.v;});
    if(!arr.length) return null;
    var mx=arr[0].v;
    var tops=arr.filter(function(r){return r.v===mx;});
    return {v:mx, names:tops.map(function(r){return r.name;}), pids:tops.map(function(r){return r.pid;})};
  }
  return {games:played.length, w:w, d:d, l:l, gf:gf, ga:ga,
    winRate:played.length?Math.round(w/played.length*100):0,
    scorer:top('g'), assister:top('a'), attKing:top('att'), best:best};
}

function latestMatch(){
  var ms = (state.matches||[]).slice().filter(function(m){return m && m.date;});
  if(!ms.length) return null;
  var today = new Date(); today.setHours(0,0,0,0);
  var upcoming = ms.filter(function(m){ return new Date(m.date) >= today; }).sort(function(a,b){ return a.date.localeCompare(b.date); });
  if(upcoming.length) return upcoming[0];               // 가장 가까운 예정 경기
  return ms.sort(function(a,b){ return b.date.localeCompare(a.date); })[0];  // 없으면 가장 최근 경기
}
function fmtMatchWhen(m){

}

function pickEmblem(input){
  var file = input.files && input.files[0]; if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var c=document.createElement('canvas'); var sz=96; c.width=sz; c.height=sz;
      var ctx=c.getContext('2d');
      var r=Math.min(sz/img.width, sz/img.height);
      var w=img.width*r, h=img.height*r;
      ctx.drawImage(img,(sz-w)/2,(sz-h)/2,w,h);
      clubEmblemData = c.toDataURL('image/png');
      var pv=document.getElementById('cb_prev'); if(pv){ pv.innerHTML='<img src="'+clubEmblemData+'" style="width:100%;height:100%;object-fit:contain;border-radius:12px;">'; pv.classList.remove('club-emblem-empty'); }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
/* 원본 비율 유지로 축소 + 고품질 JPEG 인코딩. Firestore 문서 한도(≈1MB) 안에 들도록
   품질→해상도 순으로 자동 조절하며 용량을 맞춘다. (선명도 우선) */
function encodeImgUnder_(img, maxW, maxH, budgetChars){
  var r=Math.min(maxW/img.width, maxH/img.height, 1);
  var w=Math.max(1, Math.round(img.width*r)), h=Math.max(1, Math.round(img.height*r));
  var url='';
  for(var attempt=0; attempt<7; attempt++){
    var c=document.createElement('canvas'); c.width=w; c.height=h;
    var ctx=c.getContext('2d'); try{ ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high'; }catch(e){}
    ctx.drawImage(img,0,0,w,h);
    var q=0.88; url=c.toDataURL('image/jpeg', q);
    while(url.length>budgetChars && q>0.5){ q-=0.08; url=c.toDataURL('image/jpeg', q); }
    if(url.length<=budgetChars) break;
    w=Math.round(w*0.85); h=Math.round(h*0.85);   // 여전히 크면 해상도 축소 후 재시도
  }
  return url;
}
/* 팀 헤더 배경 이미지: 원본 비율 유지·고해상도(가로 최대 1440)로 저장 → 선명하게, 덜 잘리게 */
function pickClubBg(input){
  var file = input.files && input.files[0]; if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      clubBgData = encodeImgUnder_(img, 1440, 960, 820000);   // ≈0.8MB 이내로 유지
      var pv=document.getElementById('cb_bgprev'); if(pv){ pv.style.background='#15131b center/cover no-repeat url('+clubBgData+')'; }
      var hint=document.getElementById('cb_bghint'); if(hint){ hint.textContent='적용된 배경'; hint.style.color='#fff'; }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function initVenueDisplayMap(){
  var el = document.getElementById('venue_map'); if(!el) return;
  var m = latestMatch(); if(!m) return;
  var lat = Number(m.lat), lng = Number(m.lng);
  if(isNaN(lat) || isNaN(lng)) return;
  el.innerHTML = '<div class="map-fallback">지도 불러오는 중...</div>';
  ensureKakao(function(okK){
    var box = document.getElementById('venue_map'); if(!box) return;
    var builtKakao = false;
    if(okK){
      try{
        box.innerHTML='';
        var map = new kakao.maps.Map(box, {center:new kakao.maps.LatLng(lat,lng), level:4});
        new kakao.maps.Marker({position:new kakao.maps.LatLng(lat,lng)}).setMap(map);
        map.setZoomable(false);
        [120,400,700].forEach(function(ms){ setTimeout(function(){ try{ map.relayout(); map.setCenter(new kakao.maps.LatLng(lat,lng)); }catch(e){} }, ms); });
        builtKakao = true;
      }catch(e){ builtKakao = false; }
    }
    if(!builtKakao){
      ensureLeaflet(function(okL){
        var b2 = document.getElementById('venue_map'); if(!b2) return;
        if(okL){
          try{
            b2.innerHTML='';
            var lm = L.map(b2, {zoomControl:false, attributionControl:false, scrollWheelZoom:false}).setView([lat,lng], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, crossOrigin:true}).addTo(lm);
            L.marker([lat,lng]).addTo(lm);
            [120,400].forEach(function(ms){ setTimeout(function(){ lm.invalidateSize(); }, ms); });
          }catch(e){ b2.innerHTML = '<div class="map-fallback">지도를 불러오지 못했습니다. 아래 “지도 · 내비 · 공유”를 이용하세요.</div>'; }
        } else {
          b2.innerHTML = '<div class="map-fallback">지도를 불러오지 못했습니다. 아래 “지도 · 내비 · 공유”를 이용하세요.</div>';
        }
      });
    }
  });
}

/* ── 원본(큰) 사진: 목록 문서를 가볍게 유지하기 위해 별도 컬렉션(memberPhotos)에 저장, 탭했을 때만 1건 읽음 ── */
var PHOTO_L = {};   // pid -> dataURL ('' = 없음)
var PHOTO_L_ERR = {};   // pid -> 마지막 조회/저장 오류 코드
function photoErrMsg_(code){
  if(code==='permission-denied') return 'Firestore 규칙에서 memberPhotos 컬렉션 읽기/쓰기 허용 필요';
  if(code==='resource-exhausted') return '일일 사용량 한도 초과';
  if(code==='invalid-argument') return '사진 용량 초과';
  return code || '네트워크 오류';
}
function savePlayerPhotoL_(pid, dataUrl){
  if(!pid) return;
  try{ fsBumpRev_(); }catch(e){}
  PHOTO_L[pid] = dataUrl || '';
  delete PHOTO_L_ERR[pid];
  if(!(window.db && FS.enabled)) return;
  try{
    var ref = db.collection('memberPhotos').doc(String(pid));
    var p = dataUrl ? ref.set({id:String(pid), clubId:(state.activeClubId||''), photo:dataUrl, updatedAt:new Date().toISOString()}) : ref.delete();
    p.catch(function(e){
      var code=(e&&e.code)||'';
      PHOTO_L_ERR[pid]=code; delete PHOTO_L[pid];
      try{ console.error('memberPhotos 저장 실패', e); }catch(_){}
      toast('원본 사진 저장 실패 · '+photoErrMsg_(code));
    });
  }catch(e){}
}
function loadPlayerPhotoL_(pid){
  if(!pid) return Promise.resolve('');
  if(PHOTO_L[pid]!==undefined) return Promise.resolve(PHOTO_L[pid]);
  if(!(window.db && FS.enabled)) return Promise.resolve('');
  return db.collection('memberPhotos').doc(String(pid)).get().then(function(d){
    kjRead_('memberPhotos','원본 1건',1);
    var v=(d && d.exists && d.data() && d.data().photo) || '';
    PHOTO_L[pid]=v; delete PHOTO_L_ERR[pid]; return v;
  }).catch(function(e){
    PHOTO_L_ERR[pid]=(e&&e.code)||'unknown';
    try{ console.error('memberPhotos 조회 실패', e); }catch(_){}
    return '';
  });
}
function openPhotoView_(pid, thumb, name, directSrc){

  sub.textContent = directSrc ? '' : '원본 불러오는 중...';
  w.classList.add('open');
  if(directSrc) return;
  loadPlayerPhotoL_(pid).then(function(big){
    if(!w.classList.contains('open')) return;
    if(big){ img.src=big; sub.textContent=''; }
    else if(PHOTO_L_ERR[pid]){ sub.textContent='원본 조회 실패 · '+photoErrMsg_(PHOTO_L_ERR[pid]); }
    else { sub.textContent='원본이 없어 축소본을 표시합니다 · 사진을 다시 등록하면 원본이 저장돼요'; }
  });
}

function photoBtnTap_(){

/* 프로필 사진: 정사각형 크롭 후 128px JPEG로 축소 저장 (Firestore 문서에 내장) */
function pickPlayerPhoto(input){
  var file=input.files&&input.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){ openCropper_(img); };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
  try{ input.value=''; }catch(err){}   // 같은 파일 재선택 허용
}
/* ── 프로필 사진 영역 조절: 이동(드래그) + 확대·축소(핀치/슬라이더/휠) ── */
var CROP={img:null,V:600,scale:1,min:1,ox:0,oy:0,ptrs:{},dist:0,bound:false};
function openCropper_(img){
  var V=CROP.V;
  CROP.img=img;
  CROP.min=Math.max(V/img.width, V/img.height);
  CROP.scale=CROP.min;
  CROP.ox=(V-img.width*CROP.scale)/2; CROP.oy=(V-img.height*CROP.scale)/2;
  var z=document.getElementById('cropZoom'); if(z) z.value=100;
  cropBind_();
  cropDraw_();
  var w=document.getElementById('cropWrap'); if(w) w.classList.add('open');
}
function cropClamp_(){
  var V=CROP.V, w=CROP.img.width*CROP.scale, h=CROP.img.height*CROP.scale;
  CROP.ox=Math.min(0, Math.max(V-w, CROP.ox));
  CROP.oy=Math.min(0, Math.max(V-h, CROP.oy));
}
function cropDraw_(){
  var cv=document.getElementById('cropCv'); if(!cv||!CROP.img) return;
  var V=CROP.V, ctx=cv.getContext('2d');
  try{ ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high'; }catch(e){}
  ctx.clearRect(0,0,V,V);
  ctx.fillStyle='#111'; ctx.fillRect(0,0,V,V);
  ctx.drawImage(CROP.img, CROP.ox, CROP.oy, CROP.img.width*CROP.scale, CROP.img.height*CROP.scale);
  // 원 밖은 어둡게
  ctx.save();
  ctx.beginPath(); ctx.rect(0,0,V,V); ctx.arc(V/2,V/2,V/2-6,0,Math.PI*2,true);
  ctx.fillStyle='rgba(0,0,0,.62)'; ctx.fill('evenodd');
  ctx.restore();
  ctx.beginPath(); ctx.arc(V/2,V/2,V/2-6,0,Math.PI*2);
  ctx.lineWidth=4; ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.stroke();
}
function cropZoomTo_(ns, cx, cy){
  ns=Math.max(CROP.min, Math.min(CROP.min*4, ns));
  var k=ns/CROP.scale;
  CROP.ox=cx-(cx-CROP.ox)*k; CROP.oy=cy-(cy-CROP.oy)*k;
  CROP.scale=ns; cropClamp_(); cropDraw_();
  var z=document.getElementById('cropZoom'); if(z) z.value=Math.round(CROP.scale/CROP.min*100);
}
function cropSlider_(v){ if(!CROP.img) return; cropZoomTo_(CROP.min*(parseInt(v,10)||100)/100, CROP.V/2, CROP.V/2); }
function cropPt_(ev){
  var cv=document.getElementById('cropCv'), r=cv.getBoundingClientRect(), k=CROP.V/(r.width||1);
  return {x:(ev.clientX-r.left)*k, y:(ev.clientY-r.top)*k};
}
function cropBind_(){
  if(CROP.bound) return; CROP.bound=true;
  var cv=document.getElementById('cropCv'); if(!cv) return;
  cv.addEventListener('pointerdown', function(ev){
    ev.preventDefault();
    try{ cv.setPointerCapture(ev.pointerId); }catch(e){}
    CROP.ptrs[ev.pointerId]=cropPt_(ev);
    var ids=Object.keys(CROP.ptrs);
    if(ids.length===2){ var a=CROP.ptrs[ids[0]], b=CROP.ptrs[ids[1]]; CROP.dist=Math.hypot(a.x-b.x,a.y-b.y); }
  });
  cv.addEventListener('pointermove', function(ev){
    if(!CROP.ptrs[ev.pointerId]) return;
    ev.preventDefault();
    var np=cropPt_(ev), ids=Object.keys(CROP.ptrs);
    if(ids.length===1){
      var pp=CROP.ptrs[ev.pointerId];
      CROP.ox+=np.x-pp.x; CROP.oy+=np.y-pp.y;
      CROP.ptrs[ev.pointerId]=np; cropClamp_(); cropDraw_();
    }else if(ids.length>=2){
      CROP.ptrs[ev.pointerId]=np;
      var a=CROP.ptrs[ids[0]], b=CROP.ptrs[ids[1]];
      var d=Math.hypot(a.x-b.x,a.y-b.y);
      if(CROP.dist>0 && d>0) cropZoomTo_(CROP.scale*d/CROP.dist, (a.x+b.x)/2, (a.y+b.y)/2);
      CROP.dist=d;
    }
  });
  function up(ev){ delete CROP.ptrs[ev.pointerId]; CROP.dist=0; var ids=Object.keys(CROP.ptrs); if(ids.length===1) CROP.ptrs[ids[0]]=CROP.ptrs[ids[0]]; }
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up); cv.addEventListener('lostpointercapture', up);
  cv.addEventListener('wheel', function(ev){ ev.preventDefault(); var p=cropPt_(ev); cropZoomTo_(CROP.scale*(ev.deltaY<0?1.08:1/1.08), p.x, p.y); }, {passive:false});
}
function cropCancel_(){ var w=document.getElementById('cropWrap'); if(w) w.classList.remove('open'); CROP.img=null; CROP.ptrs={}; }
function cropApply_(){
  var img=CROP.img; if(!img) return;
  var V=CROP.V, sx=-CROP.ox/CROP.scale, sy=-CROP.oy/CROP.scale, sw=V/CROP.scale, sh=V/CROP.scale;
  // 썸네일: 원 안에 보이는 영역 → 128px 정사각 JPEG (선수 목록·스쿼드 토큰용)
  var sz=128, c=document.createElement('canvas'); c.width=sz; c.height=sz;
  var ctx=c.getContext('2d'); try{ ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high'; }catch(err){}
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, sz, sz);
  state.formPhoto=c.toDataURL('image/jpeg',0.82);
  // 원본용: 비율 유지, 긴 변 800px 이내 JPEG (별도 컬렉션에 저장 · 탭할 때만 조회)
  var r=Math.min(800/img.width, 800/img.height, 1);
  var lw=Math.max(1,Math.round(img.width*r)), lh=Math.max(1,Math.round(img.height*r));
  var cl=document.createElement('canvas'); cl.width=lw; cl.height=lh;
  var cx=cl.getContext('2d'); try{ cx.imageSmoothingEnabled=true; cx.imageSmoothingQuality='high'; }catch(err){}
  cx.drawImage(img,0,0,lw,lh);
  var big=cl.toDataURL('image/jpeg',0.85), q=0.85, tries=0;
  while(big.length>900*1024 && tries<6){
    tries++;
    if(q>0.6) q-=0.1; else { lw=Math.round(lw*0.8); lh=Math.round(lh*0.8); cl.width=lw; cl.height=lh; cx=cl.getContext('2d'); cx.drawImage(img,0,0,lw,lh); }
    big=cl.toDataURL('image/jpeg',q);
  }
  state.formPhotoL=big;
  var pv=document.getElementById('pp_prev'); if(pv){ pv.style.background='var(--paper) center/cover no-repeat url('+state.formPhoto+')'; pv.textContent=''; }
  var bt=document.getElementById('pp_btn'); if(bt) bt.textContent='🗑️ 사진 삭제';
  cropCancel_();
}

function savePlayer(){
  var num = document.getElementById('f_num').value.trim();
  var name = document.getElementById('f_name').value.trim();
  if(!name){
    toast('이름은 필수입니다');
    return;
  }

    num: (num===''?'':parseInt(num)),
    name: name,
    size: state.formSize || '',
    positions: state.formPositions.slice(),
    birth: document.getElementById('f_birth').value,
    height: (function(v){ v=String(v||'').trim(); return v===''?'':parseInt(v); })((document.getElementById('f_height')||{}).value),
    weight: (function(v){ v=String(v||'').trim(); return v===''?'':parseInt(v); })((document.getElementById('f_weight')||{}).value),
    region: document.getElementById('f_region').value.trim(),
    status: state.formStatus || '',
    photo: state.formPhoto || ''
  };
  var btn = document.querySelector('#sheetWrap .btn-primary');
  if(btn){ btn.textContent = '저장 중...'; btn.disabled = true; }

  if(state.editId){
    data.id = state.editId;
    // 낙관적 갱신
    state.players = state.players.map(function(p){ return p.id===state.editId ? Object.assign({}, p, data) : p; });
    closeSheet(); render(); toast(name+' 정보를 수정했습니다');
    if(state.formPhotoL!==undefined) savePlayerPhotoL_(state.editId, state.formPhotoL);
    API.run('updatePlayer', data).then(function(list){ state.players = list; if(state.screen==='team') render(); }).catch(function(){ toast('저장 실패 · 새로고침'); });
  } else {
    var tmp = Object.assign({id:'tmp'+Date.now()}, data);
    var prevIds = {}; (state.players||[]).forEach(function(p){ prevIds[p.id]=1; });
    state.players = state.players.concat([tmp]);
    closeSheet(); render(); toast(name+' 선수를 등록했습니다');
    var bigPhoto = state.formPhotoL;
    API.run('addPlayer', data).then(function(list){
      state.players = list;
      if(bigPhoto){ var np=(list||[]).filter(function(p){ return !prevIds[p.id] && p.name===name; })[0]; if(np) savePlayerPhotoL_(np.id, bigPhoto); }
      if(state.screen==='team') render();
    }).catch(function(){ toast('저장 실패 · 새로고침'); });
  }
}

  if(!requireAdmin()) return;
  var p=(state.players||[]).filter(function(x){return x.id===id;})[0];

}
function doDeletePlayer(id){
  var gone=(state.players||[]).filter(function(p){return p.id===id;})[0];
  // 낙관적 갱신: 공유 club 객체를 in-place 수정하면 DB.clubs까지 오염돼 deletePlayer의 clubs 저장이 누락됨 → 새 객체로 교체
  if(gone && gone.name){
    var cid=state.activeClubId;
    state.clubs=(state.clubs||[]).map(function(c){
      if(c.id!==cid) return c;
      var ex=Object.assign({}, c.exPlayers||{}); ex[id]={name:gone.name, num:(gone.num!=null?gone.num:'')};
      return Object.assign({}, c, {exPlayers:ex});
    });
  }
  state.players = state.players.filter(function(p){return p.id!==id;});
  savePlayerPhotoL_(id, '');
  closeSheet(); render(); toast('삭제되었습니다');
  API.run('deletePlayer', id).then(function(list){ state.players = list; if(state.screen==='team') render(); }).catch(function(){ toast('삭제 저장 실패 · 새로고침'); });
}

/* 미투표자 목록 펼치기/접기 (인라인) */
function toggleNvList_(btn){
  var full = btn.parentNode.querySelector('.nv-full'); if(!full) return;
  var open = (full.style.display==='none' || !full.style.display);
  full.style.display = open ? 'flex' : 'none';
  var c = btn.querySelector('.nv-caret'); if(c) c.textContent = open ? '접기 ▴' : '펼치기 ▾';
}

/* ================= 경기 폼 ================= */
/* 기록 여부: 필드가 없으면(과거 경기) 전부 기록으로 간주 */
function recOn_(m, key){ return !(m && m[key]===false); }
/* 경기(승무패) 기록을 끈 경기는 저장된 결과가 있어도 무시 */
function hasResult_(m){ return recOn_(m,'recMatch') && (m.result==='W'||m.result==='D'||m.result==='L'); }
function recChk_(key, label, m){
  return '<label style="flex:1 1 42%;display:flex;align-items:center;gap:7px;padding:10px 11px;border:1.5px solid var(--line-strong);border-radius:11px;font-size:13.5px;font-weight:700;cursor:pointer;background:#fff;">'
   + '<input type="checkbox" id="g_'+key+'" style="width:17px;height:17px;accent-color:var(--red);flex:0 0 auto;" '+(recOn_(m,key)?'checked':'')+'> '+label+'</label>';
}

  if(!requireAdmin()) return;
  if(!requireAdmin()) return;

  var m = id ? state.matches.filter(function(x){return x.id===id;})[0] : null;
  var title = id ? '경기 정보 수정' : '경기 등록';
  venuePick = (m && m.lat!=null && m.lat!=='' && m.lng!=null && m.lng!=='') ? {lat:Number(m.lat), lng:Number(m.lng)} : null;
  venuePickUrl = (m && m.venueUrl) ? m.venueUrl : '';
  var oppOpts = matchOpponents_().map(function(o){ return '<option value="'+esc(o)+'">'; }).join('');
  var venOpts = pastVenues_().map(function(pv){ return '<option value="'+esc(pv.venue)+'">'; }).join('');
  var html = '<div class="grabber"></div>'
   + '<div class="sheet-head"><h3>'+title+'</h3><button class="x" onclick="closeSheet()">✕</button></div>'

   +     '<div class="field"><label>시간</label><input id="g_time" type="time" value="'+(m&&cleanTime(m.time)?cleanTime(m.time):'15:00')+'"></div>'
   +   '</div>'
   +   '<div class="field"><label>상대팀<span class="req">*</span></label>'

   +     '<datalist id="g_opp_list">'+oppOpts+'</datalist>'
   +     (oppOpts?'<p class="hint" style="margin:5px 2px 0;">기존 상대팀을 선택하면 기록에서 함께 집계돼요. (같은 팀은 같은 이름으로)</p>':'')
   +   '</div>'
   +   '<div class="field"><label>경기장</label>'
   +     '<input id="g_venue" type="text" list="g_venue_list" autocomplete="off" placeholder="입력 또는 과거 경기장 선택" value="'+(m&&m.venue?esc(m.venue):'')+'" onchange="loadPastVenue_(this.value)">'
   +     '<datalist id="g_venue_list">'+venOpts+'</datalist>'
   +     (venOpts?'<p class="hint" style="margin:5px 2px 0;">과거 경기장을 선택하면 아래 지도 위치도 함께 불러와요.</p>':'')
   +   '</div>'

   +     '<div style="display:flex;flex-wrap:wrap;gap:8px;">'
   +       recChk_('recMatch','경기 (승·무·패)', m)
   +       recChk_('recAtt','출석', m)
   +       recChk_('recGoal','득점', m)
   +       recChk_('recAssist','어시', m)
   +     '</div>'
   +     '<p class="hint" style="margin:6px 2px 0;">해제한 항목은 결과 입력 화면에서 빠지고, 기록·순위에도 집계되지 않아요.</p>'
   +   '</div>'

   +     '<div class="map-search"><input id="g_map_q" type="text" placeholder="장소·상호·주소 검색 (예: 매화 축구장)" onkeydown="if(event.key===\'Enter\'){event.preventDefault();searchVenue();}"><button type="button" onclick="searchVenue()">검색</button></div>'

   +   '</div>'
   +   '<button class="btn-primary" onclick="saveMatch(\''+(id||'')+'\')">'+(id?'수정 완료':'등록하기')+'</button>'
