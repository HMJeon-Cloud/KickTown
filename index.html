FS.run = function(fn, args){
  return FS.ready.then(function(){
    /* ── 필요한 범위만 선로딩 ── */
    var cid = window.ACTIVE_CLUB || state.activeClubId || null;
    var pre = Promise.resolve();
    if(fn==='getRecordBundle'){ pre = fsLoadMatchKids(cid, args[0]); }
    else if(fn==='getMatchReport'){ pre = fsLoadKidsForMatches_(cid, [args[0]]); }
    else if(fn==='getPlayerCareer'){ pre = fsLoadPlayerKids_(cid, args[0]); }
    else if(fn==='getSquadDetail'){ pre = fsLoadSquadKids(args[0]); }
    else if(fn==='restoreBackup' && cid){
      pre = fsLoadMatchKids(cid).then(function(){
        var ch=Promise.resolve();
        (DB.squads||[]).filter(function(sq){ return sq.clubId===cid; }).forEach(function(sq){ ch=ch.then(function(){ return fsLoadSquadKids(sq.id); }); });
        return ch;
      });
    }
    else if(cid){ pre = fsLoadTeam(cid); var t=WRITE_TOUCH[fn]||[];
      if(t.indexOf('stats')>-1||t.indexOf('attendance')>-1){
        var mi = MATCH_ARG[fn];
        if(mi!=null && args[mi]) pre=pre.then(function(){ return fsLoadKidsForMatches_(cid, [args[mi]]); });
        else pre=pre.then(function(){ return fsLoadMatchKids(cid); });
      }
      if((t.indexOf('members')>-1||t.indexOf('notes')>-1) && state.currentSquadId) pre=pre.then(function(){ return fsLoadSquadKids(state.currentSquadId); });
    }
    return pre.then(function(){ return FS._dispatch(fn, args); });
  });
};
FS._dispatch = function(fn, args){
    if(fn==='setConfig'){ var rc=mockHandler(fn, args); fsSyncConfig(); fsBumpRev_(); ktCacheSave_(); try{ logConfig_(args[0]); }catch(e){} return rc; }
    var touched=WRITE_TOUCH[fn];
    if(touched){
      var before=fsSnapshot(touched);
      var ld=null; try{ ld=logDescribe_(fn, args); }catch(e){}
      var res=mockHandler(fn, args);
      try{ recTouch_(touched); }catch(e){}
      touched.forEach(function(k){ fsSyncDiff(k, before[k]); });
      fsBumpRev_();
      ktCacheSave_();
      if(ld){ try{ logWrite_(fn, args, res, ld); }catch(e){} }
      return res;
    }
    return mockHandler(fn, args);   // 읽기 (메모리 즉시)
};

function verNum_(v){ var p=String(v||'').split('.'); return (parseInt(p[0],10)||0)*100000+(parseInt(p[1],10)||0)*100+(parseInt(p[2],10)||0); }
function checkForUpdate_(){

          try{ if(sessionStorage.getItem('kt_upd')===String(j.version)) return; sessionStorage.setItem('kt_upd', String(j.version)); }catch(e){}
          var go=function(){ try{ location.reload(); }catch(e){} };
          try{ if(navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage('CLEAR_CACHE'); }catch(e){}
          if(window.caches){ caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); }).then(go, go); }
          else go();

}

var _ptrInit=false;
function initPTR_(){
  if(_ptrInit) return; _ptrInit=true;
  var content=document.getElementById('content'), phone=document.querySelector('.phone');
  if(!content || !phone) return;
  var ind=document.createElement('div'); ind.className='ptr-ind'; ind.innerHTML='<div class="ptr-spin2"></div>';
  phone.appendChild(ind);
  var THRESH=66, MAX=96, startY=0, pulling=false, dist=0, active=false;
  function place(){ var ct=content.getBoundingClientRect().top - phone.getBoundingClientRect().top; ind.style.top=(ct+6)+'px'; }
  function reset(anim){
    ind.classList.remove('ready');
    ind.style.transition = anim ? 'transform .2s ease, opacity .2s ease' : '';
    ind.style.transform='translateY(-6px)'; ind.style.opacity='0';
    if(anim) setTimeout(function(){ ind.style.transition=''; }, 220);
  }
  content.addEventListener('touchstart', function(e){
    if(e.touches.length!==1){ pulling=false; return; }
    // 시트/모달 열려있으면 PTR 비활성
    var sheetOpen=document.getElementById('sheetWrap').classList.contains('open');
    var cfmOpen=document.getElementById('cfmWrap').classList.contains('open');
    if(content.scrollTop<=0 && !sheetOpen && !cfmOpen){ startY=e.touches[0].clientY; pulling=true; dist=0; place(); ind.style.transition=''; }
    else pulling=false;
  }, {passive:true});
  content.addEventListener('touchmove', function(e){
    if(!pulling) return;
    var dy=e.touches[0].clientY - startY;
    if(dy<=0 || content.scrollTop>0){ dist=0; ind.style.opacity='0'; ind.style.transform='translateY(-6px)'; return; }
    dist=Math.min(dy*0.5, MAX);
    ind.style.opacity=String(Math.min(dist/THRESH,1));
    ind.style.transform='translateY('+dist+'px)';
    ind.querySelector('.ptr-spin2').style.transform='rotate('+Math.round(dist*3.2)+'deg)';
    if(dist>=THRESH) ind.classList.add('ready'); else ind.classList.remove('ready');
  }, {passive:true});
  content.addEventListener('touchend', function(){
    if(!pulling) return; pulling=false;
    if(dist>=THRESH && !active){
      active=true;
      ind.classList.add('spinning');
      ind.style.transition='transform .18s ease';
      ind.style.transform='translateY('+THRESH+'px)'; ind.style.opacity='1';
      setTimeout(function(){ try{ sessionStorage.setItem('kt_fresh','1'); }catch(e){} try{ location.reload(); }catch(e){ reset(true); active=false; } }, 300);
    } else { reset(true); }
  }, {passive:true});
}

/* ================= 시즌 최고 연속 기록 · MOM 집계 · 베스트 11 ================= */
/* 기간(경기 목록) 안에서 선수별 '최고 연속' 기록 {pid:{att,g,a}} */
function bestStreaks_(ms, stats, att){
  var attByM={}, statByM={};
  (att||[]).forEach(function(x){ (attByM[x.matchId]=attByM[x.matchId]||{})[x.playerId]=x.status; });
  (stats||[]).forEach(function(x){ (statByM[x.matchId]=statByM[x.matchId]||{})[x.playerId]=x; });
  var today=attToday_();
  var asc=(ms||[]).filter(function(m){ return m.date && m.date<=today && attByM[m.id]; })
    .slice().sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); });
  var pids={};
  Object.keys(attByM).forEach(function(mid){ Object.keys(attByM[mid]).forEach(function(p){ pids[p]=1; }); });
  Object.keys(statByM).forEach(function(mid){ Object.keys(statByM[mid]).forEach(function(p){ pids[p]=1; }); });
  var out={};
  Object.keys(pids).forEach(function(pid){
    var cur={att:0,g:0,a:0}, best={att:0,g:0,a:0};
    asc.forEach(function(m){
      var st=(attByM[m.id]||{})[pid], sv=(statByM[m.id]||{})[pid];
      var present=(st==='present'||st==='late');
      if(present){ cur.att++; if(cur.att>best.att) best.att=cur.att; } else cur.att=0;
      if(present||sv){
        var g=sv?(Number(sv.goals)||0):0, a=sv?(Number(sv.assists)||0):0;
        if(g>0){ cur.g++; if(cur.g>best.g) best.g=cur.g; } else cur.g=0;
        if(a>0){ cur.a++; if(cur.a>best.a) best.a=cur.a; } else cur.a=0;
      }
    });
    out[pid]=best;
  });
  return out;
}
/* 최고 연속 1위 {v, names, pids} */
function streakTop_(map, key){
  var arr=Object.keys(map||{}).map(function(pid){ return {pid:pid, v:(map[pid]||{})[key]||0}; })
    .filter(function(r){ return r.v>1; }).sort(function(x,y){ return y.v-x.v; });
  if(!arr.length) return null;
  var mx=arr[0].v, tops=arr.filter(function(r){ return r.v===mx; });
  return {v:mx, pids:tops.map(function(r){return r.pid;}), names:tops.map(function(r){ return pname_(r.pid).name; })};
}
/* 경기 기록에 저장된 MOM 횟수 {pid:n} */
function momCountMap_(ms){
  var o={};
  (ms||[]).forEach(function(m){
    String(m.momIds||'').split(',').forEach(function(p){ p=p.trim(); if(p) o[p]=(o[p]||0)+1; });
  });
  return o;
}
function momTop_(ms){
  var o=momCountMap_(ms);
  var arr=Object.keys(o).map(function(pid){ return {pid:pid, v:o[pid]}; }).sort(function(x,y){ return y.v-x.v; });
  if(!arr.length) return null;
  var mx=arr[0].v, tops=arr.filter(function(r){ return r.v===mx; });
  return {v:mx, pids:tops.map(function(r){return r.pid;}), names:tops.map(function(r){ return pname_(r.pid).name; })};
}
/* 시즌 경기 목록 */
function seasonMatches_(b, key){
  return (b.matches||[]).filter(function(m){ return m.date && seasonKeyOf_(m.date)===key; });
}

/* ── 시즌 베스트 11 ──
 * 점수 = MOM 0.40 + 출석 0.30 + 득점 0.20 + 도움 0.10 (각 항목은 시즌 최고값 대비 비율) */
var B11_W={mom:0.40, att:0.30, g:0.20, a:0.10};
var POS_GRP={GK:'GK',DF:'DF',CB:'DF',LB:'DF',RB:'DF',LWB:'DF',RWB:'DF',
  MF:'MF',DM:'MF',CM:'MF',AM:'MF',LM:'MF',RM:'MF',FW:'FW',ST:'FW',CF:'FW',LW:'FW',RW:'FW'};
var B11_SLOTS=[
  {pos:'GK',grp:'GK',x:0.50,y:0.92},
  {pos:'LB',grp:'DF',x:0.15,y:0.74},{pos:'CB',grp:'DF',x:0.38,y:0.78},{pos:'CB',grp:'DF',x:0.62,y:0.78},{pos:'RB',grp:'DF',x:0.85,y:0.74},
  {pos:'CM',grp:'MF',x:0.27,y:0.53},{pos:'CM',grp:'MF',x:0.50,y:0.57},{pos:'CM',grp:'MF',x:0.73,y:0.53},
  {pos:'LW',grp:'FW',x:0.20,y:0.27},{pos:'ST',grp:'FW',x:0.50,y:0.20},{pos:'RW',grp:'FW',x:0.80,y:0.27}
];
function best11_(key, b){
  b=b||state._hofBundle||{};
  var ms=seasonMatches_(b, key);
  var s=seasonAggFrom_(ms, b.stats||[], b.attendance||[]);
  var mom=momCountMap_(ms);
  var midSet={}; ms.forEach(function(m){ midSet[m.id]=1; });
  var agg={};
  function bk(p){ if(!agg[p]) agg[p]={g:0,a:0,att:0,mom:0}; return agg[p]; }
  (b.stats||[]).forEach(function(x){ if(!midSet[x.matchId]) return; var k=bk(x.playerId); k.g+=Number(x.goals)||0; k.a+=Number(x.assists)||0; });
  var lateScore=(state.cfg&&state.cfg.lateScore!=null)?Number(state.cfg.lateScore):0.5;
  var absentScore=(state.cfg&&state.cfg.absentScore!=null)?Number(state.cfg.absentScore):-1;
  (b.attendance||[]).forEach(function(x){ if(!midSet[x.matchId]) return; var k=bk(x.playerId);
    if(x.status==='present') k.att+=1; else if(x.status==='late') k.att+=lateScore; else if(x.status==='absent') k.att+=absentScore; });
  Object.keys(mom).forEach(function(p){ bk(p).mom=mom[p]; });
  var mx={g:0,a:0,att:0,mom:0};
  Object.keys(agg).forEach(function(p){ ['g','a','att','mom'].forEach(function(k){ if(agg[p][k]>mx[k]) mx[k]=agg[p][k]; }); });
  var rows=Object.keys(agg).map(function(pid){
    var v=agg[pid];
    var sc=0; ['mom','att','g','a'].forEach(function(k){ sc+=B11_W[k]*(mx[k]>0?Math.max(0,v[k])/mx[k]:0); });
    var p=pname_(pid);
    var pos0=((p.positions||[])[0]||'');
    var grp=POS_GRP[pos0]||'MF';          /* 포지션 미등록 → 미드필더로 간주 */
    return {pid:pid, name:p.name, num:p.num, photo:p.photo||'', pos:pos0, grp:grp,
      g:v.g, a:v.a, att:Math.round(v.att*10)/10, mom:v.mom, score:Math.round(sc*1000)/10,
      part:{mom:Math.round(B11_W.mom*(mx.mom>0?v.mom/mx.mom:0)*1000)/10,
            att:Math.round(B11_W.att*(mx.att>0?Math.max(0,v.att)/mx.att:0)*1000)/10,
            g:Math.round(B11_W.g*(mx.g>0?v.g/mx.g:0)*1000)/10,
            a:Math.round(B11_W.a*(mx.a>0?v.a/mx.a:0)*1000)/10}};
  }).filter(function(r){ return r.score>0 && !/\(탈퇴\)/.test(r.name); })
    .sort(function(x,y){ return y.score-x.score; });
  /* 항목별 1위 표시용 순위 */
  ['mom','att','g','a'].forEach(function(k){
    rows.slice().sort(function(x,y){ return y[k]-x[k]; }).forEach(function(r,i,arr){
      if(r[k]>0 && r[k]===arr[0][k]) r['top_'+k]=1;
    });
  });
  /* 슬롯 배정
   *  ① 포지션 그룹(GK/DF/MF/FW)별로 '점수 상위' 선수를 자리 수만큼 먼저 선발한다.
   *  ② 선발된 선수끼리 자리를 나눌 때만 세부 포지션(LB·CB 등)을 맞춘다.
   *     → 세부 포지션이 같다는 이유로 점수가 낮은 선수가 뽑히지 않는다.
   *  ③ 그룹에 인원이 부족해 빈 자리는 남은 선수 중 점수순으로 채운다. */
  var used={}, picks=new Array(B11_SLOTS.length);
  function fit_(r, sl){ return Object.assign({}, r, sl, {realPos:r.pos}); }
  var grpSlots={};
  B11_SLOTS.forEach(function(sl, i){ (grpSlots[sl.grp]=grpSlots[sl.grp]||[]).push({sl:sl, idx:i}); });
  Object.keys(grpSlots).forEach(function(g){
    var slots=grpSlots[g];
    var cand=rows.filter(function(r){ return r.grp===g; }).slice(0, slots.length);
    cand.forEach(function(c){ used[c.pid]=1; });
    var remain=cand.slice();
    slots.forEach(function(o){                       /* 세부 포지션 일치 우선 */
      for(var i=0;i<remain.length;i++){
        if(remain[i].pos===o.sl.pos){ picks[o.idx]=fit_(remain.splice(i,1)[0], o.sl); return; }
      }
    });
    slots.forEach(function(o){                       /* 남은 인원 점수순 배치 */
      if(!picks[o.idx] && remain.length) picks[o.idx]=fit_(remain.shift(), o.sl);
    });
  });
  B11_SLOTS.forEach(function(sl, i){                 /* 인원 부족으로 빈 자리 */
    if(picks[i]) return;
    for(var j=0;j<rows.length;j++){
      if(!used[rows[j].pid]){ used[rows[j].pid]=1; picks[i]=fit_(rows[j], sl); return; }
    }
  });
  picks=picks.filter(function(p){ return p && p.pid; });
  var sel=picks;
  /* 선발되지 못한 선수: 사유(같은 포지션 경쟁 / 점수 순위) */
  var slotByGrp={}; B11_SLOTS.forEach(function(sl){ slotByGrp[sl.grp]=(slotByGrp[sl.grp]||0)+1; });
  var out=rows.filter(function(r){ return !used[r.pid]; }).map(function(r){
    var better=sel.filter(function(p){ return p.grp===r.grp && p.score>=r.score; }).length;
    r.why = (better>=(slotByGrp[r.grp]||0) && better>0)
      ? (r.grp+' 자리 '+(slotByGrp[r.grp]||0)+'명 마감 · 같은 포지션에 점수 높은 선수 '+better+'명')
      : '점수 순위 밖';
    return r;
  });
  return {key:key, picks:sel, rows:rows, out:out, season:s};
}
function openBest11_(key){
  var d=best11_(key);
  if(!d.picks.length){ toast('해당 시즌 기록이 없습니다'); return; }
  function tops_(p){
    var t='';
    if(p.top_mom) t+='<span class="b11-top">MOM 1위</span>';
    if(p.top_att) t+='<span class="b11-top">출석 1위</span>';
    if(p.top_g) t+='<span class="b11-top">득점 1위</span>';

  }
  function line_(p, why){
    return '<div class="b11-row"><span class="b11-pos">'+esc(p.pos||'-')+'</span>'

      + '<span class="b11-sub">MOM '+p.mom+' · 출석 '+p.att+' · '+p.g+'골 '+p.a+'도움'
      +   '<br><span style="color:#9a7b23;">점수 '+p.part.mom+' + '+p.part.att+' + '+p.part.g+' + '+p.part.a+'</span>'
      +   (why?'<br><span style="color:var(--red);">'+esc(why)+'</span>':'')+'</span>'
      + '<span class="b11-sc oswald">'+p.score+'</span></div>';
  }
  var rows=d.picks.map(function(p){ return line_(p,''); }).join('');
  var outRows=(d.out||[]).slice(0,5).map(function(p){ return line_(p, p.why); }).join('');
  showSheet('<div class="grabber"></div>'
   + '<div class="sheet-head"><h3>⭐ '+seasonLabel_(key)+' 베스트 11</h3><button class="x" onclick="closeSheet()">✕</button></div>'
   + '<div class="sheet-body">'
   +   '<div class="b11-help">'
   +     '<b>선정 기준</b><br>'
   +     '① 항목별 <b>시즌 1위 선수를 100%</b>로 두고 내 기록의 비율을 계산해요.<br>'
   +     '② 그 비율에 비중을 곱해 더합니다 — <b>MOM 40 · 출석 30 · 득점 20 · 도움 10</b> (만점 100).<br>'
   +     '③ 점수가 높은 순서로 <b>4-3-3 포지션 자리</b>에 배치합니다. GK 1 · DF 4 · MF 3 · FW 3<br>'
   +     '<span style="color:var(--steel-soft);">→ 출석 1위여도 MOM·득점·도움이 없으면 최대 30점이라, 같은 포지션에 점수가 더 높은 선수가 있으면 빠질 수 있어요.</span>'

/* ================= MOM 투표 =================
 * 흐름: 스쿼드 인원으로 후보 생성 → 링크 공유(카톡) → 팀원 1탭 투표 → 관리자 마감 →
 *       경기 기록에 MOM 확정 저장(수정 불가). 투표 문서가 사라져도 경기 기록의 MOM은 남는다.
 * 저장: Firestore momVotes/{voteId} — 투표자는 이 문서 1건만 읽고 쓴다(읽기 사용량 최소). */
var VOTE_COLL='momVotes';
function voteKey_(){
  try{
    var k=localStorage.getItem('kt_vk');
    if(!k){ k='k'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); localStorage.setItem('kt_vk',k); }
    return k;
  }catch(e){ return 'k'+Math.random().toString(36).slice(2,9); }
}
/* 투표 화면용 엠블럼 (흰 배경 제거 · 워터마크용 반투명본 함께 생성) */
var _voteEmb=null;
function voteEmblem_(cb){
  if(_voteEmb){ cb(_voteEmb); return; }
  loadImg_(APP_LOGO).then(function(im){
    var out={logo:APP_LOGO, wm:''};
    try{
      var c=im?emblemCut_(im):null;
      if(c && c.toDataURL){
        out.logo=c.toDataURL('image/png');
        var f=document.createElement('canvas'); f.width=c.width; f.height=c.height;
        var fx=f.getContext('2d'); fx.globalAlpha=0.16; fx.drawImage(c,0,0);
        out.wm=f.toDataURL('image/png');
      }
    }catch(e){}
    _voteEmb=out; cb(out);
  }).catch(function(){ cb({logo:APP_LOGO, wm:''}); });
}
/* 투표 화면 배경 = 엠블럼(반투명) + 어둡게 깔린 경기장 사진 */
function voteSkin_(){
  var el=document.getElementById('pinScreen'); if(!el) return;
  voteEmblem_(function(e){
    var el2=document.getElementById('pinScreen'); if(!el2 || !el2.classList.contains('vote')) return;
    Array.prototype.forEach.call(el2.querySelectorAll('.vt-logo'), function(im){ if(e.logo) im.src=e.logo; });
    var bgImg=(AUTH_BG?'url("'+AUTH_BG+'")':'radial-gradient(120% 90% at 50% 0%,#201D28 0%,#111015 60%,#0C0B10 100%)');
    var shade='linear-gradient(180deg,rgba(8,9,13,.58) 0%,rgba(8,9,13,.80) 45%,rgba(8,9,13,.93) 100%)';
    if(e.wm){
      el2.style.backgroundImage='url("'+e.wm+'"), '+shade+', '+bgImg;
      el2.style.backgroundSize='76% auto, cover, cover';
      el2.style.backgroundPosition='center 26%, center, center';
      el2.style.backgroundRepeat='no-repeat, no-repeat, no-repeat';
    } else {
      el2.style.backgroundImage=shade+', '+bgImg;
      el2.style.backgroundSize='cover, cover';
      el2.style.backgroundPosition='center, center';
    }
  });
}
function voteHashId_(){ var m=String(location.hash||'').match(/^#vote=([A-Za-z0-9_-]+)/); return m?m[1]:''; }
function voteUrl_(id){ return location.origin+location.pathname+'#vote='+id; }
function voteRef_(id){ return db.collection(VOTE_COLL).doc(String(id)); }

/* ── 관리자: 투표 만들기 ── */
function openMomVote_(sid){
  if(!requireAdmin()) return;
  var d=state.squadDetail;
  if(!d || !d.squad || d.squad.id!==sid){ toast('스쿼드를 먼저 선택하세요'); return; }
  var mems=(d.members||[]).filter(function(m){ return !m.guest; });
  if(!mems.length){ toast('스쿼드에 편성된 팀원이 없습니다'); return; }
  state._vote={ sid:sid, sel:{}, matchId:'' };
  mems.forEach(function(m){ state._vote.sel[m.playerId]=true; });
  var ms=(state.matches||[]).slice().sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); });
  var today=attToday_();
  var near=ms.filter(function(m){ return m.date && m.date<=today; })[0] || ms[0];
  state._vote.matchId=near?near.id:'';
  renderMomSetup_();
}
function renderMomSetup_(){
  var v=state._vote, d=state.squadDetail;
  var mems=(d.members||[]).filter(function(m){ return !m.guest; });
  var ms=(state.matches||[]).slice().sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); }).slice(0,12);
  var opts=ms.map(function(m){
    return '<option value="'+m.id+'"'+(m.id===v.matchId?' selected':'')+'>'+fmtDateDot(m.date)+' vs '+esc(m.opponent||'상대')+(m.momNames?' · MOM 확정':'')+'</option>';
  }).join('');
  var n=mems.filter(function(m){ return v.sel[m.playerId]; }).length;
  var rows=mems.map(function(m){
    var on=!!v.sel[m.playerId];
    return '<div class="vt-pick'+(on?' on':'')+'" id="mp_'+m.playerId+'" onclick="momToggle_(\''+m.playerId+'\')">'
      + (m.photo?'<img class="vt-ava" src="'+m.photo+'" alt="">':'<div class="vt-ava vt-ava-e">👤</div>')
      + '<span class="vt-num oswald">'+numDisp(m.num)+'</span>'
      + '<span class="vt-nm">'+esc(m.name)+'</span>'
      + '<span class="vt-ck">'+(on?'✓':'')+'</span></div>';
  }).join('');
  showSheet('<div class="grabber"></div>'
   + '<div class="sheet-head"><h3>🗳️ MOM 투표 만들기</h3><button class="x" onclick="closeSheet()">✕</button></div>'
   + '<div class="sheet-body">'
   +   '<div class="field"><label>대상 경기 (MOM이 기록될 경기)</label><select id="vt_match" onchange="state._vote.matchId=this.value">'+(opts||'<option value="">등록된 경기 없음</option>')+'</select></div>'
   +   '<div class="eyebrow" style="margin:14px 0 6px;">후보 <span id="mp_n">'+n+'</span>명 · 탭해서 제외/추가</div>'
   +   '<div class="vt-list">'+rows+'</div>'
   +   '<button class="btn-primary" style="margin-top:14px;" onclick="momCreate_()">🔗 투표 링크 만들기</button>'
   +   '<p style="font-size:12px;color:var(--steel-soft);margin:10px 2px 0;line-height:1.5;">링크를 받은 팀원은 로그인 없이 한 번의 탭으로 투표합니다. 마감하면 MOM이 경기 기록에 저장돼요.</p>'
   + '</div>');
}
/* 목록을 다시 그리지 않고 해당 행만 갱신 — 아래쪽을 선택해도 스크롤이 맨 위로 튀지 않는다 */
function momToggle_(pid){
  var v=state._vote; if(!v) return;
  v.sel[pid]=!v.sel[pid];
  var row=document.getElementById('mp_'+pid);
  if(!row){ renderMomSetup_(); return; }
  var on=!!v.sel[pid];
  row.classList.toggle('on', on);
  var ck=row.querySelector('.vt-ck'); if(ck) ck.textContent=on?'✓':'';
  var d=state.squadDetail||{};
  var n=(d.members||[]).filter(function(m){ return !m.guest && v.sel[m.playerId]; }).length;
  var el=document.getElementById('mp_n'); if(el) el.textContent=n;
}
function momCreate_(force){
  var v=state._vote, d=state.squadDetail;
  if(!v||!d){ return; }
  if(state._voteBusy){ return; }                 /* 버튼 연타로 중복 생성되는 것 방지 */
  var mems=(d.members||[]).filter(function(m){ return !m.guest && v.sel[m.playerId]; });
  if(mems.length<2){ toast('후보를 2명 이상 선택하세요'); return; }
  if(!v.matchId){ toast('대상 경기를 선택하세요'); return; }
  if(!window.db || !FS.enabled){ toast('네트워크 연결을 확인해주세요'); return; }
  state._voteBusy=true;
  var btn=document.querySelector('#sheetWrap .btn-primary'); if(btn){ btn.disabled=true; btn.textContent='만드는 중...'; }
  if(!force){
    /* 같은 경기에 이미 만들어진 투표가 있으면 새로 만들지 않고 알려준다 */
    return db.collection(VOTE_COLL).where('matchId','==',v.matchId).limit(5).get().then(function(qs){
      var ex=[]; qs.forEach(function(dd){ ex.push(dd.data()); });
      state._voteBusy=false;
      if(ex.length){
        var open=ex.filter(function(x){ return !x.closed; })[0] || ex[0];
        state._voteDoc=open;
        showSheet('<div class="grabber"></div>'
         + '<div class="sheet-head"><h3>이미 만든 투표가 있어요</h3><button class="x" onclick="closeSheet()">✕</button></div>'
         + '<div class="sheet-body">'
         +   '<p style="font-size:13px;color:var(--steel);margin:0 0 14px;line-height:1.6;"><b>'+esc(open.title||'')+'</b><br>'+(open.closed?'마감된 투표':'진행 중 · '+Object.keys(open.votes||{}).length+'표')+'<br>같은 경기에 투표가 '+ex.length+'건 있습니다.</p>'
         +   '<button class="btn-primary" onclick="openVoteAdmin_(\''+open.id+'\')">📊 기존 투표 열기</button>'
         +   '<button class="btn-ghost" style="margin-top:8px;" onclick="momCopy_(\''+open.id+'\')">📋 기존 투표 링크 복사</button>'
         +   '<button class="btn-ghost" style="margin-top:8px;" onclick="momCreateForce_()">➕ 그래도 새로 만들기</button>'
         + '</div>');
        return;
      }
      momCreate_(true);
    }).catch(function(){ state._voteBusy=false; momCreate_(true); });
  }
  var m=(state.matches||[]).filter(function(x){ return x.id===v.matchId; })[0]||{};
  var id='v'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  var doc={
    id:id, clubId:(window.ACTIVE_CLUB||state.activeClubId||''), matchId:v.matchId, squadId:v.sid,
    team:ourTeamName_(), title:(m.date?fmtDateDot(m.date):'')+' vs '+(m.opponent||'상대'),
    date:m.date||attToday_(),
    cands:mems.map(function(x){ return {pid:x.playerId, name:String(x.name||''), num:String(x.num||'')}; }),
    votes:{}, closed:false, winners:[], createdAt:new Date().toISOString()
  };
  toast('투표를 만드는 중...');
  voteRef_(id).set(doc).then(function(){
    state._voteBusy=false;
    state._voteDoc=doc;
    closeSheet();
    momShareSheet_(doc);
    try{ logEvent_('vote','create','MOM 투표 · '+doc.title); }catch(e){}
  }).catch(function(e){ state._voteBusy=false; if(window.console)console.warn(e); toast('투표 생성 실패 · 네트워크를 확인해주세요'); });
}
function momCreateForce_(){ closeSheet(); setTimeout(function(){ momCreate_(true); }, 60); }
function momShareSheet_(doc){
  var url=voteUrl_(doc.id);
  showSheet('<div class="grabber"></div>'
   + '<div class="sheet-head"><h3>🔗 투표 링크</h3><button class="x" onclick="closeSheet()">✕</button></div>'
   + '<div class="sheet-body">'
   +   '<p style="font-size:13px;color:var(--steel);margin:0 0 12px;line-height:1.55;"><b>'+esc(doc.title)+'</b><br>후보 '+doc.cands.length+'명 · 링크를 카카오톡 단톡방에 공유하세요.</p>'
   +   '<div class="vt-url" onclick="momCopy_(\''+doc.id+'\')">'+esc(url)+'</div>'
   +   '<button class="btn-primary" style="margin-top:12px;" onclick="momShare_(\''+doc.id+'\')">📤 카카오톡 등으로 공유</button>'
   +   '<button class="btn-ghost" style="margin-top:8px;" onclick="momCopy_(\''+doc.id+'\')">📋 링크 복사</button>'
   +   '<button class="btn-ghost" style="margin-top:8px;" onclick="openVoteAdmin_(\''+doc.id+'\')">📊 투표 현황 보기</button>'
   + '</div>');
}
function momShare_(id){
  var url=voteUrl_(id), doc=state._voteDoc||{};
  var txt='[MOM 투표] '+(doc.title||'')+'\n오늘의 MOM을 뽑아주세요! (한 번만 탭하면 끝)\n'+url;
  if(navigator.share){ navigator.share({title:'MOM 투표', text:txt, url:url}).catch(function(){}); return; }
  momCopy_(id);
}
function momCopy_(id){
  var url=voteUrl_(id);
  try{
    if(navigator.clipboard) navigator.clipboard.writeText(url);
    else { var t=document.createElement('textarea'); t.value=url; document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t); }
    toast('링크를 복사했어요');
  }catch(e){ toast('복사에 실패했어요'); }
}

/* ── 관리자: 투표 목록 / 현황 / 마감 ── */
function openVoteList_(){
  if(!requireAdmin()) return;
  if(!window.db || !FS.enabled){ toast('네트워크 연결을 확인해주세요'); return; }
  toast('투표 목록 조회 중...');

      var n=Object.keys(v.votes||{}).length;

                     :('<span class="vt-st live">진행 중 · '+n+'표</span>');

    }).join('') || '<div class="empty" style="padding:24px;">만든 투표가 없습니다.<br>스쿼드 탭에서 MOM 투표를 만들어보세요.</div>';
    showSheet('<div class="grabber"></div>'
     + '<div class="sheet-head"><h3>🗳️ MOM 투표</h3><button class="x" onclick="closeSheet()">✕</button></div>'

  }).catch(function(e){ if(window.console)console.warn(e); toast('투표 목록을 불러오지 못했습니다'); });
}
function voteName_(pid){
  var d=state._voteDoc;
  if(d){ var c=(d.cands||[]).filter(function(x){ return x.pid===pid; })[0]; if(c) return c.name; }
  return pname_(pid).name;
}
function openVoteAdmin_(id){
  if(!requireAdmin()) return;
  toast('불러오는 중...');
  voteRef_(id).get().then(function(sn){
    if(!sn.exists){ toast('투표를 찾을 수 없습니다'); return; }
    state._voteDoc=sn.data();
    renderVoteAdmin_();
  }).catch(function(){ toast('투표를 불러오지 못했습니다'); });
}
function voteTally_(v){
  var cnt={}; var votes=v.votes||{};
  Object.keys(votes).forEach(function(k){ var p=votes[k]; if(p) cnt[p]=(cnt[p]||0)+1; });
  var arr=(v.cands||[]).map(function(c){ return {pid:c.pid, name:c.name, num:c.num, n:cnt[c.pid]||0}; });
  arr.sort(function(a,b){ return b.n-a.n; });
  var mx=arr.length?arr[0].n:0;
  return {rows:arr, max:mx, winners:(mx>0?arr.filter(function(r){ return r.n===mx; }).map(function(r){ return r.pid; }):[]), total:Object.keys(votes).length};
}
function renderVoteAdmin_(){
  var v=state._voteDoc; if(!v) return;
  var t=voteTally_(v);
  var rows=t.rows.map(function(r,i){
    var pct=t.total?Math.round(r.n/t.total*100):0;
    var win=(t.max>0 && r.n===t.max);
    return '<div class="vt-res'+(win?' win':'')+'"><span class="vt-num oswald">'+esc(r.num)+'</span>'
      + '<span class="vt-nm">'+esc(r.name)+(win?' 👑':'')+'</span>'
      + '<span class="vt-bar"><i style="width:'+pct+'%"></i></span>'
      + '<span class="vt-cnt oswald">'+r.n+'</span></div>';
  }).join('');
  var actions = v.closed
    ? '<p style="font-size:13px;color:var(--steel);margin:12px 2px 0;">마감된 투표입니다 · MOM '+esc((v.winners||[]).map(function(p){ return voteName_(p); }).join(' · ')||'없음')+'</p>'
      + '<button class="btn-ghost" style="margin-top:10px;" onclick="voteReopen_()">↩️ 확정 취소 (경기 기록의 MOM 삭제 · 투표 다시 열기)</button>'
    : '<button class="btn-primary" style="margin-top:14px;" onclick="voteClose_()">🏅 마감하고 MOM 기록</button>'
      + '<button class="btn-ghost" style="margin-top:8px;" onclick="momCopy_(\''+v.id+'\')">📋 링크 복사</button>'
      + '<button class="btn-ghost" style="margin-top:8px;" onclick="renderVoteAdmin_refresh_()">↻ 현황 새로고침</button>'
      + '<button class="btn-ghost" style="margin-top:8px;color:var(--red);" onclick="voteDelete_()">🗑️ 투표 취소 (삭제)</button>';
  showSheet('<div class="grabber"></div>'
   + '<div class="sheet-head"><h3>📊 '+esc(v.title||'MOM 투표')+'</h3><button class="x" onclick="closeSheet()">✕</button></div>'
   + '<div class="sheet-body">'
   +   '<p style="font-size:12.5px;color:var(--steel-soft);margin:0 0 10px;">총 '+t.total+'명 투표 · 후보 '+(v.cands||[]).length+'명'+(v.closed?' · 마감됨':'')+'</p>'
   +   '<div class="vt-reslist">'+rows+'</div>'
   +   actions
   +   (v.closed?'<button class="btn-ghost" style="margin-top:8px;" onclick="voteDelete_()">🗑️ 투표 삭제 (기록의 MOM은 유지)</button>':'')
   + '</div>');
}
function renderVoteAdmin_refresh_(){ var v=state._voteDoc; if(v) openVoteAdmin_(v.id); }
function voteClose_(){
  var v=state._voteDoc; if(!v || v.closed) return;
  var t=voteTally_(v);
  if(!t.winners.length){ toast('아직 투표가 없습니다'); return; }
  var names=t.rows.filter(function(r){ return t.winners.indexOf(r.pid)>-1; }).map(function(r){ return r.name; });
  appConfirm_('MOM · '+names.join(' · ')+'\n마감하면 경기 기록에 저장되고 수정할 수 없습니다.', function(){
    voteRef_(v.id).update({closed:true, winners:t.winners}).then(function(){
      v.closed=true; v.winners=t.winners;
      return API.run('setMatchMom', v.matchId, t.winners.join(','), names.join(','));
    }).then(function(list){
      if(list) state.matches=list;
      recCacheClear_();
      toast('🏅 MOM · '+names.join(' · '));
      renderVoteAdmin_();
      if(state.screen==='record'||state.screen==='squad') render();
    }).catch(function(e){ if(window.console)console.warn(e); toast('마감 처리에 실패했습니다'); });
  });
}
/* 마감(확정)을 되돌린다 — 경기 기록의 MOM을 지우고 투표를 다시 연다 */
function voteReopen_(){
  var v=state._voteDoc; if(!v || !v.closed) return;
  if(!requireAdmin()) return;
  appConfirm_('MOM 확정을 취소할까요?\n경기 기록의 MOM이 지워지고 투표가 다시 열립니다.\n(받은 표는 그대로 남아 다시 마감할 수 있어요)', function(){
    voteRef_(v.id).update({closed:false, winners:[]}).then(function(){
      v.closed=false; v.winners=[];
      return API.run('setMatchMom', v.matchId, '', '');
    }).then(function(list){
      if(list) state.matches=list;
      recCacheClear_();
      try{ logEvent_('vote','reopen','MOM 확정 취소 · '+(v.title||'')); }catch(e){}
      toast('확정을 취소했습니다 · 투표가 다시 열렸어요');
      renderVoteAdmin_();
      if(state.screen==='record') render();
    }).catch(function(e){ if(window.console)console.warn(e); toast('확정 취소에 실패했습니다'); });
  });
}
function voteDelete_(){
  var v=state._voteDoc; if(!v) return;
  voteDeleteId_(v.id);
}
function voteDeleteId_(id){
  if(!requireAdmin()) return;
  appConfirm_('투표를 삭제(취소)할까요?\n마감 전이면 투표 내용이 사라지고, 이미 기록된 MOM은 그대로 남습니다.', function(){
    voteRef_(id).delete().then(function(){
      toast('투표가 삭제되었습니다');
      try{ logEvent_('vote','delete','MOM 투표 삭제'); }catch(e){}
      openVoteList_();
    }).catch(function(){ toast('삭제 실패'); });
  });
}

/* ── 팀원: 투표 화면 (링크 접속 · 로그인 없이 1탭) ── */
function voteBoot_(){
  var id=voteHashId_();
  var el=document.getElementById('pinScreen');
  if(el){ el.classList.add('vote'); el.style.display='flex'; el.innerHTML='<div class="auth-inner"><div class="auth-title">MOM 투표</div><div class="auth-sub">불러오는 중...</div></div>'; voteSkin_(); }
  var tb=document.getElementById('tabbar'); if(tb) tb.style.display='none';
  var fb=document.getElementById('fab'); if(fb) fb.style.display='none';
  FS.ready.then(function(){
    if(!window.db){ voteFail_('네트워크에 연결할 수 없습니다.'); return; }
    return voteRef_(id).get().then(function(sn){
      if(!sn.exists){ voteFail_('투표를 찾을 수 없습니다.<br>링크가 만료되었을 수 있어요.'); return; }
      state._voteDoc=sn.data();
      renderVoteScreen_();
    });
  }).catch(function(){ voteFail_('투표를 불러오지 못했습니다.'); });
}
function voteFail_(msg){
  var el=document.getElementById('pinScreen'); if(!el) return;
  el.classList.add('vote');
  el.innerHTML='<div class="auth-inner"><img class="auth-logo vt-logo" src="'+APP_LOGO+'" alt=""><div class="auth-title">MOM 투표</div>'
    + '<div class="auth-sub">'+msg+'</div></div>';
  voteSkin_();
}
function renderVoteScreen_(){
  var v=state._voteDoc; if(!v) return;
  var el=document.getElementById('pinScreen'); if(!el) return;
  el.classList.add('vote');
  var my=(v.votes||{})[voteKey_()]||'';
  var t=voteTally_(v);
  var body;
  if(!v.closed && my && !state._voteEdit){
    /* 투표 완료 → 현재 결과를 보여주고 탭하면 창을 닫는다 */
    var myName=((v.cands||[]).filter(function(c){ return c.pid===my; })[0]||{}).name||'';
    body='<div class="vt-done">✅<br><b>'+esc(myName)+'</b><br><span>투표 완료</span></div>'
      + '<div class="vt-reslist dark">'+t.rows.map(function(r){
          var pct=t.total?Math.round(r.n/t.total*100):0;
          return '<div class="vt-res'+(r.pid===my?' win':'')+'"><span class="vt-num oswald">'+esc(r.num)+'</span><span class="vt-nm">'+esc(r.name)+'</span>'
            + '<span class="vt-bar"><i style="width:'+pct+'%"></i></span><span class="vt-cnt oswald">'+r.n+'</span></div>';
        }).join('')+'</div>'
      + '<p class="vt-hint">현재 '+t.total+'명 참여 · 최종 MOM은 관리자가 마감하면 확정돼요.</p>'
      + '<div class="vt-actions">'
      +   '<button class="auth-btn" onclick="voteFinish_()">완료 · 창 닫기</button>'
      +   '<button class="auth-btn ghost" onclick="voteEdit_()">선택 바꾸기</button>'
      + '</div>';
    el.innerHTML='<div class="auth-inner vt-wrap">'
      + '<img class="auth-logo vt-logo" src="'+APP_LOGO+'" alt="">'
      + '<div class="auth-title">MOM 투표</div>'
      + '<div class="auth-sub">'+esc(v.title||'')+'</div>'
      + body + '</div>';
    el.style.display='flex';
    voteSkin_();
    return;
  }
  if(v.closed){
    var wn=(v.winners||[]).map(function(p){ var c=(v.cands||[]).filter(function(x){return x.pid===p;})[0]; return c?c.name:''; }).filter(Boolean);
    body='<div class="vt-done">🏅<br><b>'+esc(wn.join(' · ')||'미정')+'</b><br><span>'+esc(v.title||'')+' MOM</span></div>'
      + '<div class="vt-reslist dark">'+t.rows.map(function(r){
          var pct=t.total?Math.round(r.n/t.total*100):0;
          return '<div class="vt-res'+((v.winners||[]).indexOf(r.pid)>-1?' win':'')+'"><span class="vt-num oswald">'+esc(r.num)+'</span><span class="vt-nm">'+esc(r.name)+'</span>'
            + '<span class="vt-bar"><i style="width:'+pct+'%"></i></span><span class="vt-cnt oswald">'+r.n+'</span></div>';
        }).join('')+'</div>';
  } else {
    body='<div class="vt-grid">'+(v.cands||[]).map(function(c){
      return '<button class="vt-card'+(my===c.pid?' on':'')+'" onclick="voteCast_(\''+c.pid+'\')">'
        + '<span class="vt-cnum oswald">'+esc(c.num)+'</span>'
        + '<span class="vt-cnm">'+esc(c.name)+'</span>'
        + (my===c.pid?'<span class="vt-chk">✓ 내 선택</span>':'')
        + '</button>';
    }).join('')+'</div>'
      + '<p class="vt-hint">'+(my?'다른 선수를 누르면 변경돼요.':'오늘 가장 잘한 선수를 한 번만 눌러주세요.')+'</p>';
  }
  el.innerHTML='<div class="auth-inner vt-wrap">'
    + '<img class="auth-logo vt-logo" src="'+APP_LOGO+'" alt="">'
    + '<div class="auth-title">MOM 투표</div>'
    + '<div class="auth-sub">'+esc(v.title||'')+'</div>'
    + body
    + '</div>';
  el.style.display='flex';
  voteSkin_();
}
function voteEdit_(){ state._voteEdit=true; renderVoteScreen_(); }
function voteFinish_(){
  var ua=String(navigator.userAgent||'');
  /* ① 인앱 브라우저 전용 종료 스킴 (카카오톡·네이버·라인) */
  try{
    if(/KAKAOTALK/i.test(ua)) location.href='kakaoweb://closeBrowser';
    else if(/NAVER\(inapp/i.test(ua)) location.href='navercorp://close';
    else if(/Line\//i.test(ua)) location.href='line://close';
  }catch(e){}
  /* ② 일반 브라우저: 스크립트로 연 창이면 바로 닫힌다 */
  try{ window.close(); }catch(e){}
  setTimeout(function(){ try{ window.open('','_self'); window.close(); }catch(e){} }, 150);
  /* ③ 창을 닫을 수 없는 브라우저(직접 접속 등)에서는 종료 안내 화면으로 마무리 */
  setTimeout(function(){
    if(document.hidden) return;
    var el=document.getElementById('pinScreen'); if(!el) return;
    el.innerHTML='<div class="auth-inner"><img class="auth-logo vt-logo" src="'+APP_LOGO+'" alt="">'
      + '<div class="auth-title">투표 완료</div>'
      + '<div class="auth-sub">참여해 주셔서 감사합니다</div>'
      + '<p class="vt-hint" style="margin-top:18px;">이 창은 닫으셔도 됩니다.</p></div>';
    voteSkin_();
  }, 700);
}
function voteCast_(pid){
  var v=state._voteDoc; if(!v || v.closed) return;
  var k=voteKey_();
  v.votes=v.votes||{}; v.votes[k]=pid;
  state._voteEdit=false;
  renderVoteScreen_();
  var up={}; up['votes.'+k]=pid;
  voteRef_(v.id).update(up).then(function(){ toast('투표되었습니다'); })
    .catch(function(){ toast('저장 실패 · 다시 눌러주세요'); });
}

function loadClubData_(){
  state.loading=true; render();
  Promise.all([API.run('getPlayers'), API.run('getMatches')]).then(function(r){
    state.players=r[0]||[]; state.matches=r[1]||[]; state.matchesLoaded=true; state.loading=false;
    render();
  }).catch(function(){ state.loading=false; render(); });
}
</script>
