/* 카카오맵 JavaScript 키 (클라이언트 공개용 · 도메인 화이트리스트로 보호) */
var KAKAO_JS_KEY = '2d591b6ef9c70f94f369b7c55c91baa3';
var venueMap=null, venueMarker=null, venuePick=null, venuePickUrl='', leafletTried=false, kakaoTried=false;
var kakaoMap=null, kakaoMarker=null, mapProvider=null;

function ensureKakao(cb){
  var done=false, fin=function(ok){ if(done) return; done=true; cb(ok); };
  if(!KAKAO_JS_KEY){ fin(false); return; }
  if(window.kakao && window.kakao.maps && window.kakao.maps.Map){ fin(true); return; }
  var start=function(){ try{ kakao.maps.load(function(){ fin(!!(window.kakao&&kakao.maps&&kakao.maps.Map)); }); }catch(e){ fin(false); } };
  if(window.kakao && window.kakao.maps){ start(); return; }
  if(kakaoTried){ setTimeout(function(){ fin(!!(window.kakao&&window.kakao.maps&&window.kakao.maps.Map)); }, 3000); return; }
  kakaoTried=true;
  var s=document.createElement('script');
  s.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey='+KAKAO_JS_KEY+'&libraries=services&autoload=false';
  s.onload=function(){ start(); };
  s.onerror=function(){ fin(false); };
  document.head.appendChild(s);
  setTimeout(function(){ fin(!!(window.kakao&&window.kakao.maps&&window.kakao.maps.Map)); }, 5000);
}
function ensureLeaflet(cb){
  var done=false; var fin=function(ok){ if(done) return; done=true; cb(ok); };
  if(typeof L !== 'undefined'){ fin(true); return; }
  var waited=0;
  var poll=setInterval(function(){
    if(typeof L !== 'undefined'){ clearInterval(poll); fin(true); return; }
    waited+=150;
    if(waited>=1500){ clearInterval(poll); tryFallbackCdn(); }
  }, 150);
  function tryFallbackCdn(){
    if(leafletTried){ setTimeout(function(){ fin(typeof L!=='undefined'); }, 2500); return; }
    leafletTried=true;
    var css=document.createElement('link'); css.rel='stylesheet';
    css.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'; document.head.appendChild(css);
    var s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
    s.onload=function(){ fin(typeof L!=='undefined'); };
    s.onerror=function(){ fin(false); };
    document.head.appendChild(s);
    setTimeout(function(){ fin(typeof L!=='undefined'); }, 5000);
  }
}
function initVenueMap(){
  var el = document.getElementById('g_map');
  if(!el) return;
  mapProvider=null; kakaoMap=null; kakaoMarker=null;
  el.innerHTML = '<div class="map-fallback">지도 불러오는 중...</div>';
  ensureKakao(function(okK){
    var box = document.getElementById('g_map'); if(!box) return;
    if(okK){ box.innerHTML=''; buildKakaoMap(box); return; }
    // 카카오 실패 → OSM 폴백
    ensureLeaflet(function(okL){
      var b2 = document.getElementById('g_map'); if(!b2) return;
      if(okL){ b2.innerHTML=''; buildVenueMap(b2); }
      else {
        b2.innerHTML = '<div class="map-fallback">지도를 불러오지 못했습니다.<br>아래 “지도 링크 직접 입력”을 이용하세요.<br><span style="font-size:10px;color:#9aa;opacity:.8;">현재 도메인: '+esc(location.hostname)+'</span></div>';
      }
    });
  });
}

/* ---- 카카오맵 ---- */
function buildKakaoMap(el){
  mapProvider='kakao';
  var start = venuePick || {lat:37.5665, lng:126.9780};
  kakaoMap = new kakao.maps.Map(el, {center:new kakao.maps.LatLng(start.lat, start.lng), level: venuePick?3:7});
  kakaoMarker = new kakao.maps.Marker({position:new kakao.maps.LatLng(start.lat, start.lng), draggable:true});
  if(venuePick) kakaoMarker.setMap(kakaoMap);
  kakao.maps.event.addListener(kakaoMap, 'click', function(e){ var ll=e.latLng; setKakaoMarker(ll.getLat(), ll.getLng(), true); });
  kakao.maps.event.addListener(kakaoMarker, 'dragend', function(){ var p=kakaoMarker.getPosition(); venuePick={lat:p.getLat(), lng:p.getLng()}; setVenueStatus(); reverseGeocode_(p.getLat(), p.getLng()); });
  [120,350,650].forEach(function(ms){ setTimeout(function(){ if(kakaoMap) kakaoMap.relayout(); }, ms); });
}
function setKakaoMarker(lat, lng, fillName){
  venuePick={lat:lat, lng:lng};
  var pos=new kakao.maps.LatLng(lat, lng);
  kakaoMarker.setPosition(pos); kakaoMarker.setMap(kakaoMap);
  setVenueStatus(); if(fillName) reverseGeocode_(lat, lng);
}
function reverseGeocode_(lat, lng){
  if(mapProvider!=='kakao' || !window.kakao || !kakao.maps.services) return;
  try{
    new kakao.maps.services.Geocoder().coord2Address(lng, lat, function(res, status){
      if(status===kakao.maps.services.Status.OK && res[0]){
        var nm=(res[0].road_address && res[0].road_address.building_name) || '';
        var v=document.getElementById('g_venue'); if(v && !v.value.trim() && nm) v.value=nm;
      }
    });
  }catch(e){}
}
function kakaoSearch_(q, box){
  try{
    new kakao.maps.services.Places().keywordSearch(q, function(data, status){
      if(!box) return;
      if(status!==kakao.maps.services.Status.OK || !data.length){ box.innerHTML='<div class="map-loading">검색 결과가 없습니다.</div>'; return; }
      window._venueHits={};
      box.innerHTML = data.slice(0,8).map(function(it,i){
        window._venueHits[i]={lat:Number(it.y), lng:Number(it.x), name:it.place_name};
        return '<div class="map-result" onclick="pickResultIdx('+i+')"><div class="mr-name">'+esc(it.place_name)+'</div><div class="mr-full">'+esc(it.road_address_name||it.address_name||'')+'</div></div>';
      }).join('');
    });
  }catch(e){ if(box) box.innerHTML='<div class="map-loading">검색에 실패했습니다.</div>'; }
}

/* ---- OSM (폴백) ---- */
function buildVenueMap(el){
  mapProvider='osm';
  if(venueMap){ try{ venueMap.remove(); }catch(e){} venueMap=null; venueMarker=null; }
  var start = venuePick || {lat:37.5665, lng:126.9780};
  venueMap = L.map(el, {zoomControl:true, attributionControl:false}).setView([start.lat, start.lng], venuePick?15:11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, crossOrigin:true}).addTo(venueMap);
  if(venuePick) placeMarker(venuePick.lat, venuePick.lng);
  venueMap.on('click', function(e){ placeMarker(e.latlng.lat, e.latlng.lng); setVenueStatus(); });
  [80,300,600].forEach(function(ms){ setTimeout(function(){ if(venueMap) venueMap.invalidateSize(); }, ms); });
}
function placeMarker(lat, lng){
  venuePick = {lat:lat, lng:lng};
  if(!venueMap) return;
  if(venueMarker){ venueMarker.setLatLng([lat,lng]); }
  else {
    venueMarker = L.marker([lat,lng], {draggable:true}).addTo(venueMap);
    venueMarker.on('dragend', function(){ var p=venueMarker.getLatLng(); venuePick={lat:p.lat,lng:p.lng}; setVenueStatus(); });
  }
}
function osmSearch_(q, box){
  var url = 'https://nominatim.openstreetmap.org/search?format=json&limit=6&accept-language=ko&countrycodes=kr&q='+encodeURIComponent(q);
  fetch(url, {headers:{'Accept':'application/json'}}).then(function(r){return r.json();}).then(function(list){
    if(!box) return;
    if(!list || !list.length){ box.innerHTML = '<div class="map-loading">검색 결과가 없습니다.</div>'; return; }
    window._venueHits={};
    box.innerHTML = list.map(function(it,i){
      window._venueHits[i]={lat:Number(it.lat),lng:Number(it.lon),name:(it.display_name||'').split(',').slice(0,3).join(', ')};
      var short = (it.display_name||'').split(',').slice(0,3).join(', ');
      return '<div class="map-result" onclick="pickResultIdx('+i+')"><div class="mr-name">'+esc(short)+'</div><div class="mr-full">'+esc(it.display_name||'')+'</div></div>';
    }).join('');
  }).catch(function(){ if(box) box.innerHTML = '<div class="map-loading">검색에 실패했습니다. 네트워크 확인 후 다시 시도하세요.</div>'; });
}

/* ---- 공통 ---- */
function setVenueStatus(){
  var s = document.getElementById('g_map_status');
  if(s && venuePick) s.innerHTML = '📍 위치 지정됨 ('+venuePick.lat.toFixed(5)+', '+venuePick.lng.toFixed(5)+') · 마커를 끌어 조정';
}
function searchVenue(){
  var q = (document.getElementById('g_map_q')||{}).value;
  if(!q || !q.trim()){ toast('검색어를 입력하세요'); return; }
  var box = document.getElementById('g_map_results');
  if(box) box.innerHTML = '<div class="map-loading">검색 중...</div>';
  if(mapProvider==='kakao' && window.kakao && kakao.maps.services){ kakaoSearch_(q.trim(), box); return; }
  osmSearch_(q.trim(), box);
}
function pickResultIdx(i){
  var h=(window._venueHits||{})[i]; if(!h) return;
  pickResult(h.lat, h.lng, h.name);
}
/* 기존 상대팀 목록 (중복 제거·정렬) — 같은 팀 이름 통일용 datalist */
function matchOpponents_(){
  var s={}; (state.matches||[]).forEach(function(m){ var o=(m.opponent||'').trim(); if(o) s[o]=1; });
  return Object.keys(s).sort();
}
/* 과거 경기장 목록 (이름별, 좌표 있는 기록 우선) — 선택 시 지도 위치까지 불러오기 */
function pastVenues_(){
  var map={}; (state.matches||[]).forEach(function(m){
    var v=(m.venue||'').trim(); if(!v) return;
    var hasXY=(m.lat!=null&&m.lat!==''&&m.lng!=null&&m.lng!=='');
    var cur=map[v];
    var curHasXY = cur && cur.lat!=='' && cur.lat!=null;
    if(!cur || (hasXY && !curHasXY)) map[v]={venue:v, lat:(hasXY?Number(m.lat):''), lng:(hasXY?Number(m.lng):''), venueUrl:m.venueUrl||''};
  });
  return Object.keys(map).sort().map(function(k){ return map[k]; });
}
/* 경기장 이름이 과거 경기장과 일치하면 지도 좌표·링크까지 불러오기 (새 이름이면 무시) */
function loadPastVenue_(name){
  name=(name||'').trim(); if(!name) return;
  var list=pastVenues_(), pv=null;
  for(var i=0;i<list.length;i++){ if(list[i].venue===name){ pv=list[i]; break; } }
  if(!pv) return;
  if(pv.lat!==''&&pv.lat!=null&&pv.lng!==''&&pv.lng!=null){
    var lat=Number(pv.lat), lng=Number(pv.lng);
    venuePick={lat:lat, lng:lng}; venuePickUrl=pv.venueUrl||'';
    if(mapProvider==='kakao' && kakaoMap){ kakaoMap.setCenter(new kakao.maps.LatLng(lat,lng)); kakaoMap.setLevel(3); setKakaoMarker(lat,lng,false); }
    else if(venueMap){ venueMap.setView([lat,lng],16); placeMarker(lat,lng); }
    setVenueStatus();
    toast('과거 경기장 위치를 불러왔어요');
  } else if(pv.venueUrl){ venuePickUrl=pv.venueUrl; }
}
function pickResult(lat, lng, name){
  lat=Number(lat); lng=Number(lng);
  venuePick={lat:lat, lng:lng};
  if(mapProvider==='kakao' && kakaoMap){ kakaoMap.setCenter(new kakao.maps.LatLng(lat,lng)); kakaoMap.setLevel(3); setKakaoMarker(lat,lng,false); }
  else if(venueMap){ venueMap.setView([lat,lng], 16); placeMarker(lat,lng); }
  var v = document.getElementById('g_venue');
  if(v && !v.value.trim() && name) v.value = name;
  var box = document.getElementById('g_map_results'); if(box) box.innerHTML='';
  setVenueStatus();
}
function saveMatch(id){
  var date = document.getElementById('g_date').value;
  var opp = document.getElementById('g_opp').value.trim();
  if(!date || !opp){ toast('날짜와 상대팀은 필수입니다'); return; }
  var prev = id ? (state.matches.filter(function(x){return x.id===id;})[0]||{}) : {};
  var lat = venuePick ? venuePick.lat : (prev.lat!=null?prev.lat:'');
  var lng = venuePick ? venuePick.lng : (prev.lng!=null?prev.lng:'');
  var url = venuePick ? ('https://www.google.com/maps?q='+venuePick.lat+','+venuePick.lng) : (venuePickUrl || prev.venueUrl || '');
  var data = {
    date: date,
    time: document.getElementById('g_time').value,
    opponent: opp,
    venue: document.getElementById('g_venue').value.trim(),
    lat: lat, lng: lng,
    venueUrl: url,
    recMatch: !!(document.getElementById('g_recMatch')||{checked:true}).checked,
    recAtt: !!(document.getElementById('g_recAtt')||{checked:true}).checked,
    recGoal: !!(document.getElementById('g_recGoal')||{checked:true}).checked,
    recAssist: !!(document.getElementById('g_recAssist')||{checked:true}).checked
  };
  if(!data.recMatch){ data.ourScore=''; data.oppScore=''; data.result=''; }
  var fn = id ? 'updateMatch' : 'addMatch';
  if(id) data.id = id;
  closeSheet();
  toast(id?'경기를 수정했습니다':'경기를 등록했습니다');
  // 경기 등록/수정은 스쿼드와 무관 — 경기 목록만 갱신 (스쿼드는 스쿼드 탭에서 별도 관리)
  API.run(fn, data).then(function(list){
    state.matches = list;
    state.matchShow = REC_PAGE;   // 목록 상단(최신)부터 다시 표시
    if(state.screen==='squad'||state.screen==='att') render();
  }).catch(function(){ toast('저장 실패 · 새로고침'); });
}
function deleteMatchConfirm(id){
  if(!requireAdmin()) return;
  if(!requireAdmin()) return;
  var m=(state.matches||[]).filter(function(x){return x.id===id;})[0];
  confirmDelete_('이 경기를 삭제할까요?'+(m&&m.opponent?' (vs '+esc(m.opponent)+')':'')+'<br><span style="font-size:12px;color:var(--steel-soft);">관련 스쿼드·기록도 함께 삭제됩니다.</span>', function(){ doDeleteMatch(id); });
}
function doDeleteMatch(id){
  state.matches = state.matches.filter(function(m){return m.id!==id;});
  closeSheet(); toast('경기를 삭제했습니다'); render();
  API.run('deleteMatch', id).then(function(list){ state.matches = list; if(state.screen==='squad'||state.screen==='att') render(); }).catch(function(){ toast('삭제 저장 실패 · 새로고침'); });
}
/* 빈 경기 = 상대팀·결과·점수가 모두 없는 경기 (잘못 자동 생성된 경기) */
function isEmptyMatch_(m){
  var noOpp = !m.opponent || String(m.opponent).trim()==='';
  var noScore = (m.ourScore==null || m.ourScore==='') && (m.oppScore==null || m.oppScore==='');
  var noResult = !(m.result==='W'||m.result==='D'||m.result==='L');
  return noOpp && noScore && noResult;
}
function emptyMatchCount_(){ return (state.matches||[]).filter(isEmptyMatch_).length; }
function cleanupEmptyMatches_(){
  if(!requireAdmin()) return;
  var empties=(state.matches||[]).filter(isEmptyMatch_);
  if(!empties.length){ toast('정리할 빈 경기가 없어요'); return; }
  appConfirm_('상대팀·결과가 없는 빈 경기 '+empties.length+'건을 삭제할까요?\n(잘못 생성된 경기 정리용 · 관련 기록도 함께 정리)', function(){
    var ids=empties.map(function(m){return m.id;});
    state.matches=(state.matches||[]).filter(function(m){return ids.indexOf(m.id)<0;});   // 낙관적 즉시 제거
    var chain=Promise.resolve();

      state.recLoaded=false; state.matchesLoaded=true;

function openResultForm(matchId){

    if(fAssist) inputs += '<span style="font-size:11px;color:var(--steel);">도움</span>'
      + '<input id="st_a_'+p.id+'" type="number" inputmode="numeric" min="0" value="'+(st.a||0)+'" style="width:40px;padding:7px 3px;border:1.5px solid var(--line-strong);border-radius:9px;text-align:center;font-family:inherit;font-size:14px;">';
    var attSegs = fAtt
      ? '<div class="att-seg" style="margin-top:6px;">'
        + attSeg(p.id,'present','참석',cur) + attSeg(p.id,'late','지각',cur) + attSeg(p.id,'absent','불참',cur) + attSeg(p.id,'excused','미참석',cur)
        + '</div>'
      : '';
    return '<div class="res-row" data-pid="'+p.id+'">'

      +   '<span class="oswald" style="font-weight:700;font-size:16px;width:26px;text-align:center;">'+numLabel(p.num)+'</span>'
      +   '<span style="flex:1;font-weight:600;font-size:14px;">'+esc(p.name)+'</span>'
      +   inputs
      + '</div>'

  }).join('');
  if(inactiveN>0) statRows += '<p style="font-size:11.5px;color:var(--steel-soft);margin:8px 2px 0;">부상·휴식 등 상태가 설정된 '+inactiveN+'명은 입력에서 제외됩니다. (기존 기록은 유지)</p>';
  var offNames=[]; if(!fMatch) offNames.push('경기'); if(!fAtt) offNames.push('출석'); if(!fGoal) offNames.push('득점'); if(!fAssist) offNames.push('어시');
  var offNote = offNames.length ? '<p style="font-size:11.5px;color:var(--steel-soft);margin:0 0 10px;">이 경기는 <b>'+offNames.join('·')+'</b> 기록을 사용하지 않아요. (경기 등록에서 변경 가능)</p>' : '';
  var rowLabels=[]; if(fGoal) rowLabels.push('득점'); if(fAssist) rowLabels.push('도움'); if(fAtt) rowLabels.push('출석');

  var html = '<div class="grabber"></div>'

   +       '<span style="color:var(--steel-soft);font-weight:700;">:</span>'
   +       '<input id="r_opp" type="number" inputmode="numeric" min="0" value="'+(m.oppScore!==undefined&&m.oppScore!==''?m.oppScore:0)+'" style="width:60px;padding:12px;border:1.5px solid var(--line-strong);border-radius:12px;text-align:center;font-family:Oswald;font-weight:700;font-size:22px;">'

   + '</div>';
  showSheet(html);
}
function attSeg(pid, val, label, cur){
  return '<button class="att-opt '+(cur===val?('on '+val):'')+'" data-pid="'+pid+'" data-val="'+val+'" onclick="pickAtt(\''+pid+'\',\''+val+'\')">'+label+'</button>';
}
function pickAtt(pid, val){
  state.formAtt[pid] = val;
  var row = document.querySelector('.res-row[data-pid="'+pid+'"] .att-seg');
  if(!row) return;
  Array.prototype.forEach.call(row.querySelectorAll('.att-opt'), function(b){
    var on = b.getAttribute('data-val')===val;
    b.className = 'att-opt' + (on ? (' on '+val) : '');
  });
}
function applyRecBundle_(b){
  if(!b) return;
  state.recMatches=b.matches||state.recMatches;
  state.recStats=b.stats||state.recStats;
  state.recAtt=b.attendance||state.recAtt;
}
function saveResult(matchId){
  state._careerMap=null;
  var m = state.recMatches.filter(function(x){return x.id===matchId;})[0] || {};
  var fMatch=recOn_(m,'recMatch'), fAtt=recOn_(m,'recAtt'), fGoal=recOn_(m,'recGoal'), fAssist=recOn_(m,'recAssist');
  var our = parseInt((document.getElementById('r_our')||{}).value)||0;
  var opp = parseInt((document.getElementById('r_opp')||{}).value)||0;
  var stats = [];
  var att = [];
  state.players.forEach(function(p){
    if(!isActiveP_(p)){
      // 비활동 선수: 화면에 없으므로 기존 기록만 그대로 보존
      var exSt=(state.recStats||[]).filter(function(x){return x.matchId===matchId && x.playerId===p.id;})[0];
      if(exSt && ((exSt.goals||0)>0 || (exSt.assists||0)>0)) stats.push({playerId:p.id, goals:exSt.goals||0, assists:exSt.assists||0});
      if(state.formAtt[p.id]) att.push({playerId:p.id, status:state.formAtt[p.id]});
      return;
    }
    var g = fGoal ? (parseInt((document.getElementById('st_g_'+p.id)||{}).value)||0) : 0;
    var a = fAssist ? (parseInt((document.getElementById('st_a_'+p.id)||{}).value)||0) : 0;
    if(g>0||a>0) stats.push({playerId:p.id, goals:g, assists:a});
    att.push({playerId:p.id, status:(state.formAtt[p.id]||state._attDefault||'present')});
  });
  var btn=document.querySelector('#sheetWrap .btn-primary'); if(btn){btn.textContent='저장 중...';btn.disabled=true;}
  var chain = Promise.resolve();
  if(fMatch) chain = chain.then(function(){ return API.run('recordMatchResult', matchId, our, opp).then(applyRecBundle_); });
  if(fGoal||fAssist) chain = chain.then(function(){ return API.run('setMatchStats', matchId, stats).then(applyRecBundle_); });
  if(fAtt) chain = chain.then(function(){ return API.run('setMatchAttendance', matchId, att).then(applyRecBundle_); });
  chain.then(function(){
    closeSheet(); render(); toast('경기 결과를 저장했습니다');
  }).catch(function(){ if(btn){btn.textContent='다시 시도';btn.disabled=false;} toast('저장에 실패했습니다'); });
}

function showSheet(html){
  // 시트 열기 전 본문 스크롤 위치 저장 (모바일 오버레이 후 목록이 맨 위로 튀는 것 방지)

/* 팀원 로그인·계정·권한 시스템 제거 — 이 페이지는 관리자 전용. */
function authId(){ return ''; }
/* 접속 모드
 *  owner  = 총관리자 (PIN 관리 포함 모든 권한)
 *  admin  = 팀 관리자 (데이터 입력·수정·삭제, PIN 관리는 불가)
 *  viewer = 팀원 (조회 전용) */
var ROLE_KEY='kt_role';
function roleGet_(){ try{ return localStorage.getItem(ROLE_KEY)||''; }catch(e){ return ''; } }
function roleSet_(r){ try{ localStorage.setItem(ROLE_KEY, r); }catch(e){} state.role=r; }
function roleNow_(){ return state.role||roleGet_(); }
function isAdmin(){ var r=roleNow_(); return r==='owner'||r==='admin'||r===''; }
function isOwner(){ return roleNow_()==='owner'; }
function requireOwner(){
  if(isOwner()) return true;
  toast('총관리자만 사용할 수 있습니다');
  return false;
}
/* 입력한 PIN 해시 → 권한 (총관리자 PIN 미설정 상태면 기존 PIN 사용자가 총관리자) */
function pinRoleFor_(h){
  var c=state.cfg||{};
  if(c.ownerPinHash && h===c.ownerPinHash) return 'owner';
  if(c.adminPinHash && h===c.adminPinHash) return c.ownerPinHash ? 'admin' : 'owner';
  return '';
}
function pinAnySet_(){ var c=state.cfg||{}; return !!(c.ownerPinHash||c.adminPinHash); }
function requireAdmin(){
  if(isAdmin()) return true;
  toast('조회 전용 모드예요 · 수정은 관리자만 가능합니다');
  return false;
}

function requireLogin_(){ return true; }
function isGuest(){ return false; }
function canDelNote_(){ return true; }

var _cfmCb=null;
function appConfirm_(msg, onOk){
  var w=document.getElementById('cfmWrap'), m=document.getElementById('cfmMsg');
  if(!w||!m){ if(confirm(msg)) onOk&&onOk(); return; }

/* ================= 접근 PIN =================
 * 로그인 대신 PIN 하나로만 보호한다.
 * - 최초 실행(설정된 PIN 없음): PIN 설정 → 해시를 Firestore config에 저장
 * - 이후: PIN 입력(기기당 한 번) → localStorage에 통과 기록
 */
var PIN_KEY = 'kt_pin_ok';
function pinPass_(){ try{ return localStorage.getItem(PIN_KEY)||''; }catch(e){ return ''; } }
function pinRemember_(h){ try{ localStorage.setItem(PIN_KEY, h); }catch(e){} }
function pinGate_(done){
  state.role = roleGet_();
  if(state.role==='viewer'){ pinHide_(); done(); return; }
  /* 설정(config)을 읽지 못한 상태에서는 절대 'PIN 설정' 화면을 띄우지 않는다.
     (한도 초과·네트워크 오류 때 아무나 새 PIN을 등록해 버리는 사고 방지) */
  if(!pinAnySet_() && !FS.cfgOk && FS.enabled){ renderPinErr_(done); return; }
  if(!pinAnySet_()){ renderPin_(true, done); return; }
  var r=pinRoleFor_(pinPass_());
  if(r){ state.role=r; roleSet_(r); done(); return; }
  renderPin_(false, done);
}

var CARD_INK='#111015', CARD_RED='#C8102E', CARD_GOLD='#C7A24B', CARD_PAPER='#F6F5F3', CARD_LINE='#EAE8E4', CARD_STEEL='#6B6E76';
var CARD_HDR=250;
var _imgCache={}, _imgKeys=[], IMG_CACHE_MAX=30, IMG_CACHE_MAXLEN=400000;
function loadImg_(src){
  if(!src) return Promise.resolve(null);
  var k=String(src);
  if(_imgCache[k]) return _imgCache[k];
  var p=new Promise(function(res){ var i=new Image(); i.onload=function(){ res(i); }; i.onerror=function(){ delete _imgCache[k]; res(null); }; i.src=k; });
  if(k.length<=IMG_CACHE_MAXLEN){        /* 원본 대용량 사진은 캐시하지 않음 (메모리 보호) */
    _imgCache[k]=p; _imgKeys.push(k);
    while(_imgKeys.length>IMG_CACHE_MAX){ var old=_imgKeys.shift(); if(old!==k) delete _imgCache[old]; }
  }
  return p;
}
function imgCacheDrop_(src){ try{ var k=String(src||''); if(k && _imgCache[k]) delete _imgCache[k]; }catch(e){} }
function rr_(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function circImg_(ctx,img,cx,cy,r){
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.clip();
  var iw=img.width||img.naturalWidth||1, ih=img.height||img.naturalHeight||1, side=Math.min(iw,ih);
  ctx.drawImage(img,(iw-side)/2,(ih-side)/2,side,side,cx-r,cy-r,r*2,r*2);   // 비율 유지 · 중앙 크롭
  ctx.restore();
}
function drawCover_(ctx,img,x,y,w,h){
  var ir=img.width/img.height, r=w/h, sw,sh,sx,sy;
  if(ir>r){ sh=img.height; sw=sh*r; sx=(img.width-sw)/2; sy=0; }
  else { sw=img.width; sh=sw/r; sx=0; sy=(img.height-sh)*0.35; }
  ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h);
}
function fontsReady_(cb){
  try{
    Promise.all([
      document.fonts.load('700 64px Oswald'), document.fonts.load('600 30px Oswald'),
      document.fonts.load('700 40px Pretendard'), document.fonts.load('500 28px Pretendard'),

function wrapText_(ctx, text, maxW){
  var out=[];
  String(text||'').split('\n').forEach(function(line){
    if(line===''){ out.push(''); return; }
    var cur='';
    for(var i=0;i<line.length;i++){
      var t=cur+line.charAt(i);
      if(ctx.measureText(t).width>maxW && cur){ out.push(cur); cur=line.charAt(i); }
      else cur=t;
    }
    out.push(cur);
  });
  return out;
}
function cardEllipsis_(ctx, text, maxW){
  text=String(text||'');
  if(ctx.measureText(text).width<=maxW) return text;
  while(text.length>1 && ctx.measureText(text+'…').width>maxW) text=text.slice(0,-1);
  return text+'…';
}
/* 공통: 헤더(팀 배경사진+엠블럼) / 워터마크 / 패널 / 섹션 타이틀 / 푸터 */

function cardWatermark_(ctx, W, H, emblem, alpha){

function panel_(ctx,x,y,w,h,r,fill){

/* ── 엠블럼 흰 배경 제거: 가장자리에서 연결된 흰색만 투명화 (내부 흰색은 보존) ── */
var _emblemCutC=null;
function emblemCut_(img){
  if(!img) return null;
  if(_emblemCutC && _emblemCutC._src===img.src) return _emblemCutC;
  try{
    var S=512, c=document.createElement('canvas'); c.width=c.height=S;
    var x=c.getContext('2d'); x.drawImage(img,0,0,S,S);
    var d=x.getImageData(0,0,S,S), px=d.data;
    var vis=new Uint8Array(S*S), stack=[];
    function isW(p){ return px[p*4+3]<10 || (px[p*4]>228 && px[p*4+1]>228 && px[p*4+2]>228); }
    for(var i=0;i<S;i++){
      [i, (S-1)*S+i, i*S, i*S+S-1].forEach(function(p){ if(!vis[p]&&isW(p)){ vis[p]=1; stack.push(p); } });
    }
    while(stack.length){
      var p=stack.pop(); px[p*4+3]=0;
      var xx=p%S, yy=(p/S)|0;
      if(xx>0){ var a=p-1; if(!vis[a]&&isW(a)){vis[a]=1;stack.push(a);} }
      if(xx<S-1){ var b=p+1; if(!vis[b]&&isW(b)){vis[b]=1;stack.push(b);} }
      if(yy>0){ var e=p-S; if(!vis[e]&&isW(e)){vis[e]=1;stack.push(e);} }
      if(yy<S-1){ var f=p+S; if(!vis[f]&&isW(f)){vis[f]=1;stack.push(f);} }
    }
    x.putImageData(d,0,0);
    c._src=img.src; _emblemCutC=c; return c;
  }catch(e){ return img; }
}
/* ── 별하늘 · 금별 (챔피언스리그 밤 분위기) ── */
function starField_(ctx,x,y,w,h,seed,n){
  seed=seed||13; function rnd(){ seed=(seed*9301+49297)%233280; return seed/233280; }
  for(var i=0;i<n;i++){
    var sx=x+rnd()*w, sy=y+rnd()*h, rr=0.6+rnd()*1.5, a=0.22+rnd()*0.6;
    ctx.fillStyle='rgba(255,255,255,'+a.toFixed(2)+')';
    ctx.beginPath(); ctx.arc(sx,sy,rr,0,Math.PI*2); ctx.fill();
    if(rnd()>0.86){
      ctx.strokeStyle='rgba(255,255,255,'+(a*0.75).toFixed(2)+')'; ctx.lineWidth=1;
      var L=rr*3.5+3;
      ctx.beginPath(); ctx.moveTo(sx-L,sy); ctx.lineTo(sx+L,sy); ctx.moveTo(sx,sy-L); ctx.lineTo(sx,sy+L); ctx.stroke();
    }
  }
}
function goldStar_(ctx,cx,cy,R,rot,fill){
  ctx.beginPath();
  for(var i=0;i<10;i++){
    var ang=(rot!=null?rot:-Math.PI/2)+i*Math.PI/5, rr=(i%2? R*0.45:R);
    var qx=cx+Math.cos(ang)*rr, qy=cy+Math.sin(ang)*rr;
    if(i) ctx.lineTo(qx,qy); else ctx.moveTo(qx,qy);
  }
  ctx.closePath(); ctx.fillStyle=fill||CARD_GOLD; ctx.fill();
}
/* ── 3D 카드 공통: 야간 경기장 베이스 + 유리/입체 패널 ── */
function darkBase_(ctx,W,H){
  var g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#131b31'); g.addColorStop(0.5,'#0e1421'); g.addColorStop(1,'#0b100e');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  starField_(ctx,0,0,W,H*0.55,29,110);
  var fl=ctx.createRadialGradient(W/2,-H*0.08,40,W/2,-H*0.08,H*0.95);
  fl.addColorStop(0,'rgba(255,255,235,.15)'); fl.addColorStop(1,'rgba(255,255,235,0)');
  ctx.fillStyle=fl; ctx.fillRect(0,0,W,H);
}
function glass_(ctx,x,y,w,h,r,alpha){
  ctx.save(); ctx.shadowColor='rgba(0,0,0,.45)'; ctx.shadowBlur=20; ctx.shadowOffsetY=8;
  rr_(ctx,x,y,w,h,r); ctx.fillStyle='rgba(255,255,255,'+(alpha||0.07)+')'; ctx.fill(); ctx.restore();
  ctx.save(); rr_(ctx,x,y,w,h,r); ctx.clip();
  var gl=ctx.createLinearGradient(0,y,0,y+h*0.5); gl.addColorStop(0,'rgba(255,255,255,.09)'); gl.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=gl; ctx.fillRect(x,y,w,h*0.5); ctx.restore();
  rr_(ctx,x,y,w,h,r); ctx.strokeStyle='rgba(255,255,255,.16)'; ctx.lineWidth=2; ctx.stroke();
}
function tile3d_(ctx,x,y,w,h,r,color){
  ctx.save(); ctx.shadowColor='rgba(0,0,0,.5)'; ctx.shadowBlur=22; ctx.shadowOffsetY=10;
  var g=ctx.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,shade_(color,0.16)); g.addColorStop(0.5,color); g.addColorStop(1,shade_(color,-0.35));
  rr_(ctx,x,y,w,h,r); ctx.fillStyle=g; ctx.fill(); ctx.restore();
  ctx.save(); rr_(ctx,x,y,w,h,r); ctx.clip();
  var gl=ctx.createLinearGradient(0,y,0,y+h*0.45); gl.addColorStop(0,'rgba(255,255,255,.26)'); gl.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=gl; ctx.fillRect(x,y,w,h*0.45);
  ctx.fillStyle='rgba(0,0,0,.25)'; ctx.fillRect(x,y+h-5,w,5);
  ctx.restore();
  rr_(ctx,x,y,w,h,r); ctx.strokeStyle='rgba(255,255,255,.14)'; ctx.lineWidth=2; ctx.stroke();
}

/* ── 스쿼드 카드 ── */
var POS_COLORS={GK:'#E0A400',DF:'#2563C9',CB:'#2563C9',LB:'#2563C9',RB:'#2563C9',LWB:'#2563C9',RWB:'#2563C9',
  MF:'#1E9E6A',DM:'#1E9E6A',CM:'#1E9E6A',AM:'#1E9E6A',LM:'#1E9E6A',RM:'#1E9E6A',FW:'#C8102E',ST:'#C8102E',CF:'#C8102E',LW:'#C8102E',RW:'#C8102E'};
/* ── 3D 원근 경기장 (스쿼드 카드) ──
 * 평면 좌표 (u: 0~1 가로, v: 0=상대 골(먼 쪽) ~ 1=우리 골(가까운 쪽)) → 원근 투영
 * 지평선(yh) 기준으로 화면 y에 비례해 너비가 커지는 실제 원근 (같은 간격의 v가 멀수록 촘촘해짐) */
function shade_(hex, amt){   // amt>0 밝게, <0 어둡게 (-1~1)
  var m=/^#?([0-9a-f]{6})$/i.exec(hex||''); if(!m) return hex;
  var n=parseInt(m[1],16), r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  function f(c){ return Math.max(0,Math.min(255,Math.round(amt>0 ? c+(255-c)*amt : c*(1+amt)))); }
  return 'rgb('+f(r)+','+f(g)+','+f(b)+')';
}
function pitchProj_(x,y,w,h){
  var yTop=y+h*0.10, yBot=y+h*0.965, xc=x+w/2, Wn=w*0.985, ratio=0.66;   // 먼 쪽 너비 = 가까운 쪽의 66%
  var yh=(yTop-ratio*yBot)/(1-ratio);
  function Y(v){ return yh + 1/((1-v)/(yTop-yh) + v/(yBot-yh)); }
  function Wd(v){ return Wn*(Y(v)-yh)/(yBot-yh); }
  function P(u,v){ return {x:xc+(u-0.5)*Wd(v), y:Y(v)}; }
  function S(v){ return Wd(v)/Wn; }   // 깊이 스케일 (먼 쪽 0.56 ~ 가까운 쪽 1)
  return {P:P, Y:Y, Wd:Wd, S:S, yTop:yTop, yBot:yBot, xc:xc, Wn:Wn, yh:yh};
}
function drawPitch_(ctx,x,y,w,h){
  var PJ=pitchProj_(x,y,w,h), P=PJ.P;
  function poly(pts){ ctx.beginPath(); pts.forEach(function(p,i){ if(i) ctx.lineTo(p.x,p.y); else ctx.moveTo(p.x,p.y); }); ctx.closePath(); }
  function quad(u0,v0,u1,v1){ return [P(u0,v0),P(u1,v0),P(u1,v1),P(u0,v1)]; }
  function path(pts, close){ ctx.beginPath(); pts.forEach(function(p,i){ if(i) ctx.lineTo(p.x,p.y); else ctx.moveTo(p.x,p.y); }); if(close) ctx.closePath(); }
  // ── 배경 패널: 야간 경기장 분위기 ──
  ctx.save(); ctx.shadowColor='rgba(0,0,0,.35)'; ctx.shadowBlur=30; ctx.shadowOffsetY=12;
  rr_(ctx,x,y,w,h,26); ctx.fillStyle='#0b1210'; ctx.fill(); ctx.restore();
  rr_(ctx,x,y,w,h,26); ctx.save(); ctx.clip();
  var sky=ctx.createLinearGradient(0,y,0,PJ.yTop); sky.addColorStop(0,'#152045'); sky.addColorStop(0.6,'#0e1630'); sky.addColorStop(1,'#0a101f');
  ctx.fillStyle=sky; ctx.fillRect(x,y,w,PJ.yTop-y+2);
  starField_(ctx, x+6, y+4, w-12, Math.max(10,PJ.yTop-y-14), 41, 60);
  var flood=ctx.createRadialGradient(PJ.xc,y-h*0.25,10, PJ.xc,y-h*0.25,h*0.9);
  flood.addColorStop(0,'rgba(255,255,240,.28)'); flood.addColorStop(1,'rgba(255,255,240,0)');
  ctx.fillStyle=flood; ctx.fillRect(x,y,w,h);
  // 관중석 느낌: 먼 쪽 위 어두운 띠 + 작은 조명 점
  var st=ctx.createLinearGradient(0,PJ.yTop-h*0.09,0,PJ.yTop); st.addColorStop(0,'rgba(40,46,58,0)'); st.addColorStop(1,'rgba(40,46,58,.9)');
  ctx.fillStyle=st; ctx.fillRect(x,PJ.yTop-h*0.09,w,h*0.09);
  var seed=7; function rnd(){ seed=(seed*9301+49297)%233280; return seed/233280; }
  for(var i=0;i<90;i++){ var lx=x+rnd()*w, ly=PJ.yTop-h*0.075+rnd()*h*0.06; ctx.fillStyle='rgba(255,235,180,'+(0.15+rnd()*0.35)+')'; ctx.beginPath(); ctx.arc(lx,ly,1.2+rnd()*1.6,0,Math.PI*2); ctx.fill(); }
  // ── 잔디 (터치라인 바깥 여유 포함) ──
  var U0=-0.075, U1=1.075, V0=-0.055, V1=1.045;
  // 잔디 두께(앞면 단면)
  var e0=P(U0,V1), e1=P(U1,V1);
  ctx.fillStyle='#143d25'; ctx.beginPath(); ctx.moveTo(e0.x,e0.y); ctx.lineTo(e1.x,e1.y); ctx.lineTo(e1.x,e1.y+18); ctx.lineTo(e0.x,e0.y+18); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#0e2c1a'; ctx.fillRect(x, e0.y+18, w, h);
  // 잔디 바탕 + 줄무늬(가로 방향, 원근 적용)
  poly(quad(U0,V0,U1,V1)); ctx.fillStyle='#2f8a52'; ctx.fill();
  var stripes=12;
  for(var s=0;s<stripes;s++){
    var v0=V0+(V1-V0)*s/stripes, v1=V0+(V1-V0)*(s+1)/stripes;
    poly(quad(U0,v0,U1,v1)); ctx.fillStyle=(s%2?'#2c8350':'#34955a'); ctx.fill();
  }
  // 잔디 질감(노이즈) + 조명 (먼 쪽 어둡게, 중앙 밝게)
  poly(quad(U0,V0,U1,V1)); ctx.save(); ctx.clip();
  var nc=document.createElement('canvas'); nc.width=nc.height=160; var nx=nc.getContext('2d'); var idt=nx.createImageData(160,160);
  for(var k=0;k<idt.data.length;k+=4){ var g=Math.random()*255; idt.data[k]=g; idt.data[k+1]=g; idt.data[k+2]=g; idt.data[k+3]=26; }
  nx.putImageData(idt,0,0);
  ctx.fillStyle=ctx.createPattern(nc,'repeat'); ctx.fillRect(x,y,w,h);
  var lg=ctx.createLinearGradient(0,PJ.yTop,0,PJ.yBot); lg.addColorStop(0,'rgba(0,0,0,.42)'); lg.addColorStop(0.45,'rgba(0,0,0,.05)'); lg.addColorStop(1,'rgba(0,0,0,.18)');
  ctx.fillStyle=lg; ctx.fillRect(x,y,w,h);
  var hl=ctx.createRadialGradient(PJ.xc,PJ.Y(0.55),20, PJ.xc,PJ.Y(0.55),w*0.7); hl.addColorStop(0,'rgba(255,255,230,.14)'); hl.addColorStop(1,'rgba(255,255,230,0)');
  ctx.fillStyle=hl; ctx.fillRect(x,y,w,h);
  ctx.restore();
  // ── 라인 (깊이에 따라 굵기 변화) ──
  ctx.strokeStyle='rgba(255,255,255,.88)'; ctx.lineCap='round'; ctx.lineJoin='round';
  function lineV(u,va,vb){ var n=12; ctx.beginPath(); for(var i=0;i<=n;i++){ var v=va+(vb-va)*i/n, p=P(u,v); if(i) ctx.lineTo(p.x,p.y); else ctx.moveTo(p.x,p.y); } ctx.lineWidth=2.2+2.2*PJ.S((va+vb)/2); ctx.stroke(); }
  function lineU(v,ua,ub){ var a=P(ua,v), b=P(ub,v); ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.lineWidth=2.2+2.2*PJ.S(v); ctx.stroke(); }
  function box(u0,u1,v0,v1){ lineU(v0,u0,u1); lineU(v1,u0,u1); lineV(u0,v0,v1); lineV(u1,v0,v1); }
  function arc(uc,vc,ru,rv,a0,a1,vLimitFn){ ctx.beginPath(); var n=40, started=false; for(var i=0;i<=n;i++){ var a=a0+(a1-a0)*i/n, u=uc+ru*Math.cos(a), v=vc+rv*Math.sin(a); if(vLimitFn && !vLimitFn(v)){ started=false; continue; } var p=P(u,v); if(started) ctx.lineTo(p.x,p.y); else { ctx.moveTo(p.x,p.y); started=true; } } ctx.lineWidth=2.2+2.2*PJ.S(vc); ctx.stroke(); }
  box(0,1,0,1);                       // 터치라인
  lineU(0.5,0,1);                     // 하프라인
  arc(0.5,0.5,0.135,0.087,0,Math.PI*2);   // 센터 서클
  ctx.fillStyle='rgba(255,255,255,.9)'; var cs=P(0.5,0.5); ctx.beginPath(); ctx.ellipse(cs.x,cs.y,5,3,0,0,Math.PI*2); ctx.fill();
  box(0.205,0.795,0,0.157); box(0.365,0.635,0,0.052);          // 먼 쪽 페널티/골 에어리어
  box(0.205,0.795,0.843,1); box(0.365,0.635,0.948,1);          // 가까운 쪽
  arc(0.5,0.105,0.135,0.087,0,Math.PI*2,function(v){ return v>0.157; });   // 페널티 아크(먼 쪽)
  arc(0.5,0.895,0.135,0.087,0,Math.PI*2,function(v){ return v<0.843; });   // (가까운 쪽)
  var ps1=P(0.5,0.105), ps2=P(0.5,0.895);
  ctx.beginPath(); ctx.ellipse(ps1.x,ps1.y,4,2.4,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(ps2.x,ps2.y,5.5,3.2,0,0,Math.PI*2); ctx.fill();
  // ── 골대 (기둥 + 그물) ──
  function goal(v, dir){   // dir: -1 = 먼 쪽(그물이 위/뒤로), +1 = 가까운 쪽
    var l=P(0.446,v), r=P(0.554,v), gw=r.x-l.x, gh=gw*0.34, depth=gw*0.22*0.6;
    var bl={x:l.x+(dir<0?-depth*0.15:depth*0.15), y:l.y-depth*dir}, br={x:r.x+(dir<0?depth*0.15:-depth*0.15), y:r.y-depth*dir};
    // 그물 (뒤판 + 옆판)
    ctx.save(); ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1;
    var cols=9, rows=4;
    for(var i=0;i<=cols;i++){ var t=i/cols; ctx.beginPath(); ctx.moveTo(bl.x+(br.x-bl.x)*t, bl.y-gh); ctx.lineTo(bl.x+(br.x-bl.x)*t, bl.y); ctx.stroke(); }
    for(var j=0;j<=rows;j++){ var q=j/rows; ctx.beginPath(); ctx.moveTo(bl.x, bl.y-gh*q); ctx.lineTo(br.x, br.y-gh*q); ctx.stroke(); }
    // 옆 그물
    ctx.beginPath(); ctx.moveTo(l.x,l.y); ctx.lineTo(bl.x,bl.y); ctx.lineTo(bl.x,bl.y-gh); ctx.lineTo(l.x,l.y-gh); ctx.closePath(); ctx.fillStyle='rgba(255,255,255,.10)'; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r.x,r.y); ctx.lineTo(br.x,br.y); ctx.lineTo(br.x,br.y-gh); ctx.lineTo(r.x,r.y-gh); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(l.x,l.y-gh); ctx.lineTo(bl.x,bl.y-gh); ctx.lineTo(br.x,br.y-gh); ctx.lineTo(r.x,r.y-gh); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
    // 기둥·크로스바
    ctx.save(); ctx.strokeStyle='#ffffff'; ctx.lineCap='round'; ctx.lineWidth=3+3*PJ.S(v); ctx.shadowColor='rgba(0,0,0,.4)'; ctx.shadowBlur=6; ctx.shadowOffsetY=2;
    ctx.beginPath(); ctx.moveTo(l.x,l.y); ctx.lineTo(l.x,l.y-gh); ctx.lineTo(r.x,r.y-gh); ctx.lineTo(r.x,r.y); ctx.stroke();
    ctx.restore();
  }
  goal(0,-1); goal(1,1);
  ctx.restore();   // 패널 clip
  rr_(ctx,x,y,w,h,26); ctx.strokeStyle='rgba(255,255,255,.10)'; ctx.lineWidth=2; ctx.stroke();
  return PJ;
}
function drawToken_(ctx,PJ,m,img,badges,phase){
  var col = m.guest ? '#6B7280' : (POS_COLORS[m.position]||CARD_INK);
  var p=PJ.P(m.x,m.y), sc=0.84+0.16*PJ.S(m.y), r=63*sc, cx=p.x, cy=p.y-r*0.55;
  if(phase==='label') return drawTokenLabel_(ctx,m,img,badges,cx,cy,r,sc);
  // 바닥 그림자 (타원)
  ctx.save(); ctx.translate(cx, p.y+r*0.18); ctx.scale(1, 0.32);
  var sg=ctx.createRadialGradient(0,0,r*0.2, 0,0,r*1.35); sg.addColorStop(0,'rgba(0,0,0,.45)'); sg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(0,0,r*1.35,0,Math.PI*2); ctx.fill(); ctx.restore();
  // 구체(입체) 디스크
  ctx.save(); ctx.shadowColor='rgba(0,0,0,.35)'; ctx.shadowBlur=14; ctx.shadowOffsetY=6;
  var rg=ctx.createRadialGradient(cx-r*0.35, cy-r*0.4, r*0.1, cx, cy, r*1.15);
  rg.addColorStop(0, shade_(col,0.45)); rg.addColorStop(0.55, col); rg.addColorStop(1, shade_(col,-0.45));
  ctx.beginPath(); ctx.arc(cx,cy,img?r+6*sc:r,0,Math.PI*2); ctx.fillStyle=rg; ctx.fill(); ctx.restore();
  if(img){
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
    circImg_(ctx,img,cx,cy,r);
    // 유광 하이라이트
    ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.clip();
    var gl=ctx.createLinearGradient(0,cy-r,0,cy); gl.addColorStop(0,'rgba(255,255,255,.35)'); gl.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=gl; ctx.fillRect(cx-r,cy-r,r*2,r); ctx.restore();
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.lineWidth=3*sc; ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.stroke();
    // 포지션 배지
    ctx.font='600 '+Math.round(23*sc)+'px Oswald, sans-serif';
    var pt=String(m.position||''), ptw=ctx.measureText(pt).width+18*sc, bh=34*sc;
    ctx.save(); ctx.shadowColor='rgba(0,0,0,.3)'; ctx.shadowBlur=6; ctx.shadowOffsetY=2;
    rr_(ctx,cx+r-ptw+6*sc,cy-r-14*sc,ptw,bh,8*sc); ctx.fillStyle=col; ctx.fill(); ctx.restore();
    ctx.lineWidth=2.5*sc; ctx.strokeStyle='#fff'; ctx.stroke();
    ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(pt, cx+r-ptw/2+6*sc, cy-r+1);
  } else {
    ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.clip();
    var gl2=ctx.createLinearGradient(0,cy-r,0,cy); gl2.addColorStop(0,'rgba(255,255,255,.28)'); gl2.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=gl2; ctx.fillRect(cx-r,cy-r,r*2,r); ctx.restore();
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.lineWidth=4.5*sc; ctx.strokeStyle='rgba(255,255,255,.92)'; ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='600 '+Math.round(34*sc)+'px Oswald, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.save(); ctx.shadowColor='rgba(0,0,0,.35)'; ctx.shadowBlur=4; ctx.shadowOffsetY=1;
    ctx.fillText(String(m.position||''), cx, cy+1); ctx.restore();
  }
}
/* 이름표 + 달성 뱃지 (모든 디스크를 그린 뒤 위에 겹쳐 그려 가려지지 않게) */
function drawTokenLabel_(ctx,m,img,badges,cx,cy,r,sc){
  var label=(m.guest?m.num:numTok(m.num))+' '+String(m.name||'');
  ctx.font='700 '+Math.round(27*sc)+'px Pretendard, sans-serif';
  var tw=ctx.measureText(label).width, pw=tw+30*sc, ph=42*sc, py=cy+(img?r+6*sc:r)+7*sc;
  ctx.save(); ctx.shadowColor='rgba(0,0,0,.45)'; ctx.shadowBlur=12; ctx.shadowOffsetY=4;
  var pg=ctx.createLinearGradient(0,py,0,py+ph); pg.addColorStop(0,'rgba(38,35,46,.96)'); pg.addColorStop(1,'rgba(16,14,22,.96)');
  rr_(ctx,cx-pw/2,py,pw,ph,11*sc); ctx.fillStyle=pg; ctx.fill(); ctx.restore();
  rr_(ctx,cx-pw/2,py,pw,ph,11*sc); ctx.lineWidth=1.4; ctx.strokeStyle='rgba(255,255,255,.20)'; ctx.stroke();
  ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(label,cx,py+ph/2+1);
  // 달성 뱃지 (이름표 아래 · 한눈에 구별되도록 크게)
  if(badges && badges.length){
    var bi=46*sc, bgap=7*sc, bpad=9*sc, bh2=bi+bpad, bw2=badges.length*bi+(badges.length-1)*bgap+bpad*1.7;
    var by2=py+ph+5*sc, bx2=cx-bw2/2;
    ctx.save(); ctx.shadowColor='rgba(0,0,0,.45)'; ctx.shadowBlur=10; ctx.shadowOffsetY=4;
    rr_(ctx,bx2,by2,bw2,bh2,bh2/2); ctx.fillStyle='rgba(14,12,20,.92)'; ctx.fill(); ctx.restore();
    rr_(ctx,bx2,by2,bw2,bh2,bh2/2); ctx.lineWidth=1.4; ctx.strokeStyle='rgba(255,255,255,.24)'; ctx.stroke();
    badges.forEach(function(bd,bidx){
      drawIcon_(ctx, bd[0], bx2+bpad*0.85+bi/2+bidx*(bi+bgap), by2+bh2/2, bi, bd[1]);
    });
  }
}
/* 카드에 달성 뱃지를 넣을지 (기본 끔 · 켤 때만 통산 기록을 조회한다) */
function squadBadgeOn_(){ try{ return localStorage.getItem('kt_sqbd')==='1'; }catch(e){ return false; } }
function squadBadgeSet_(on){
  try{ localStorage.setItem('kt_sqbd', on?'1':'0'); }catch(e){}
  if(on) toast('카드에 달성 뱃지가 표시됩니다'); else toast('뱃지 없이 저장됩니다');
}
function shareSquadCard_(){
  var d=state.squadDetail;
  if(!d || !d.squad){ toast('스쿼드를 선택하세요'); return; }
  var withBadge=squadBadgeOn_();
  toast(withBadge?'카드 만드는 중... (뱃지 포함)':'카드 만드는 중...');
  var mems=(d.members||[]).filter(function(m){ return m.position; });
  var jobs=[loadImg_(teamEmblemSrc_()), loadImg_(teamBgSrc_())].concat(mems.map(function(m){ return loadImg_(m.photo||''); }));
  fontsReady_(function(){
    Promise.all([Promise.all(jobs), (withBadge?careerReady_():Promise.resolve(null)), iconsReady_()]).then(function(rr){ var imgs=rr[0];
      var emblem=imgs[0], bg=imgs[1];
      var W=1080, pad=50, pw=W-pad*2, ph=Math.round(pw*1.22);
      // 메모: 줄바꿈·자동 줄바꿈 반영해 높이 선계산 (내용 전체 표시 · 카드가 길어짐)
      var mctx=document.createElement('canvas').getContext('2d');
      mctx.font='500 27px Pretendard, sans-serif';
      var notes=(d.notes||[]).map(function(n){
        return {scope:String(n.scope||'전체'), lines:wrapText_(mctx, n.body, pw-220)};
      });
      var notesH=0;
      if(notes.length){
        notesH=86;
        notes.forEach(function(nd){ nd.h=46+nd.lines.length*38; notesH+=nd.h+18; });
      }
      var H = CARD_HDR + 48 + ph + 64 + notesH + 110;
      var c=document.createElement('canvas'); c.width=W; c.height=H;
      var ctx=c.getContext('2d');
      ctx.fillStyle=CARD_PAPER; ctx.fillRect(0,0,W,H);
      cardWatermark_(ctx, W, H, emblem);
      cardHeader_(ctx, W, ourTeamName_(), 'SQUAD · '+String(d.squad.name||'')+' · '+fmtDateDot(attToday_()), emblem, bg);
      var px=pad, py=CARD_HDR+48;
      var PJ=drawPitch_(ctx, px, py, pw, ph);
      // 먼 쪽(상대 골) 선수부터 그려 가까운 선수가 위에 겹치게
      var toks=mems.map(function(m,i){ return {m:m, img:imgs[i+2], bd:((!withBadge||m.guest)?null:earnedBadges_(m.playerId))}; })
        .sort(function(a,b){ return a.m.y-b.m.y; });
      toks.forEach(function(t){ drawToken_(ctx, PJ, t.m, t.img, t.bd, 'disc'); });
      toks.forEach(function(t){ drawToken_(ctx, PJ, t.m, t.img, t.bd, 'label'); });
      if(notes.length){
        var ny=py+ph+72;
        sectionTitle_(ctx, pad, ny, '요청사항 · 메모', 'NOTES');
        ny+=44;
        notes.forEach(function(nd){

/* ── 경기 캘린더 (경기등록 탭) ── */
function calYM_(){ if(!state.calYM){ var d=new Date(); state.calYM=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2); } return state.calYM; }
function calMove_(n){
  var p=calYM_().split('-'); var d=new Date(Number(p[0]), Number(p[1])-1+n, 1);
  state.calYM=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2); render();
}
function calToday_(){ state.calYM=attToday_().slice(0,7); render(); }
function setMatchView_(v){ state.matchView=v; render(); }
function viewCalendar_(){
  var ym=calYM_(), y=Number(ym.slice(0,4)), mo=Number(ym.slice(5,7));
  var first=new Date(y, mo-1, 1), days=new Date(y, mo, 0).getDate(), startDow=first.getDay();
  var today=attToday_();
  var byDate={}; (state.matches||[]).forEach(function(m){ if(m.date){ (byDate[m.date]=byDate[m.date]||[]).push(m); } });
  var head='<div class="cal-nav">'
    + '<button class="cal-btn" onclick="calMove_(-1)">‹</button>'
    + '<div class="cal-title oswald" onclick="calToday_()">'+y+'. '+('0'+mo).slice(-2)+'</div>'
    + '<button class="cal-btn" onclick="calMove_(1)">›</button></div>';
  var dows=['일','월','화','수','목','금','토'];
  var cells=dows.map(function(d,i){ return '<div class="cal-dow'+(i===0?' sun':(i===6?' sat':''))+'">'+d+'</div>'; }).join('');
  for(var i=0;i<startDow;i++) cells+='<div class="cal-cell empty"></div>';
  for(var dd=1; dd<=days; dd++){
    var ds=ym+'-'+('0'+dd).slice(-2), ms=byDate[ds]||[], dow=(startDow+dd-1)%7;
    var cls='cal-cell'+(ms.length?' has':'')+(ds===today?' today':'')+(dow===0?' sun':(dow===6?' sat':''));
    var mark='';
    if(ms.length){
      var m0=ms[0];
      var rc = hasResult_(m0) ? (m0.result==='W'?'w':(m0.result==='L'?'l':'d')) : (ds>=today?'up':'na');
      mark='<div class="cal-m '+rc+'">'+esc(String(m0.opponent||'경기').replace(/^FC\s*/i,''))+(ms.length>1?' +'+(ms.length-1):'')+'</div>';
    }
    cells+='<div class="'+cls+'" onclick="calTap_(\''+ds+'\')"><div class="cal-d">'+dd+'</div>'+mark+'</div>';
  }
  var cnt=(state.matches||[]).filter(function(m){ return m.date && m.date.indexOf(ym)===0; }).length;
  return head+'<div class="cal-grid">'+cells+'</div>'
    + '<p class="hint" style="margin-top:10px;">이 달 경기 '+cnt+'건 · 날짜를 탭하면 경기를 수정하거나 그 날짜로 새 경기를 등록해요.<br><span class="cal-lg w">승</span> <span class="cal-lg d">무</span> <span class="cal-lg l">패</span> <span class="cal-lg up">예정</span> <span class="cal-lg na">미기록</span></p>';
}
function calTap_(ds){
  var ms=(state.matches||[]).filter(function(m){ return m.date===ds; });
  if(!ms.length){ openMatchForm(null, ds); return; }
  if(ms.length===1){ openMatchForm(ms[0].id); return; }
  showSheet('<div class="grabber"></div>'
   + '<div class="sheet-head"><h3>'+fmtDateDot(ds)+' 경기</h3><button class="x" onclick="closeSheet()">✕</button></div>'
   + '<div class="sheet-body">'
   + ms.map(function(m){ return '<div class="player" style="margin-bottom:8px;" onclick="openMatchForm(\''+m.id+'\')"><div class="meta"><div class="pname">vs '+esc(m.opponent||'상대 미정')+'</div><div class="sub">'+(cleanTime(m.time)||'')+(m.venue?' · '+esc(m.venue):'')+'</div></div><div style="color:var(--steel-soft);font-size:20px;">›</div></div>'; }).join('')
   + '<button class="btn-ghost" onclick="openMatchForm(null,\''+ds+'\')">＋ 이 날짜에 경기 추가</button>'
   + '</div>');
}

/* ================= 백업 엑셀 복구 (내보내기 양식 그대로 업로드) =================
 * - 시트: 팀원 · 경기 · 득점·도움 · 출석 · 스쿼드 (헤더 이름으로 열을 찾으므로 열 순서는 자유)
 * - 병합 방식: 파일에 있는 항목을 현재 데이터에 '추가/수정'만 함 (파일에 없는 기존 데이터는 삭제하지 않음)
 * - 1차 dry-run으로 변경 건수를 보여주고 확인 후 실제 반영 → 바뀐 문서만 Firestore에 씀 (무료 사용량 절약)

function rpad2_(n){ return ('0'+n).slice(-2); }
function restoreDate_(v){
  if(v instanceof Date && !isNaN(v)) return v.getFullYear()+'-'+rpad2_(v.getMonth()+1)+'-'+rpad2_(v.getDate());
  if(typeof v==='number' && window.XLSX && XLSX.SSF){ var d=XLSX.SSF.parse_date_code(v); if(d) return d.y+'-'+rpad2_(d.m)+'-'+rpad2_(d.d); }
  var s=String(v==null?'':v).trim(); var m=s.match(/^(\d{4})[.\-\/년]\s*(\d{1,2})[.\-\/월]\s*(\d{1,2})/);
  if(m) return m[1]+'-'+rpad2_(m[2])+'-'+rpad2_(m[3]);
  return s;
}
function restoreTime_(v){
  if(v instanceof Date && !isNaN(v)) return rpad2_(v.getHours())+':'+rpad2_(v.getMinutes());
  if(typeof v==='number' && window.XLSX && XLSX.SSF){ var d=XLSX.SSF.parse_date_code(v); if(d) return rpad2_(d.H)+':'+rpad2_(d.M); }
  var s=String(v==null?'':v).trim(); var m=s.match(/^(\d{1,2}):(\d{2})/);
  if(m) return rpad2_(m[1])+':'+m[2];
  return s;
}
function restoreStr_(v){ return v==null ? '' : String(v).trim(); }
function restoreInt_(v){ var s=restoreStr_(v); if(s==='' || s==='미정') return ''; var n=parseInt(s,10); return isNaN(n)?'':n; }
function restoreYN_(v){ var s=restoreStr_(v).toUpperCase(); if(s==='') return true; return !(s==='N'||s==='NO'||s==='X'||s==='아니오'||s==='FALSE'||s==='0'); }
/* 시트 → 헤더 키 객체 배열 */
function restoreSheet_(wb, key){
  var nm=(wb.SheetNames||[]).filter(function(n){ return String(n).replace(/\s/g,'').indexOf(key)>-1; })[0];
  if(!nm) return null;
  var rows=XLSX.utils.sheet_to_json(wb.Sheets[nm], {header:1, raw:true, defval:''});
  var hdr=(rows[0]||[]).map(function(h){ return String(h==null?'':h).replace(/\s/g,''); });
  return rows.slice(1).filter(function(r){ return (r||[]).some(function(c){ return c!=='' && c!=null; }); }).map(function(r){
    var o={}; hdr.forEach(function(h,i){ if(h) o[h]=r[i]; }); return o;
  });
}
function rg_(o, keys){ for(var i=0;i<keys.length;i++){ if(o[keys[i]]!==undefined) return o[keys[i]]; } return ''; }
function restoreParseWb_(wb){

    return { num:restoreInt_(rg_(o,['등번호','번호'])), name:restoreStr_(rg_(o,['이름','선수'])),
      positions:restoreStr_(rg_(o,['포지션'])).split(/[\/,·\s]+/).filter(Boolean),
      birth:(function(v){ return v===''||v==null ? '' : restoreDate_(v); })(rg_(o,['생일','생년월일'])),
      height:restoreInt_(rg_(o,['키(cm)','키'])), weight:restoreInt_(rg_(o,['몸무게(kg)','몸무게'])),
      region:restoreStr_(rg_(o,['지역'])), size:restoreStr_(rg_(o,['유니폼','사이즈','유니폼사이즈'])).toUpperCase(),
      status:(STATUS_CODE[stL]!==undefined ? STATUS_CODE[stL] : '') };
  }); }
  var m=restoreSheet_(wb,'경기');
  if(m){ out.any=true; out.matches=m.map(function(o){
    return { date:restoreDate_(rg_(o,['날짜'])), time:restoreTime_(rg_(o,['시간'])), opponent:restoreStr_(rg_(o,['상대팀','상대'])),
      venue:restoreStr_(rg_(o,['경기장','장소'])), our:restoreInt_(rg_(o,['우리점수','우리'])), opp:restoreInt_(rg_(o,['상대점수'])),
      recMatch:restoreYN_(rg_(o,['경기기록'])), recAtt:restoreYN_(rg_(o,['출석기록'])), recGoal:restoreYN_(rg_(o,['득점기록'])), recAssist:restoreYN_(rg_(o,['어시기록','어시스트기록'])) };
  }); }

    return { date:restoreDate_(rg_(o,['날짜'])), opponent:restoreStr_(rg_(o,['상대팀','상대'])), player:restoreStr_(rg_(o,['선수','이름'])),
      goals:restoreInt_(rg_(o,['골','득점']))||0, assists:restoreInt_(rg_(o,['도움','어시','어시스트']))||0 };
  }); }
  var a=restoreSheet_(wb,'출석');
  if(a){ out.any=true; out.att=a.map(function(o){
    return { date:restoreDate_(rg_(o,['날짜'])), opponent:restoreStr_(rg_(o,['상대팀','상대'])), player:restoreStr_(rg_(o,['선수','이름'])), status:restoreStr_(rg_(o,['출석','상태'])) };
  }); }
  var q=restoreSheet_(wb,'스쿼드');
  if(q){ out.any=true; out.squad=q.map(function(o){
    return { squad:restoreStr_(rg_(o,['스쿼드','스쿼드명'])), num:restoreStr_(rg_(o,['등번호','번호'])), player:restoreStr_(rg_(o,['선수','이름'])),
      position:restoreStr_(rg_(o,['포지션'])), memo:restoreStr_(rg_(o,['메모'])) };
  }); }
  return out;
}
/* 메모리 DB에 병합 (dry=true면 건수만 계산) — mockHandler('restoreBackup')에서 호출 */
function restoreApply_(data, dry, AC){
  var sum={pAdd:0,pUpd:0,mAdd:0,mUpd:0,sAdd:0,sUpd:0,aAdd:0,aUpd:0,qAdd:0,qmAdd:0,qmUpd:0,nAdd:0,skip:[]};
  function inClub(x){ return !AC || x.clubId===AC; }
  var now=Date.now(), seq=0; function nid(pre){ return pre+now+'_'+(seq++); }
  var club=(DB.clubs||[]).filter(function(c){ return c.id===AC; })[0]||{};
  var ATT_CODE={'출석':'present','지각':'late','불참':'absent','미참석':'excused',present:'present',late:'late',absent:'absent',excused:'excused'};
  function nv(v){ return (v==null||v==='') ? '' : v; }
  function same(a,b){ return JSON.stringify(nv(a))===JSON.stringify(nv(b)); }
  // ── 팀원 ──
  var byName={};
  DB.players.filter(inClub).forEach(function(p){ (byName[p.name]=byName[p.name]||[]).push(p); });
  function findP(name, num){
    var arr=byName[name]||[]; if(!arr.length) return null;
    if(arr.length>1 && num!==''){ var e=arr.filter(function(p){ return String(p.num)===String(num); })[0]; if(e) return e; }
    return arr[0];
  }
  (data.players||[]).forEach(function(r){
    if(!r.name){ sum.skip.push('팀원: 이름이 비어 있는 행'); return; }
    var patch={num:r.num, positions:r.positions, birth:r.birth, height:r.height, weight:r.weight, region:r.region, size:(SIZES.indexOf(r.size)>-1?r.size:''), status:r.status};
    var ex=findP(r.name, r.num);
    if(ex){
      var ch=Object.keys(patch).some(function(k){ return k==='positions' ? (ex.positions||[]).join('/')!==patch.positions.join('/') : !same(ex[k], patch[k]); });
      if(ch){ sum.pUpd++; if(!dry) Object.assign(ex, patch); }
    } else {
      sum.pAdd++;
      var np=Object.assign({id:nid('m'), clubId:AC, name:r.name, role:'팀원', photo:''}, patch);
      if(!dry) DB.players.push(np);
      (byName[r.name]=byName[r.name]||[]).push(np);
    }
  });
  function pidByName(name){
    var nmz=String(name||'').replace(/\(탈퇴\)\s*$/,'').trim(); if(!nmz) return null;
    var p=findP(nmz,''); if(p) return p.id;
    var ex=club.exPlayers||{}; for(var k in ex){ if(ex[k] && ex[k].name===nmz) return k; }
    return null;
  }
  // ── 경기 ──
  var mByKey={};
  function mKey(d,o){ return String(d)+'|'+String(o||'').trim(); }
  DB.matches.filter(inClub).forEach(function(m){ var k=mKey(m.date,m.opponent); (mByKey[k]=mByKey[k]||[]).push(m); });
  function findM(d,o,t){
    var arr=mByKey[mKey(d,o)]||[]; if(!arr.length) return null;
    if(arr.length>1 && t){ var e=arr.filter(function(m){ return cleanTime(m.time)===t; })[0]; if(e) return e; }
    return arr[0];
  }
  (data.matches||[]).forEach(function(r){
    if(!r.date || !r.opponent){ sum.skip.push('경기: 날짜/상대팀 없음'); return; }
    var patch={time:r.time, venue:r.venue, recMatch:r.recMatch, recAtt:r.recAtt, recGoal:r.recGoal, recAssist:r.recAssist};
    if(r.recMatch && r.our!=='' && r.opp!==''){ patch.ourScore=r.our; patch.oppScore=r.opp; patch.result=(r.our>r.opp?'W':(r.our<r.opp?'L':'D')); }
    var ex=findM(r.date, r.opponent, r.time);
    if(ex){
      var ch=Object.keys(patch).some(function(k){ return k==='time' ? cleanTime(ex.time)!==patch.time : !same(ex[k], patch[k]); });
      if(ch){ sum.mUpd++; if(!dry) Object.assign(ex, patch); }
    } else {
      sum.mAdd++;
      var nm=Object.assign({id:nid('g'), clubId:AC, date:r.date, opponent:r.opponent, createdAt:new Date().toISOString()}, patch);
      if(!dry) DB.matches.push(nm);
      var k=mKey(r.date,r.opponent); (mByKey[k]=mByKey[k]||[]).push(nm);
    }
  });
  // ── 득점·도움 ──
  (data.stats||[]).forEach(function(r){
    var m=findM(r.date, r.opponent, ''); if(!m){ sum.skip.push('득점·도움: 경기 없음 '+r.date+' '+r.opponent); return; }
    var pid=pidByName(r.player); if(!pid){ sum.skip.push('득점·도움: 선수 없음 '+r.player); return; }
    var g=r.goals||0, a=r.assists||0;
    var ex=DB.stats.filter(function(x){ return x.matchId===m.id && x.playerId===pid; })[0];
    if(ex){ if((ex.goals||0)!==g || (ex.assists||0)!==a){ sum.sUpd++; if(!dry){ ex.goals=g; ex.assists=a; } } }
    else if(g>0||a>0){ sum.sAdd++; if(!dry) DB.stats.push({matchId:m.id, playerId:pid, goals:g, assists:a}); }
  });
  // ── 출석 ──
  (data.att||[]).forEach(function(r){
    var m=findM(r.date, r.opponent, ''); if(!m){ sum.skip.push('출석: 경기 없음 '+r.date+' '+r.opponent); return; }
    var pid=pidByName(r.player); if(!pid){ sum.skip.push('출석: 선수 없음 '+r.player); return; }
    var st=ATT_CODE[r.status]; if(!st){ if(r.status) sum.skip.push('출석: 알 수 없는 상태 "'+r.status+'"'); return; }
    var ex=DB.attendance.filter(function(x){ return x.matchId===m.id && x.playerId===pid; })[0];
    if(ex){ if(ex.status!==st){ sum.aUpd++; if(!dry) ex.status=st; } }
    else { sum.aAdd++; if(!dry) DB.attendance.push({matchId:m.id, playerId:pid, status:st, checkedAt:null}); }
  });
  // ── 스쿼드 (명단 + 메모) ──
  var sqByName={}; DB.squads.filter(inClub).forEach(function(s){ sqByName[s.name]=s; });
  var dryMembers=[];   // dry-run 중 추가된 명단(중복 집계 방지)
  function memberOf(sid, pid){ return DB.members.filter(function(x){ return x.squadId===sid && x.playerId===pid; })[0] || dryMembers.filter(function(x){ return x.squadId===sid && x.playerId===pid; })[0]; }
  (data.squad||[]).forEach(function(r){
    if(!r.squad){ sum.skip.push('스쿼드: 이름 없는 행'); return; }
    var sq=sqByName[r.squad];
    if(!sq){ sq={id:nid('s'), clubId:AC, name:r.squad, createdAt:new Date().toISOString()}; sqByName[r.squad]=sq; sum.qAdd++; if(!dry) DB.squads.push(sq); }
    if(r.player){
      var pos=(!r.position || r.position==='미편성') ? '' : r.position;
      if(/^G\d+$/i.test(r.num)){   // 게스트
        var exg=DB.members.filter(function(x){ return x.squadId===sq.id && x.guest && x.gname===r.player; })[0];
        if(exg){ if((exg.position||'')!==pos){ sum.qmUpd++; if(!dry){ exg.position=pos; } } }
        else { sum.qmAdd++; if(!dry){ var gp=pos||'FW', gn=DB.members.filter(function(x){ return x.squadId===sq.id && x.position===gp; }).length, gd=posDefaultXY(gp,gn); DB.members.push({squadId:sq.id, playerId:'guest_'+now+'_'+(seq++), guest:true, gname:r.player, position:gp, x:gd.x, y:gd.y}); } }
        return;
      }
      var pid=pidByName(r.player); if(!pid){ sum.skip.push('스쿼드 '+r.squad+': 선수 없음 '+r.player); return; }
      var exm=memberOf(sq.id, pid);
      if(exm){
        if((exm.position||'')!==pos){ sum.qmUpd++; if(!dry){ exm.position=pos; if(!pos){ exm.x=null; exm.y=null; } else if(exm.x==null||exm.y==null){ var n1=DB.members.filter(function(x){ return x.squadId===sq.id && x.position===pos; }).length, d1=posDefaultXY(pos,n1); exm.x=d1.x; exm.y=d1.y; } } }
      } else {
        sum.qmAdd++;
        var n2=DB.members.filter(function(x){ return x.squadId===sq.id && x.position===pos; }).length;
        var d2=pos ? posDefaultXY(pos,n2) : {x:null,y:null};
        var mem={squadId:sq.id, playerId:pid, position:pos, x:d2.x, y:d2.y};
        if(!dry) DB.members.push(mem); else dryMembers.push(mem);
      }
    } else if(r.memo){
      var mm=r.memo.match(/^\[([^\]]*)\]\s*([\s\S]*)$/); var scope=mm?mm[1]:'전체', body=(mm?mm[2]:r.memo).trim();
      if(!body) return;
      var exn=DB.notes.filter(function(x){ return x.squadId===sq.id && String(x.scope||'전체')===scope && String(x.body||'').trim()===body; })[0];
      if(!exn){ sum.nAdd++; if(!dry) DB.notes.push({id:nid('n'), squadId:sq.id, phase:'req', scope:scope, body:body, author:'', authorId:''}); }
    }
  });
  sum.total=sum.pAdd+sum.pUpd+sum.mAdd+sum.mUpd+sum.sAdd+sum.sUpd+sum.aAdd+sum.aUpd+sum.qAdd+sum.qmAdd+sum.qmUpd+sum.nAdd;
  return {summary:sum, players:mockHandler('getPlayers',[]), matches:mockHandler('getMatches',[]), squads:mockHandler('getSquads',[])};
}

/* ================= 활동 로그 (입력·수정·삭제·접속 이력) =================
 * - 저장: Firestore logs/recent 문서 1개에 items 배열로 누적 (arrayUnion) → 기록 = 쓰기 1회, 조회 = 읽기 1회
 * - 보관: 최근 14일만. 로그 화면을 열 때 14일 지난 항목이 있으면 트랜잭션으로 잘라내어 저장 (그때만 쓰기 1회 추가)
 * - 사용자: PIN 통과 후 처음 한 번 이름 입력 → 기기(localStorage)에 저장, 로그마다 '이름 · 기기' 표시
 * - 접속: 기기당 하루 1회만 기록
 * - 항목: {t:시각, w:이름, v:기기, u:익명uid앞6자, k:종류(in/add/edit/del/etc), a:행위, d:상세}
 */
var WHO_KEY='kt_who', LOG_LAST_KEY='kt_log_access';
var LOG_DOC='recent', LOG_KEEP_DAYS=14, LOG_MAX=1500;
var LOG_ITEMS=[], LOG_LOADED=false;   // 서버 조회분 + 이번 세션 기록분 / 서버 조회 여부
var _logPending=[], _logT=null;
function whoName_(){ try{ return localStorage.getItem(WHO_KEY)||''; }catch(e){ return ''; } }
function devStr_(){
  var ua=navigator.userAgent||'';
  var os=/iPhone|iPad|iPod/.test(ua)?'iPhone':/Android/.test(ua)?'Android':/Windows/.test(ua)?'Windows':/Mac/.test(ua)?'Mac':'기타';
  var br=/KAKAOTALK/i.test(ua)?'카카오톡':/SamsungBrowser/.test(ua)?'삼성브라우저':/Edg\//.test(ua)?'Edge':/CriOS|Chrome/.test(ua)?'Chrome':/Safari/.test(ua)?'Safari':'브라우저';
  var pwa=false; try{ pwa=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||!!navigator.standalone; }catch(e){}
  return os+' '+br+(pwa?' 앱':'');
}
function logUid_(){ try{ var u=firebase.auth().currentUser; return u?String(u.uid).slice(0,6):''; }catch(e){ return ''; } }
function logCutoff_(){ return new Date(Date.now()-LOG_KEEP_DAYS*24*60*60*1000).toISOString(); }
function logTrim_(items){ var c=logCutoff_(); var a=items.filter(function(e){ return e && e.t && e.t>=c; }); a.sort(function(x,y){ return String(x.t).localeCompare(String(y.t)); }); if(a.length>LOG_MAX) a=a.slice(a.length-LOG_MAX); return a; }
/* ── 이름 등록 화면 (PIN 통과 직후 · 이미 통과한 기기는 다음 접속 때 한 번) ── */

/* ── 기록 ── */
function logEvent_(kind, act, detail){
  var e={t:new Date().toISOString(), w:whoName_()||'(이름 없음)', v:devStr_(), u:logUid_(), k:kind||'etc', a:act||'', d:String(detail==null?'':detail).slice(0,80)};
  LOG_ITEMS.push(e);
  _logPending.push(e);
  clearTimeout(_logT); _logT=setTimeout(logFlush_, 1500);   // 연속 작업은 한 번에 씀
  return e;
}
try{ document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden'){ clearTimeout(_logT); logFlush_(); } }); window.addEventListener('pagehide', function(){ clearTimeout(_logT); logFlush_(); }); }catch(e){}
var _logTries=0;
function _logRetry_(items){
  if(_logTries>=5) return; _logTries++;
  _logPending=items.concat(_logPending);
  clearTimeout(_logT); _logT=setTimeout(logFlush_, 4000);
}
function logFlush_(){
  var items=_logPending; _logPending=[];
  if(!items.length || !(window.db && FS.enabled)) return;
  // 인증 준비 전/오프라인이면 잠시 후 재시도 (최대 5회) — 기록 유실 방지
  var authed=false; try{ authed=!!(firebase.auth&&firebase.auth().currentUser); }catch(e){}
  var online=(typeof navigator.onLine==='boolean') ? navigator.onLine : true;
  if(!authed || !online){ _logRetry_(items); return; }
  try{
    var FV=firebase.firestore.FieldValue;
    db.collection('logs').doc(LOG_DOC).set({id:LOG_DOC, items:FV.arrayUnion.apply(FV, items), updatedAt:new Date().toISOString()}, {merge:true})
      .catch(function(e){ try{ console.warn('log write', e); }catch(_){} _logRetry_(items); });
  }catch(e){ _logRetry_(items); }
}
/* 스쿼드 편집처럼 잦은 작업: 같은 행위·대상이 10분 내 이미 있으면 생략 */
function logCoalesced_(kind, act, detail){
  var arr=LOG_ITEMS;
  for(var i=arr.length-1;i>=0;i--){
    var e=arr[i]; if(e.a===act && e.d===detail && e.w===(whoName_()||'(이름 없음)')){ if(Date.now()-new Date(e.t).getTime()<10*60*1000) return null; break; }
  }
  return logEvent_(kind, act, detail);
}
/* 접속: 기기당 하루 1회 */
function logAccess_(){
  var today=attToday_();
  try{ if(localStorage.getItem(LOG_LAST_KEY)===today) return; localStorage.setItem(LOG_LAST_KEY, today); }catch(e){}

/* 쓰기 작업 → 로그 문구 (mockHandler 실행 '전'에 호출: 삭제 대상 이름 조회 가능) */
function logDescribe_(fn, a){
  a=a||[];
  function pN(id){ var p=(DB.players||[]).filter(function(x){return x.id===id;})[0]; return p?p.name:'(선수)'; }
  function mD(id){ var m=(DB.matches||[]).filter(function(x){return x.id===id;})[0]; return m?(m.date+' vs '+(m.opponent||'')):'(경기)'; }
  function sN(id){ var s=(DB.squads||[]).filter(function(x){return x.id===id;})[0]; return s?s.name:'(스쿼드)'; }
  var SQ=['setSquadMember','setSquadPos','setSquadMemberPos','removeSquadMember','loadAllToSquad','addGuest'];
  switch(fn){
    case 'addPlayer': return ['add','팀원 등록', a[0]&&a[0].name];
    case 'updatePlayer': { var ex=(DB.players||[]).filter(function(x){return x.id===(a[0]||{}).id;})[0]||{}; var ph=(ex.photo||'')!==((a[0]||{}).photo||''); return ['edit','팀원 수정', (a[0]&&a[0].name)+(ph?' (사진 변경)':'')]; }
    case 'deletePlayer': return ['del','팀원 삭제', pN(a[0])];
    case 'addMatch': return ['add','경기 등록', a[0]&&(a[0].date+' vs '+(a[0].opponent||''))];
    case 'updateMatch': return ['edit','경기 수정', a[0]&&(a[0].date+' vs '+(a[0].opponent||''))];
    case 'deleteMatch': return ['del','경기 삭제', mD(a[0])];
    case 'recordMatchResult': return ['edit','경기 결과 입력', mD(a[0])+' '+a[1]+':'+a[2]];
    case 'setMatchStats': return ['edit','득점·도움 입력', mD(a[0])];
    case 'setMatchAttendance': return ['edit','출석 입력', mD(a[0])];
    case 'createSquad': return ['add','스쿼드 생성', a[0]||'새 스쿼드'];
    case 'deleteSquad': return ['del','스쿼드 삭제', sN(a[0])];
    case 'renameSquad': return ['edit','스쿼드 이름 변경', sN(a[0])+' → '+a[1]];
    case 'addNote': return ['add','메모 추가', sN(a[0])];
    case 'deleteNote': { var n=(DB.notes||[]).filter(function(x){return x.id===a[0];})[0]; return ['del','메모 삭제', n?sN(n.squadId):'']; }
    case 'updateClub': return ['edit','팀 정보 수정', ''];
    case 'setExPlayer': return ['edit','탈퇴 선수 이름 지정', a[2]||''];
    case 'restoreBackup': return a[1] ? null : ['etc','백업 복구', ''];
    default:
      if(SQ.indexOf(fn)>-1) return ['edit','스쿼드 편집', sN(a[0]), true];   // true = 10분 내 중복 생략
      return null;
  }
}
function logWrite_(fn, a, res, d){
  d=d||logDescribe_(fn, a); if(!d) return;
  if(fn==='restoreBackup'){ var s=res&&res.summary; if(!s||!s.total) return; d[2]=s.total+'건 반영'; }
  if(d[3]) logCoalesced_(d[0], d[1], d[2]); else logEvent_(d[0], d[1], d[2]);
}
function logConfig_(key){
  var L={ownerPinHash:'총관리자 PIN 변경', adminPinHash:'팀 관리자 PIN 변경', presentScore:'출석 점수', lateScore:'지각 점수', absentScore:'불참 점수', honors:'MVP 지정'};
  logEvent_('edit','설정 변경', L[key]||key);
}
/* ── 조회 화면 (최근 14일) ── */
var _logView={kind:'all', loading:false};
function openLogView_(){ _logView.kind='all'; renderLogView_(); logLoad_(); }
function logLoad_(force){
  if(LOG_LOADED && !force){ renderLogView_(); return; }
  if(!(window.db && FS.enabled)){ LOG_LOADED=true; LOG_ITEMS=logTrim_(LOG_ITEMS); renderLogView_(); return; }
  _logView.loading=true; renderLogView_();
  var ref=db.collection('logs').doc(LOG_DOC);
  ref.get().then(function(doc){
    kjRead_('logs','최근 로그',1);
    var server=((doc&&doc.exists&&doc.data()&&doc.data().items)||[]).slice();
    var seen={}; server.forEach(function(e){ seen[e.t+'|'+e.a+'|'+e.u]=1; });
    var merged=server.slice(); LOG_ITEMS.forEach(function(e){ if(!seen[e.t+'|'+e.a+'|'+e.u]) merged.push(e); });
    LOG_ITEMS=logTrim_(merged); LOG_LOADED=true;
    // 서버에 14일 지난 항목(또는 상한 초과)이 있으면 잘라서 저장 — 트랜잭션으로 다른 기기의 추가분 보존
    var c=logCutoff_();
    if(server.some(function(e){ return !e || !e.t || e.t<c; }) || server.length>LOG_MAX){
      db.runTransaction(function(tx){
        return tx.get(ref).then(function(d){
          var cur=((d&&d.exists&&d.data()&&d.data().items)||[]);
          tx.set(ref, {id:LOG_DOC, items:logTrim_(cur), updatedAt:new Date().toISOString(), trimmedAt:new Date().toISOString()}, {merge:true});
        });
      }).catch(function(e){ try{ console.warn('log trim', e); }catch(_){} });
    }
  }).catch(function(e){ toast('로그 조회 실패 · '+((e&&e.code)||'네트워크')); })
    .then(function(){ _logView.loading=false; renderLogView_(); });
}

function drawIcon_(ctx, name, cx, cy, size, tier, opt){

/* ================= 동기부여 모듈: 랭킹 레이스 · 마일스톤 뱃지 · 출석 스트릭 · 명예의 전당 ================= */

/* ── 랭킹 레이스 보드 ── */
function raceData_(){
  var ms=(state.recMatches||[]).filter(function(m){ return inPeriod(m.date); });
  var thisMonth=attToday_().slice(0,7);
  var msPrev=ms.filter(function(m){ return m.date && m.date.slice(0,7)<thisMonth; });
  function agg(list){
    var midSet={}; list.forEach(function(m){ midSet[m.id]=1; });
    var lateScore=(state.cfg&&state.cfg.lateScore!=null)?Number(state.cfg.lateScore):0.5;
    var absentScore=(state.cfg&&state.cfg.absentScore!=null)?Number(state.cfg.absentScore):-1;
    var o={};
    function bk(pid){ if(!o[pid]) o[pid]={g:0,a:0,att:0}; return o[pid]; }
    (state.recStats||[]).forEach(function(s){ if(!midSet[s.matchId]) return; var b=bk(s.playerId); b.g+=Number(s.goals)||0; b.a+=Number(s.assists)||0; });
    (state.recAtt||[]).forEach(function(x){ if(!midSet[x.matchId]) return; var b=bk(x.playerId);
      if(x.status==='present') b.att+=1; else if(x.status==='late') b.att+=lateScore; else if(x.status==='absent') b.att+=absentScore; });
    return o;
  }
  function ranks(o,key){
    return Object.keys(o).map(function(pid){ return {pid:pid, v:Math.round(o[pid][key]*10)/10}; })
      .filter(function(r){ return r.v>0; }).sort(function(x,y){ return y.v-x.v; });
  }
  var cur=agg(ms), prev=agg(msPrev);
  var attByM=attByMatch_((state.recAtt||[]));
  var statByM={}; (state.recStats||[]).forEach(function(x){ (statByM[x.matchId]=statByM[x.matchId]||{})[x.playerId]=x; });
  var today=attToday_();
  var msDesc=ms.filter(function(m){ return m.date && m.date<=today && attByM[m.id]; })
    .slice().sort(function(a,c){ return c.date.localeCompare(a.date); });
  var best=bestStreaks_(ms, state.recStats||[], state.recAtt||[]);
  var out={};
  ['g','a','att'].forEach(function(key){
    var rc=ranks(cur,key), rp=ranks(prev,key);
    var prevRank={}; rp.forEach(function(r,i){ prevRank[r.pid]=i+1; });
    out[key]=rc.map(function(r,i){
      var pr=prevRank[r.pid];
      return {pid:r.pid, name:pname_(r.pid).name, v:r.v, rank:i+1,
        mv:(pr==null)?null:(pr-(i+1)),
        streak:(best[r.pid]||{})[key]||0};
    });
  });
  return out;
}

function medal_(ctx,cx,cy,R,tier,icon){
  var col=tier.c;
  // 리본
  ctx.save();
  function ribbon(dx){
    ctx.save(); ctx.translate(cx+dx,cy+R*0.55); ctx.rotate(dx<0?0.35:-0.35);
    var g=ctx.createLinearGradient(0,0,0,R*1.15);
    g.addColorStop(0, shade_(CARD_RED,0.1)); g.addColorStop(1, shade_(CARD_RED,-0.3));
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.moveTo(-R*0.3,0); ctx.lineTo(R*0.3,0); ctx.lineTo(R*0.3,R*1.1); ctx.lineTo(0,R*0.88); ctx.lineTo(-R*0.3,R*1.1); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ribbon(-R*0.42); ribbon(R*0.42);
  ctx.restore();
  // 금속 원판
  ctx.save(); ctx.shadowColor='rgba(0,0,0,.55)'; ctx.shadowBlur=30; ctx.shadowOffsetY=12;
  var mg=ctx.createRadialGradient(cx-R*0.4,cy-R*0.45,R*0.1,cx,cy,R*1.25);
  mg.addColorStop(0,shade_(col,0.55)); mg.addColorStop(0.55,col); mg.addColorStop(1,shade_(col,-0.5));
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fillStyle=mg; ctx.fill(); ctx.restore();
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.lineWidth=R*0.05; ctx.strokeStyle=shade_(col,0.35); ctx.stroke();
  // 안쪽 링 + 테두리 별점
  ctx.beginPath(); ctx.arc(cx,cy,R*0.78,0,Math.PI*2); ctx.lineWidth=R*0.035; ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.stroke();
  for(var i=0;i<14;i++){ var a=i*Math.PI*2/14-Math.PI/2; goldStar_(ctx,cx+Math.cos(a)*R*0.89,cy+Math.sin(a)*R*0.89,R*0.05,a,'rgba(255,255,255,.8)'); }
  // 광택
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.clip();
  var gl=ctx.createLinearGradient(0,cy-R,0,cy); gl.addColorStop(0,'rgba(255,255,255,.35)'); gl.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=gl; ctx.fillRect(cx-R,cy-R,R*2,R); ctx.restore();
  // 아이콘 (아이보리 금속)
  drawIcon_(ctx, icon, cx, cy-R*0.12, R*0.78, 'ivory');
}

function trophy_(ctx,cx,cy,h){

  ctx.bezierCurveTo(cx-w*0.46,cy-h*0.05, cx-w*0.20,cy+h*0.06, cx,cy+h*0.06);
  ctx.bezierCurveTo(cx+w*0.20,cy+h*0.06, cx+w*0.46,cy-h*0.05, cx+w*0.42,cy-h*0.48);
  ctx.closePath(); ctx.fill();
  // 손잡이
  ctx.lineWidth=h*0.055; ctx.strokeStyle=g; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(cx-w*0.55,cy-h*0.30,h*0.16,Math.PI*1.15,Math.PI*0.35,false); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx+w*0.55,cy-h*0.30,h*0.16,Math.PI*0.65,Math.PI*1.85,true); ctx.stroke();
  // 기둥·받침

  ctx.beginPath(); ctx.moveTo(cx-w*0.24,cy+h*0.34); ctx.lineTo(cx+w*0.24,cy+h*0.34); ctx.lineTo(cx+w*0.17,cy+h*0.22); ctx.lineTo(cx-w*0.17,cy+h*0.22); ctx.closePath(); ctx.fill();
  ctx.restore();
  // 광택
  ctx.save(); ctx.globalAlpha=0.5;
  var hl=ctx.createLinearGradient(cx-w*0.3,0,cx-w*0.05,0); hl.addColorStop(0,'rgba(255,255,255,0)'); hl.addColorStop(0.5,'rgba(255,255,255,.8)'); hl.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=hl;
  ctx.beginPath(); ctx.moveTo(cx-w*0.30,cy-h*0.46); ctx.bezierCurveTo(cx-w*0.33,cy-h*0.05, cx-w*0.15,cy+h*0.04, cx-w*0.05,cy+h*0.05); ctx.lineTo(cx-w*0.10,cy-h*0.46); ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* 용량 초과 시: 이번 시즌 + 최근 12개월 경기의 하위 기록만 남긴다 */
function ktCacheTrim_(o){
  try{
    var curKey=seasonKeyOf_(attToday_());
    var d=new Date(); d.setMonth(d.getMonth()-12);
    var cut=d.toISOString().slice(0,10);
    var keep={};
    (o.matches||[]).forEach(function(m){ if(m.date && (seasonKeyOf_(m.date)===curKey || m.date>=cut)) keep[m.id]=1; });
    o.stats=(o.stats||[]).filter(function(x){ return keep[x.matchId]; });
    o.attendance=(o.attendance||[]).filter(function(x){ return keep[x.matchId]; });
    var kl={}; Object.keys(o.kidLite||{}).forEach(function(id){ if(keep[id]) kl[id]=1; });
    var km={}; Object.keys(o.kidMids||{}).forEach(function(id){ if(keep[id]) km[id]=1; });
    o.kidLite=kl; o.kidMids=km; o.trimmed=1;
  }catch(e){}
  return o;
}

/* 저장 권한 프로브: 로드 완료 후 소량 쓰기를 시도해 문제를 즉시 노출
 * (쓰기 절약을 위해 기기당 하루 1회만 수행) */
function fsWriteProbe_(){
  if(!window.db || !FS.enabled) return;
  try{
    var today = new Date().toISOString().slice(0,10);
    try{ if(localStorage.getItem('kt_probe') === today) return; localStorage.setItem('kt_probe', today); }catch(e){}
    db.collection('config').doc('app').set({probeAt:new Date().toISOString()}, {merge:true})
      .catch(function(e){
        try{ console.error('쓰기 프로브 실패', e); }catch(_){}
        window.__fsWriteErr=1;
        var code=(e&&e.code)||'';
        var msg;
        if(code==='resource-exhausted'){
          msg='⚠️ 일일 사용량 한도 초과\n\n오늘 사용할 수 있는 데이터 한도를 모두 소진했습니다.\n한도는 매일 한국시간 오후 4시경 자동으로 초기화됩니다.\n그때까지 저장·조회가 실패할 수 있습니다.';
        } else if(code==='permission-denied'){
          msg='⚠️ 데이터 저장 권한 오류\n\n지금 상태에서는 팀·경기 등 모든 저장이 실패합니다.\nFirebase 콘솔에서 (1) Firestore 규칙, (2) Authentication의 익명 로그인 사용 설정을 확인해주세요.';
        } else if(code==='unavailable' || code==='deadline-exceeded'){
          msg='⚠️ 네트워크 연결 불안정\n\n서버에 연결하지 못했습니다.\n잠시 후 다시 시도해주세요.';
        } else {
          msg='⚠️ 데이터 저장 오류\n\n저장에 실패했습니다. ('+(code||'원인 불명')+')\n잠시 후 다시 시도해주세요.';
        }
        setTimeout(function(){ alert(msg); }, 600);
      });
  }catch(e){}
}

/* 쓰기 작업별 '경기 id' 인자 위치 — 해당 경기 상세만 선로딩하기 위함 */
var MATCH_ARG = { setMatchStats:0, setMatchAttendance:0 };
function fsClean(x){ var c={}; for(var k in x){ if(k==='pw'||k==='pwHash'||k==='_row') continue; c[k]=x[k]; } return c; }
function fsSnapshot(keys){
  /* 변경 감지에는 값 비교만 필요 → 깊은 복사 대신 직렬화 문자열만 보관 (메모리·CPU 절감) */
  var s={}; keys.forEach(function(k){ var mm={}; (DB[k]||[]).forEach(function(x){ mm[FS_MAP[k].id(x)]=JSON.stringify(x); }); s[k]=mm; });
  return s;
}
function fsSyncDiff(k, beforeMap){
  var m=FS_MAP[k]; var after={}; (DB[k]||[]).forEach(function(x){ after[m.id(x)]=x; });
  var ops=[];
  Object.keys(after).forEach(function(idv){
    var cur=after[idv], prev=beforeMap[idv];
    if(prev===undefined || prev!==JSON.stringify(cur)) ops.push(['set', idv, fsClean(cur)]);
  });
  Object.keys(beforeMap).forEach(function(idv){ if(!after[idv]) ops.push(['del', idv]); });
  if(!ops.length) return;
  // Firestore 배치 한도(500) 대비 400개씩 순차 커밋
  var chain=Promise.resolve();
  for(var i=0;i<ops.length;i+=400){
    (function(part){
      chain=chain.then(function(){
        var batch=db.batch();
        part.forEach(function(op){ var ref=db.collection(m.coll).doc(String(op[1])); if(op[0]==='set') batch.set(ref, op[2], {merge:true}); else batch.delete(ref); });
        return batch.commit();
      });
    })(ops.slice(i, i+400));
  }
  chain.catch(function(e){ if(window.console)console.warn('fs sync '+k, e); toast('저장 동기화 실패 · 새로고침'); });
}
/* ── 변경 표식(rev) ──
 * 어떤 기기에서든 데이터를 바꾸면 config/app.rev 를 새 값으로 갱신한다.
 * 다른 기기는 접속할 때 이 값 1건만 읽어보고, 다르면 캐시를 버리고 다시 불러온다.
 * (캐시 유지 시간과 무관하게 '바뀐 내용은 바로' 반영되면서 읽기 사용량은 1건) */
var _revT=null;
function fsBumpRev_(){
  if(!window.db || !FS.enabled) return;
  clearTimeout(_revT);
  _revT=setTimeout(function(){
    var r='r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    FS._rev=r;

/* 서버의 rev와 캐시의 rev를 비교해 다르면 전체를 다시 불러온다 */
function fsRevCheck_(cachedRev){
  if(!window.db || !FS.enabled) return;
  db.collection('config').doc('app').get().then(function(sn){
    kjRead_('config','변경 확인',1);
    var rev=(sn && sn.exists && sn.data() && sn.data().rev) || '';
    FS._rev=rev;
    if(!rev){
      /* 서버에 아직 표식이 없다(이 기능 도입 직후). 관리자 기기에서 하나 발행해
         다음부터는 1건 비교만으로 판별되게 하고, 구버전 캐시는 한 번 새로 받는다. */
      try{ if(isAdmin()) fsBumpRev_(); }catch(e){}
      if(!cachedRev) return fsRefreshAll_();
      return;
    }
    if(!cachedRev) return fsRefreshAll_();               // 표식 없는 예전 캐시 → 새로 받기
    if(String(rev)===String(cachedRev)) return;          // 바뀐 것 없음 → 캐시 그대로
    return fsRefreshAll_();
  }).catch(function(){});
}
/* 앱을 다시 열었을 때(백그라운드 복귀)도 변경 여부만 1건 확인 — 최대 1분에 한 번 */

/* 해시 (Apps Script와 동일한 salt로 → 비밀번호 호환) */
function fsHash(pw){
  var enc=new TextEncoder().encode('FCJEMIRO#v1#'+String(pw));
  return crypto.subtle.digest('SHA-256', enc).then(function(buf){
    var hex=Array.prototype.map.call(new Uint8Array(buf), function(b){ return ('0'+b.toString(16)).slice(-2); }).join('');
    return 'v1:'+hex;
  });
}
/* ── 읽기 계측(진단용): 세션 동안 컬렉션별 읽은 문서 수 집계 ──
 * 콘솔에서 kjReads() 실행 시 표로 출력. 문제 원인 파악 후 제거 가능. */
window.__KJR = {n:0, byColl:{}, byCall:{}, t0:Date.now()};
function kjRead_(coll, tag, n){
  try{
    var R=window.__KJR; R.n+=n;
    R.byColl[coll]=(R.byColl[coll]||0)+n;
    var k=coll+' · '+tag;
    R.byCall[k]=(R.byCall[k]||0)+n;
    /* 자동 출력은 하지 않음 — 필요할 때 콘솔에서 kjReads() 실행 */
  }catch(e){}
}
window.kjReads = function(){
  var R=window.__KJR;
  var sec=Math.round((Date.now()-R.t0)/1000);
  try{
    console.log('=== Firestore 읽기 누계: '+R.n+'건 / 세션 '+sec+'초 ===');
    console.table(Object.keys(R.byCall).sort(function(a,b){return R.byCall[b]-R.byCall[a];})
      .map(function(k){ return {호출:k, 읽은문서:R.byCall[k]}; }));
  }catch(e){}
  return R.n;
};
/* 읽기 오류 공통 처리: 원인별 1회 안내 (규칙 문제와 한도 초과를 구분) */
function fsErr_(e, name){
  var code=(e&&e.code)||'';
  try{ console.error('읽기 실패 '+name+' ['+code+']', e); }catch(_){}
  if(window.__fsReadErr) return [];
  window.__fsReadErr=1;
  var msg;
  if(code==='resource-exhausted') msg='⚠️ 일일 사용량 한도 초과 · 오후 4시경 자동 복구';
  else if(code==='permission-denied') msg='⚠️ 데이터 읽기 권한 오류 · Firestore 규칙 확인 필요';
  else if(code==='unavailable'||code==='deadline-exceeded') msg='⚠️ 네트워크 연결이 불안정합니다';
  else msg='⚠️ 데이터를 불러오지 못했습니다 ('+(code||'원인 불명')+')';
  setTimeout(function(){ toast(msg); }, 800);
  return [];
}
function fsColl(name){ return db.collection(name).get().then(function(snap){ var a=[]; snap.forEach(function(d){ var o=d.data()||{}; a.push(o); }); kjRead_(name,'전체조회',a.length); return a; }).catch(function(e){ return fsErr_(e, name); }); }
/* ── 절약형 로딩: 부팅=핵심만 / 로그인=내 것 / 팀 입장=그 팀 것 / 화면=상세 ── */
function fsQ(coll, field, val){
  return db.collection(coll).where(field,'==',val).get().then(function(snap){ var a=[]; snap.forEach(function(d){ a.push(d.data()||{}); }); kjRead_(coll,'where '+field,a.length); return a; }).catch(function(e){ return fsErr_(e, coll); });
}
function fsQ2(coll, f1, v1, f2, v2){
  return db.collection(coll).where(f1,'==',v1).where(f2,'==',v2).get().then(function(snap){ var a=[]; snap.forEach(function(d){ a.push(d.data()||{}); }); kjRead_(coll,'where '+f1+'+'+f2,a.length); return a; }).catch(function(e){ return fsErr_(e, coll); });
}
function fsIn(coll, field, ids){
  ids=(ids||[]).filter(function(x){return x!=null&&x!=='';});
  if(!ids.length) return Promise.resolve([]);
  var chunks=[]; for(var i=0;i<ids.length;i+=10) chunks.push(ids.slice(i,i+10));
  return Promise.all(chunks.map(function(ch){
    return db.collection(coll).where(field,'in',ch).get().then(function(snap){ var a=[]; snap.forEach(function(d){ a.push(d.data()||{}); }); kjRead_(coll,'in '+field,a.length); return a; }).catch(function(e){ return fsErr_(e, coll); });
  })).then(function(rr){ var out=[]; rr.forEach(function(x){ out=out.concat(x); }); return out; });
}
function fsMerge(key, arr){

}

/* 경기 상세(득점/출석/명단): 그 팀 경기 id 기준 청크 조회 */
FS._kidMids={};   // cid -> {matchId:1} 득점·출석·명단까지 모두 로드된 경기
FS._kidLite={};   // cid -> {matchId:1} 득점·출석만 로드된 경기 (기록·통계용)
FS._kidsQ={};     // cid -> 직렬화 큐(동시 호출 시 동일 경기 중복 조회 방지)
function fsLoadMatchKids(cid, period){
  if(!cid) return Promise.resolve();
  var prev = FS._kidsQ[cid] || Promise.resolve();
  var next = prev.then(function(){ return fsLoadTeam(cid); }).then(function(){
    var loaded = FS._kidMids[cid] || (FS._kidMids[cid]={});
    // period 지정 시 그 시즌(YYYY 또는 YYYY-MM) 경기만, 없거나 '전체'면 전 경기
    var want=(DB.matches||[]).filter(function(m){
      if(m.clubId!==cid) return false;
      if(period && String(period).indexOf('S:')===0) return m.date && seasonKeyOf_(m.date)===String(period).slice(2);
      if(period && period!=='전체') return m.date && m.date.indexOf(period)===0;
      return true;
    }).map(function(m){return m.id;});
    var lite = FS._kidLite[cid] || (FS._kidLite[cid]={});
    var need=want.filter(function(id){ return !loaded[id] && !lite[id]; });
    if(!need.length) return;
    return Promise.all([ fsIn('playerStats','matchId',need), fsIn('attendance','matchId',need) ])
      .then(function(r){ fsMerge('stats',r[0]); fsMerge('attendance',r[1]); need.forEach(function(id){ lite[id]=1; }); ktCacheSave_(); });
  });
  FS._kidsQ[cid] = next.catch(function(){});   // 오류가 나도 큐가 막히지 않게
  return next;
}
/* 지정한 경기들의 상세(득점/출석/명단)만 로드 — 전 경기 로드 방지 */
function fsLoadKidsForMatches_(cid, ids){
  if(!cid || !ids || !ids.length) return Promise.resolve();
  var prev = FS._kidsQ[cid] || Promise.resolve();
  var next = prev.then(function(){ return fsLoadTeam(cid); }).then(function(){
    var loaded = FS._kidMids[cid] || (FS._kidMids[cid]={});
    var lite = FS._kidLite[cid] || (FS._kidLite[cid]={});
    var todo = ids.filter(function(id){ return id && !loaded[id]; });
    if(!todo.length) return;
    var fresh = todo.filter(function(id){ return !lite[id]; });          // 아무것도 안 실린 경기
    if(!fresh.length){ todo.forEach(function(id){ loaded[id]=1; }); return; }
    return Promise.all([ fsIn('playerStats','matchId',fresh), fsIn('attendance','matchId',fresh) ]).then(function(r){
      fsMerge('stats',r[0]); fsMerge('attendance',r[1]);
      todo.forEach(function(id){ loaded[id]=1; lite[id]=1; });
      ktCacheSave_();
    });
  });
  FS._kidsQ[cid] = next.catch(function(){});
  return next;
}
